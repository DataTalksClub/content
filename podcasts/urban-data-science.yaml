intro: 'How can cities use transport analytics, sensors and AI to become more liveable? In this episode
  Rachel Lim, an urban data scientist with a geography background and a master''s in urban data science,
  walks through practical ways data informs transport planning and placemaking. We cover core data sources—GPS,
  sensors, fare card systems, ride-hailing logs and computer vision for passenger flow—plus travel demand
  forecasting, real-time monitoring (including event analytics like F1), and operational responses such
  as traffic marshals and recovery services. <br><br> Rachel explains data engineering realities—Kafka,
  Apache Spark, real-time APIs, data pipelines and warehousing—alongside journey logic, fare computation
  and data quality management. She also explores emerging tools: generative AI for natural-language access,
  text-to-SQL architectures, synthetic data, and privacy practices for publishing masked datasets. The
  conversation highlights Singapore''s planning context, open data portals (data.gov.sg, DataMall), and
  project ideas for learners using parking and taxi datasets. <br><br> Listen to learn which transport
  analytics and sensor strategies produce actionable insights, how to set up robust data pipelines, and
  where to start hands-on projects to build liveable cities.'
