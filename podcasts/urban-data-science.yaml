context: 'Context: Cities are complex systems where transport, land use, public space and technology intersect;
  practitioners juggle short-term operations and long-term planning using streams of sensor, fare, and
  observational data while balancing livability, equity and privacy.

  Core narrative: A human-centered, data-driven approach to urban mobility—building robust, privacy-aware
  data pipelines that integrate real-time sensors, fare systems and observational sources, and leveraging
  predictive models and generative-AI interfaces—enables actionable insights for both operational responsiveness
  and strategic planning, ultimately shaping walkable, equitable, and livable cities through transparent
  open data, rigorous data quality, and interdisciplinary collaboration.'
