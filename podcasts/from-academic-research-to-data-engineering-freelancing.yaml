intro: How do you turn academic research and simulation expertise into a lean data consulting practice
  without getting bogged down in perfect solutions? In this episode we talk with Orell Garten, an electrical
  engineering graduate who focused on simulation algorithms, left a PhD during COVID, and learned through
  a government-funded startup program how to translate scientific research into real products. <br><br>
  Orell breaks down problem-first thinking, MVP strategy for data and simulation projects, and the practical
  steps involved in freelance practice building after academia. We explore how to apply rigorous simulation
  methods to client problems, prioritize minimal viable products over perfection, and navigate the transition
  from lab-based research to lean data consulting. <br><br> Listeners will come away with a clearer framework
  for deciding what to build first, how to validate assumptions with lightweight experiments, and how
  to position technical skills for consulting engagements. This episode is for researchers and engineers
  considering freelance work, consultants refining their MVP approach, and anyone interested in applying
  simulation methods and problem-first thinking to deliver practical data-driven solutions.
