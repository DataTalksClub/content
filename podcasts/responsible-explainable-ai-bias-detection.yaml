description: Discover Responsible AI & Explainable AI tactics for bias detection, fairness checks and
  governance, practical tools to build trustworthy, compliant ML models
intro: How do you detect bias, enforce fairness, and govern AI systems in production without sacrificing
  business outcomes? In this episode, Supreet Kaur — AVP on Morgan Stanley’s Data Strategy and Products
  team, founder of DataBuzz, and mentor at Columbia and Rutgers — walks through a practical roadmap for
  responsible AI and explainable AI grounded in real-world examples. <br><br> We define responsible AI
  and contrast it with post-hoc explainability, then unpack a credit decision bias case to show disparate
  outcomes in practice. Supreet outlines glass-box explainability techniques, data-level fairness checks
  (skewness, missingness, coverage), and EDA methods for bias detection. She covers PII handling, feature
  necessity assessments with SMEs and compliance, and automating data quality and monitoring. You’ll hear
  tool recommendations — What-If, Skater, AI Explainability 360, LIME, SHAP — plus approaches to local
  interpretability, drift and feedback-loop detection, and trade-offs between accuracy and interpretability.
  <br><br> Listeners will gain actionable guidance on bias detection, model interpretability, AI governance
  structures, and managing AutoML and regulated-industry risks — practical steps to make AI systems more
  fair, transparent, and accountable
