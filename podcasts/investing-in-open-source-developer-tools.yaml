description: 'Discover early-stage investing in open-source developer tools: deal sourcing, due diligence,
  and commercialization models for data, AI & developer tooling startups.'
intro: 'How do early-stage investors evaluate open-source developer tools — and what signals actually
  predict commercial success? In this episode, Bela Wiertz — who invests in early-stage open-source startups
  at a German family office focused on Data, AI & Developer Tooling — breaks down the investor playbook
  for sourcing, evaluating, and funding OSS companies. Drawing from hands-on deal flow and due diligence
  experience, Bela reveals how investors screen GitHub repositories, conduct developer interviews, and
  assess community engagement beyond vanity metrics like stars. <br><br> We explore the mechanics of open-source
  commercialization: open-core versus hosted services, enterprise licensing models, support revenue limitations,
  and why community-driven distribution creates unique investment opportunities. Bela explains practical
  due diligence techniques (co-investor reference checks, user adoption analysis, founder-market fit),
  funding stage dynamics from angel to seed rounds, and geographic investment patterns in European OSS
  startups. Real-world case studies include Hugging Face''s AI ecosystem play, Supabase''s Firebase alternative,
  Kong''s API gateway monetization, and Qdrant''s vector database positioning. <br><br> Listen to understand
  how investors think about open-source deal sourcing, what community metrics matter for fundraising,
  and which monetization models actually scale — essential insights for founders building OSS developer
  tools and investors evaluating this unique category.'
