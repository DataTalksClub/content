intro: How do you move ML work from research notebooks to reproducible, deployable full-stack systems?
  In this episode, Mihail Eric — founder of Pametan Data Innovation and Confetti.ai, former Stanford NLP
  researcher with industry experience at RideOS and Amazon Alexa, and author of papers in ACL, AAAI, and
  NeurIPS — tackles that exact challenge. We trace Mihail’s path from academic NLP to self-driving and
  conversational AI, then into hybrid roles that blend hypothesis-driven research with production engineering.
  <br><br> Key topics include research infrastructure for data collection and prototyping, experimental
  tooling (notebooks, Weights & Biases, fast prototyping), engineering stacks for deployment (PyTorch,
  Docker, cloud, web frameworks), and the full ML lifecycle. Mihail also breaks down cultural solutions
  — embedded teams, role fluidity, code reviews for researchers, and practical skills swaps so researchers
  learn reproducibility and engineers learn experimental rigor. <br><br> Listeners will get concrete guidance
  on building end-to-end ML systems, improving reproducibility and model deployment, and actionable career
  advice (internships, reading papers, reproducing models). Tune in to learn practical steps and tools
  to bridge research to production for real-world ML systems
