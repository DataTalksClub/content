description: 'Master causal inference for production ML: uplift modeling, treatment effects, counterfactuals,
  causal discovery, and LLM integration strategies.'
intro: 'How do you move from correlation to actionable decisions — using counterfactuals, uplift modeling,
  treatment effect estimation, and LLMs — without falling into confounding traps or biased estimators?
  In this episode, Aleksander Molak, an independent ML researcher, author and educator specializing in
  causality, NLP and AI strategy, walks through practical causal inference techniques for real-world machine
  learning applications. <br><br> We explore foundational concepts like counterfactuals and Judea Pearl''s
  causal hierarchy, then dive into meta-learners (T-learner, S-learner), Conditional Average Treatment
  Effect (CATE) estimation, uplift modeling, and when A/B testing or causal feature selection are essential
  for achieving unconfoundedness. Aleksander covers deployment challenges, debiasing methods (double/debiased
  ML), refutation testing for model validation, causal discovery algorithms, and cost-benefit analysis
  that uncovered wasted marketing spend. The conversation also examines how LLMs integrate into causal
  workflows: feature extraction from text, using text as outcomes or treatments, inferring unobserved
  confounders, and practical demonstrations with CausalBERT. You''ll gain actionable frameworks for building,
  evaluating, and deploying causal ML systems in production, plus resources and code examples to implement
  these methods in your own projects.'
