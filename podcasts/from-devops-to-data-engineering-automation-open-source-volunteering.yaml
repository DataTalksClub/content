context: 'Context: The episode traces a journey from hands-on technical beginnings (trade school, web
  design, C++, DevOps, automation) through burnout and volunteering, into community management, open source,
  NGO founding, career coaching, and a lifestyle experiment (off-grid living), while exploring personality,
  team fit, product focus, and practical processes applied across corporate and nonprofit settings.

  Core: This episode centers on intentionally aligning technical skills, systems-thinking problem solving,
  and personal values—leveraging automation, community, and experimentation—to design a sustainable, impact-driven
  career and life that bridges corporate, volunteer, and personal worlds.

  Key themes: transferable problem-solving and automation; values-driven career design; community & open
  source as leverage; translating corporate processes to NGOs; personality and team-fit for role choice;
  experimentation in lifestyle and governance.'
