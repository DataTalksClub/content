intro: How do you pivot from DevOps to data engineering without starting over? In this episode Agita Jaunzeme
  — a DevOps/DataOps engineer, manager, community builder and NGO founder — breaks down practical strategies
  for career transitions that center on automation, open source participation, and volunteering. <br><br>
  Agita draws on experience across corporate, startup, open source and non-governmental sectors and shares
  how automation and DevOps practices translate to data engineering and DataOps. We discuss using open
  source projects to build credibility, volunteering and community work to gain hands-on experience and
  networks, and concrete approaches to getting promoted or making purposeful career pivots. Agita also
  talks about designing work that aligns with passion and purpose, including founding an NGO to support
  expats and locals in Porto. <br><br> Listeners will come away with actionable ideas for bridging skill
  gaps, leveraging automation and open source contributions, and using volunteering as a pathway into
  data engineering roles. This episode is for DevOps professionals, aspiring data engineers, and career
  changers seeking pragmatic advice on transitions, promotions, and aligning work with meaningful impact.
