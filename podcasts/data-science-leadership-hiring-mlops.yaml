description: Discover data science leadership, recommender systems & MLOps tactics—hire, mentor and deploy
  models faster with practical frameworks and tips
intro: How do you lead a data science team that prioritizes product impact while building recommender
  systems, real-time bidding (RTB) solutions, and maintainable MLOps? In this episode, Mariano Semelman,
  Head of Data Science at OLX Group with over 13 years of experience, walks through practical leadership
  decisions that bridge models and products. <br><br> Mariano describes his shift from software development
  to data science leadership, daily responsibilities (meetings, mentoring, planning), and how he structures
  teams of data scientists and ML engineers. Key topics include product-first ML, search and recommender
  systems, advertising and RTB campaign optimization, CRISP-DM in production, diagnosing overfitting and
  feature issues, and pragmatic deployment patterns like start simple, fail fast, and iterative experiments.
  He also shares onboarding tactics (30-60-90 plans), feedback techniques ("ask permission, care, offer
  options"), one-on-ones, handling departures, code reviews as a manager, delegation through senior engineers,
  and hiring/remediation practices. <br><br> Listen to learn concrete approaches for prioritizing modeling
  time, running experiments in production, improving MLOps and NLP practices, and mentoring engineers
  to deliver measurable product outcomes
