intro: 'How do you run MLOps at scale so models stay deployed, reproducible, and actually adopted? In
  this episode Raphaël Hoogvliets—who leads a 12-engineer team at Eneco and brings a career arc from agriculture
  into data science and MLOps—walks through practical approaches for CI/CD for ML, reproducibility, model
  monitoring, and adoption strategy. <br><br> We cover the core trade-offs between speed and robustness,
  design choices for long-term maintainability, and the team coordination needed to scale ML: evangelists,
  tech translators, and technical leads. Raphaël explains why a centralized MLOps platform team often
  works as an enabling layer, how MLOps should support product teams, and how to drive adoption through
  iteration, feedback loops, and developer experience. You’ll hear concrete practices—CI, repo structure,
  parameterization, testing—plus reproducibility tactics like data versioning, traceability, and experiment
  capture. We also discuss KPIs (deployment frequency and impact tracking), skill mix, dependency management,
  container strategies, and real success and failure stories. <br><br> Listen to learn actionable priorities
  for getting started (start with CI/CD and solve tangible pain points), and how to measure and sustain
  model value through monitoring and operational processes.'
