description: Master CV optimization, take-home projects and mock interviews to land data science offers—learn
  SQL/ML prep, negotiation tactics and measurable project impact
intro: How do you make your data science application stand out, ace take-home projects, and negotiate
  an offer without leaving money on the table? In this episode, Oleg Novikov — creator of NextRound and
  former data science manager at Uber with a background in data and software engineering — walks through
  a practical data science interview guide covering CV optimization, take-home projects, mock interviews,
  and negotiation. <br><br> We dig into career trajectory from engineering to product data science, building
  projects that differentiate your application, and concrete product work like forecasting and LTV. Oleg
  demonstrates NextRound's mock-interview chatbot and personalized feedback, explains common hiring funnels
  (recruiter screen → take-home → interviews), and contrasts product data scientist vs. machine learning
  engineer expectations. You'll hear specific advice on treating your CV as a landing page, highlighting
  personal contributions, crafting case-study narratives from business goals to evaluation metrics, and
  preparing for technical assessments (ML fundamentals, SQL window functions, coding). We also cover handling
  rejection, replying graciously, evaluating offers, negotiation tactics when your current salary is low,
  and practical steps for PhDs breaking into industry. <br><br> Listen for actionable steps to refine
  your data science resume, prioritize take-home ROI, and use mock interviews to iterate faster
