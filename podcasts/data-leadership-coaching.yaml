intro: How do you move from a strong individual contributor into a data leader who can influence stakeholders,
  grow team impact, and build inclusive practices? In this episode Tereza Iofciu—data science manager,
  data scientist, data engineer, product manager, coach and community organizer—walks through her transition
  from a PhD in computer science to leading teams and running data leadership coaching. <br><br> We cover
  the practical challenges of the manager transition, experiments that shaped her coaching approach, and
  ways to scale manager bandwidth using the “pizza” span-of-control metaphor. Tereza breaks down feedback
  skills, psychological safety, and routines for team feedback training, plus leadership learning through
  workshops and frameworks. You’ll hear actionable guidance on increasing impact and promotions, making
  foundational data work visible with product mindsets and KPIs, and influencing without authority by
  framing projects to stakeholders’ priorities. The conversation also explores cross-functional and inclusive
  leadership, self-promotion versus bragging, and concrete coaching formats like one-shot sessions, CV
  reviews, and Calendly-driven delivery. <br><br> Listen if you want practical data leadership coaching
  on managing the IC-to-manager shift, stakeholder skills, and boosting your team’s measurable impact.
