intro: 'How do you build a sustainable data community that endures beyond meetup hype and founder energy?
  In this episode Alexey Grigorev, founder of DataTalks.Club, and Johanna Bayer, a researcher about to
  complete her PhD in machine learning for clinical neuroimaging at the University of Melbourne, discuss
  three years of community growth and evolution. <br><br> Alexey brings the perspective of launching and
  running a global data community, while Johanna contributes her background in psychology, computational
  neuroscience, and research software engineering, plus advocacy for open source and open science. Together
  they explore core topics around sustainable data community building: membership growth, volunteer and
  contributor roles, the intersection of research software engineering with community practice, and how
  open source and open science principles support longevity. <br><br> Listeners will come away with concrete
  considerations for creating and maintaining a data-focused community—practical lessons on community
  governance, contributor engagement, and aligning technical and social infrastructure—making this episode
  valuable for anyone building a dataTalks-style group, open source project, or research software community.'
