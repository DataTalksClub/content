intro: How do you move from point estimates to full uncertainty-aware models and choose the right tools
  and workflows for Bayesian modeling? In this episode Rob Zinkov, a machine learning engineer and former
  Indiana University research scientist who led development of the Hakaru probabilistic programming language,
  walks through practical Bayesian workflows and tool choices. We cover the core challenge of encoding
  priors, likelihoods, and posteriors; why integrals become intractable and how numerical integration
  and sampling (MCMC, Hamiltonian Monte Carlo, NUTS) approximate expectations; and the trade-offs between
  probabilistic languages and libraries. Rob explains career lessons on moving from software engineering
  to ML research, the essential math (calculus, linear algebra, optimization), and self-study strategies
  for statistics. Concrete topics include PyMC examples (a rainfall model and computational graph), Stan’s
  advances in efficient sampling, composing hierarchical and spatial models, diagnosing multimodality
  and uncertainty, and automating model tasks with probabilistic programming (Hakaru). Listen to gain
  a clearer, practical understanding of Bayesian modeling, when to use PyMC vs Stan, how samplers work,
  and recommended resources to build your workflow.
