context: 'Context: This episode centers on Rob Zinkov and the Hakaru probabilistic programming project,
  tracing his career shift into Bayesian machine learning, contrasting tools (Hakaru, PyMC, Stan), and
  practical techniques (priors, likelihoods, sampling, MCMC/HMC/NUTS) alongside the skills and learning
  resources needed to apply them.

  Central narrative: Probabilistic programming and the Bayesian workflow offer a practical, composable
  way to bring honest uncertainty quantification into real-world problems by turning statistical models
  into executable programs—models you can build incrementally, check, and refine. The core unifying idea
  is that encoding assumptions as programs makes intractable integrals manageable through numerical approximation
  (sampling and MCMC), lets you compose and reuse model parts, and shifts modeling toward an iterative,
  testable practice; doing this effectively requires foundational math and a mindset of principled model-building
  rather than chasing point estimates.'
