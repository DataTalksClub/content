notes: "In this episode, we dive deeper into feature stores with Willem, creator of Feast (an open-source\
  \ feature store). Previously, Willem led the Data Science Platform team at Gojek and now works at Tecton,\
  \ which develops feature store technology.\n\nHere's what we covered:\n\n- [Willem's journey from mechatronic\
  \ engineering to building Feast at Gojek](#guest-introduction-from-engineering-to-feature-store-creator)\n\
  - [What feature stores actually do and why ML teams need them](#what-is-a-feature-store-core-problems-and-solutions)\n\
  - [Understanding the hype: real value vs marketing noise](#why-feature-stores-are-popular-separating-hype-from-value)\n\
  - [How feature stores solve organizational problems like team silos and duplication](#team-silos-duplication-and-organizational-friction)\n\
  - [What an ideal feature store setup looks like in production](#ideal-setups-real-world-examples-and-when-to-use-feature-stores)\n\
  - [How feature stores integrate with Kubeflow, dbt, and other ML tools](#how-feature-stores-fit-with-kubeflow-dbt-and-other-ml-tools)\n\
  - [Comparing Feast and Tecton: open source vs enterprise solutions](#feast-vs-tecton-open-source-vs-enterprise-feature-store-solutions)\n\
  - [Breaking down the architecture: storage, transformations, and APIs](#feature-store-architecture-storage-transformations-and-apis)\n\
  - [Getting started: resources and hands-on learning paths](#resources-and-hands-on-learning-where-to-start-with-feature-stores)\n\
  - [Production workflows including validation, streaming, and tech choices](#production-workflows-validation-streaming-and-technology-choices)\n\
  - [Feature ownership and governance strategies](#who-should-own-features-governance-and-migration-strategies)\n\
  \n## Guest Introduction: From Engineering to Feature Store Creator\n\n**Q: Before we dive into feature\
  \ stores, could you tell us about your professional background and how you became involved in this space?**\n\
  \n**Willem:** Sure. I'm South African and studied mechatronic engineering, though I was always most\
  \ interested in the software side. During university, I started and sold a networking company, then\
  \ worked in control systems and automation—basically the intersection of traditional engineering and\
  \ software—for about three years.\n\nI moved to Asia and worked across the stack, from low-level devices\
  \ up to the cloud, building vertically integrated solutions for large enterprises. That led me into\
  \ large data solutions and analytical warehousing. Later, I moved to Singapore as the first engineering\
  \ hire for a new data science team at Gojek. They had lots of products and data but struggled to productionize\
  \ models, so I led a team focused on that for about four years. We built an ML platform and, in particular,\
  \ feature stores. Since that became my main focus, I joined Tecton to continue building in that space.\n\
  \n## What is a Feature Store? Core Problems and Solutions\n\n**Q: Let's start with the fundamentals.\
  \ What is a feature store, and what specific problems does it solve for machine learning teams?**\n\n\
  **Willem:** A feature store is an operational data system built specifically for machine learning. It’s\
  \ opinionated about ML problems such as:\n\n* Getting offline features into an online production environment\n\
  * Ensuring online–offline consistency so features models are trained on match what's served in production\n\
  * Letting data scientists ship features to production without relying on product engineers\n* Versioning\
  \ and managing transformation code\n* Enabling sharing and reuse of features to avoid duplication across\
  \ teams\n* Monitoring data quality and drift, both online and for training datasets\n\nNot all feature\
  \ stores cover everything. For example, Feast doesn't handle transformations, while others like Tecton\
  \ do. There's ongoing discussion about what should fall within a feature store's scope.\n\n**Q: When\
  \ you mention \"transformations,\" are you referring to the process of converting raw data from warehouses,\
  \ data lakes, or streams into features before they're stored in the feature store?**\n\n**Willem:**\
  \ Exactly. A feature store sits between raw data sources (streams, warehouses, lakes) and your production\
  \ ML environment. If it supports transformations, it should be able to act on any of those sources and\
  \ provide a serving layer that decouples ML from the underlying data infrastructure.\n\n**Q: What does\
  \ the user interface look like for data scientists? Do they interact with feature stores using familiar\
  \ tools like SQL?**\n\n**Willem:** There are two parts: creation and retrieval. For creation, stores\
  \ that support transformations typically offer Python/PySpark or SQL to define features, then materialize\
  \ them into storage like DynamoDB or Redis. For retrieval in production, you usually call an API rather\
  \ than using SQL, because online inference is mostly key-value enrichment of tabular data and needs\
  \ predictable performance. Some systems also support real-time \"on-demand\" transformations at request\
  \ time—for example, fraud detection—when you need to combine live request metadata with precomputed\
  \ features.\n\n**Q: Could you give us a concrete example of how this works in practice? For instance,\
  \ in an e-commerce fraud detection scenario where a transaction comes in, does the system retrieve the\
  \ user's features from the feature store using their ID?**\n\n**Willem:** That’s right.\n\n## Why Feature\
  \ Stores Are Popular: Separating Hype from Value\n\n**Q: Feature stores have become a very popular topic\
  \ in the ML community. What's driving all this interest and excitement?**\n\n**Willem:** Partly general\
  \ MLOps hype and market dynamics—people specialize to stand out. But there's real value: many companies\
  \ tried ML at scale and learned that data—especially feature creation and iteration—is most of the work.\
  \ A feature store sits between data scientists and production decisioning, so it can unlock significant\
  \ business impact through reuse, speed, and consistency. Of course, vendor marketing contributes to\
  \ the noise, but the underlying problems are real and important.\n\n## Team Silos, Duplication, and\
  \ Organizational Friction\n\n**Q: Would you say the challenges that feature stores address are primarily\
  \ technical problems or more organizational and process-related issues?**\n\n**Willem:** Both. The list\
  \ I gave has technical aspects, but the pain often starts organizationally:\n\n* **Shipping features\
  \ without engineers:** Product teams have their own OKRs, so data scientists become dependent and blocked.\
  \ A feature store reduces that dependency\n* **Sharing and reuse:** Teams are siloed, with limited communication\
  \ and no standard way to publish semantics, dependencies, and intent of features. A feature store provides\
  \ a central, trusted layer\n* **Quality and monitoring:** Ensuring only valid, monitored data reaches\
  \ models is both a process and a platform concern\n\nIn short, feature stores address technical consistency\
  \ and performance while easing organizational friction around ownership, reuse, and speed to production.\n\
  \n**Q: Many teams build their own ML services to solve local problems, but in practice there's a lot\
  \ of overlap—especially around user-based features. Teams often re-implement the same things from scratch.\
  \ This seems like an organizational issue, right?**\n\n**Willem:** Exactly. A lot of organizations embed\
  \ ML folks into vertical product teams. Take a fraud team and an analytics team: they model the same\
  \ entities—users, orders—so many features are reusable. But the fraud team may keep work private, so\
  \ duplication happens. From a CDO/CIO perspective, duplicated data and effort is pure inefficiency.\
  \ You can fix it with organizational changes, technology, or both.\n\n**Q: So the solution would be\
  \ to add a shared layer across teams—some kind of central platform. Is that where an ML platform and\
  \ feature store come into play?**\n\n**Willem:** Yes. Think of the ML lifecycle: transformations and\
  \ storage, training, deployment, serving, experimentation. A feature store spans the transformation\
  \ and serving parts. With a common platform, data scientists don’t need to wait on product engineers\
  \ with other OKRs—especially if features are precomputed and regularly loaded into the store. They can\
  \ discover features, train models, and ship faster.\n\n## Ideal Setups, Real-World Examples, and When\
  \ to Use Feature Stores\n\n**Q: What would an ideal feature store setup look like from a practical standpoint?**\n\
  \n**Willem:** You write only transformations—no boilerplate. The system materializes and backfills features\
  \ to offline and online stores. Models hit an API to enrich entities like user IDs at low latency. You\
  \ deploy a simple model wrapper to production without a dedicated engineer. And a validation/monitoring\
  \ layer ensures only good data reaches models.\n\n**Q: Are there companies that actually have this kind\
  \ of end-to-end setup in production today?**\n\n**Willem:** Some do. Commercial platforms like Tecton\
  \ provide a full flow—transformations, serving, monitoring. Feast, on the other hand, doesn’t handle\
  \ transformations; you plug it in after upstream systems like dbt or Airflow/Spark.\n\n## How Feature\
  \ Stores Fit with Kubeflow, dbt, and Other ML Tools\n\n**Q: How do tools like Kubeflow Pipelines fit\
  \ into this ecosystem, and where do they overlap or complement feature stores?**\n\n**Willem:** Great\
  \ for model training—not for data transformations. Different tools cover different lifecycle stages.\n\
  \n## Feast vs Tecton: Open Source vs Enterprise Feature Store Solutions\n\n**Q: Could you give us a\
  \ quick overview of Feast and how it differs from other feature store solutions?**\n\n**Willem:** Feast\
  \ is an open-source feature store we built at Gojek (co-developed with Google Cloud). It ingests precomputed\
  \ features from batch or streams, builds point-in-time-correct training sets, and serves online features\
  \ at low latency through a unified API. We didn't focus heavily on a discovery UI because many organizations\
  \ preferred duplicating pipelines to protect production. Feast decouples ML from data infrastructure\
  \ and keeps training/serving access consistent.\n\n**Q: How does Tecton compare to Feast, and what are\
  \ the key differences in their approach?**\n\n**Willem:** Tecton is a fuller enterprise platform: batch/stream/on-demand\
  \ transformations, UI, monitoring, security, audit, compliance—the works. It’s for teams that want a\
  \ turnkey solution now. Feast suits teams that prefer a “small tool in a larger stack.”\n\n## Feature\
  \ Store Architecture: Storage, Transformations, and APIs\n\n**Q: Let's break down the architecture.\
  \ What are the core components that make up a typical feature store system?**\n\n**Willem:** Five pieces:\n\
  \n1. **Transformation engine** (Spark, SQL/warehouse) over streams and batch\n2. **Storage**: offline\
  \ (lake/warehouse like Delta/BigQuery/Snowflake) and online (low-latency KV like Redis/DynamoDB)\n3.\
  \ **Serving layer** (API/SDK)\n4. **Registry** (definitions of sources, entities, transforms that the\
  \ system materializes as jobs/infrastructure)\n5. **Monitoring/ops** (ingestion metrics, distributions,\
  \ drift; logging served features for validation and training reuse). Advanced platforms add a discovery\
  \ UI tied to the registry\n\n**Q: When should a team consider adopting a feature store, and when might\
  \ it be overkill or not the right solution?**\n\n**Willem:** It shines for online/tabular scenarios—fraud\
  \ detection, recommendations, risk scores, pricing/ranking—where you enrich entities with features and\
  \ need train/serve consistency. If you only do batch scoring or campaigns, you can often get by with\
  \ SQL, BigQuery ML, and dbt/Great Expectations (though Tecton still helps with transforms/monitoring).\
  \ For unstructured-heavy workloads like images/text, the value is mostly in serving/consistency; reuse\
  \ benefits are smaller.\n\n**Q: What does the adoption process look like for teams that want to implement\
  \ a feature store? How do they get started?**\n\n**Willem:** \n\n* **Feast:** Keep transforms upstream\
  \ (dbt/Airflow/Spark). Register transformed tables/schemas, ingest from batch/streams, materialize to\
  \ online, use the unified API for training and serving\n* **Tecton:** Point it at raw logs/events and\
  \ define transforms inside the platform. It sits between data infrastructure and production serving,\
  \ covering more of the lifecycle\n\n**Q: With features, each column should have a clear identity and\
  \ intent. If it's just a binary blob, other teams won't discover or reuse it. Is that a fair assessment?**\n\
  \n**Willem:** Exactly. You can serve blobs online, but they'll be single-use. That doesn't build team-wide\
  \ efficiency.\n\n**Q: What about a scenario where an image model outputs \"probability this is a car\"\
  ? We store that score as a feature and fetch it online by image ID. Would this be a good use case for\
  \ a feature store?**\n\n**Willem:** Perfect. Store outputs like `is_car` (0/1) and `p_car` (e.g., 0.7).\
  \ Those are great downstream features. What you *don't* usually do is store the raw image in the feature\
  \ store. The request will carry a pointer like an S3 URL; you fetch the image elsewhere, run the model,\
  \ then write the **output** back—often into a stream that flows into the feature store. Models are just\
  \ transformations; their outputs become new features.\n\n## Resources and Hands-on Learning: Where to\
  \ Start with Feature Stores\n\n**Q: For an individual contributor who wants to learn about feature stores,\
  \ where would you recommend they start their learning journey?**\n\n**Willem:** The MLOps community\
  \ (DataOps, Open-source, General channels) has tons of material. The Tecton blog has deeper thinking\
  \ on the category. Hands-on: go to **feast.dev**, run Docker Compose, and try the example notebook.\
  \ Feast docs also cover when to use—or not use—a feature store. Look at real organization write-ups\
  \ too, like Monzo's lightweight approach.\n\n## Production Workflows: Validation, Streaming, and Technology\
  \ Choices\n\n**Q: What does a typical workflow look like for creating features, testing them offline,\
  \ and ensuring consistency between offline training and online serving?**\n\n**Willem:** Treat **streaming**\
  \ and **batch** separately. Build validations at four points:\n\n1. Streaming ingestion/transform\n\
  2. Batch transform (pre-ingestion to offline store)\n3. Training set build (pre-train)\n4. Serving time\
  \ (pre-serve/model side)\n\nUse tools like **Great Expectations** or **TFDV**. With no feature store,\
  \ you’ll write more boilerplate checks in serving code.\n\n**Q: When it comes to building real-time\
  \ features, how do you choose between technologies like Flink versus Spark?**\n\n**Willem:** I like\
  \ **Flink**—great API and technology. We use **Spark** with Feast for its ecosystem and connector support\
  \ and because it runs easily across clouds and on-premises. Cloud support for Flink is improving, so\
  \ parity is getting closer.\n\n**Q: What APIs and programming interfaces do you typically use for defining\
  \ transformations in feature stores?**\n\n**Willem:** In **Tecton**: PySpark, Spark SQL, or warehouse\
  \ SQL (Snowflake/BigQuery) for batch; Python for on-demand/request-time transforms. **Feast** doesn’t\
  \ handle transforms today (we’re considering on-demand, but unifying offline/online parity is tricky).\n\
  \n**Q: At what organization size does it make sense to invest in a feature store? When is it worth the\
  \ complexity?**\n\n**Willem:** Historically, when you have multiple use cases or teams. We'd love to\
  \ make it valuable for a single data scientist on a single project, but today it's most effective when\
  \ a platform team serves several solution teams. For a tiny startup (one data engineer + one data scientist),\
  \ it's often overkill—until ML becomes core, use cases multiply, and teams decouple.\n\n**Q: If a company\
  \ starts without a feature store and grows into needing one, is it difficult to adopt later, or can\
  \ they migrate relatively smoothly?**\n\n**Willem:** The main friction is where **transformations**\
  \ live. If you already use dbt/Airflow/Spark, adding Feast is simple (it consumes transformed data).\
  \ With Tecton, decide whether to keep transforms upstream or move them into Tecton. Greenfield projects\
  \ may choose Tecton; brownfield projects might keep existing pipelines.\n\n**Q: How well do dbt and\
  \ feature stores work together? Is this a common and effective combination?**\n\n**Willem:** Yes. Warehouses\
  \ (BigQuery/Snowflake) are dominant; dbt covers 80–90% of batch transforms for many organizations. Analysts\
  \ can contribute SQL-based features that drive the bottom line—dbt plus a feature store enables that.\n\
  \n**Q: How do you handle backfilling new features with historical data? What's the typical process?**\n\
  \n**Willem:** **Feast:** Upstream jobs backfill; then you call Feast to (re)ingest to online.\n**Tecton:**\
  \ Change the transform; Tecton detects what's missing and backfills from the chosen start date automatically.\n\
  \n## Who Should Own Features? Governance and Migration Strategies\n\n**Q: From an organizational perspective,\
  \ who should own features? Should it be the source teams, the consuming teams, or a central platform\
  \ group?**\n\n**Willem:** Don’t gatekeep early. Let use-case teams create features and iterate. As reuse\
  \ patterns emerge, a central team can assume ownership of critical or duplicated features—curate “golden”\
  \ sets and coordinate deduplication. Ownership should follow importance and production impact.\n\n**Q:\
  \ How do feature stores differ from traditional ETL processes combined with a data catalog? What makes\
  \ them distinct?**\n\n**Willem:** A feature store is an **opinionated, ML-operational** data system.\
  \ It unifies **offline** and **low-latency online** serving with **identical semantics** for train/serve.\
  \ Classic data platforms/catalogs don’t focus on that online path or parity. A feature store bridges\
  \ data and ML platforms.\n\nThank you for joining us today, Willem. This conversation really clarified\
  \ where feature stores help and where they might not be the right solution."
