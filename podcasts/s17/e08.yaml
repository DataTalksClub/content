summary: |-
  Reem Mahmoud is Director of Data Science at intervu.ai, an HR tech startup that builds AI video
  interviews. She trained as an electrical engineer, took her first AI course by accident in the
  last year of her bachelor's, and went on to a master's and a PhD on transfer and multitask
  learning from limited data. During the PhD she co-founded an AI education startup, and she joined
  intervu.ai as one of its first team members a few months before finishing. Alexey invited her to
  talk about building machine learning products.

  Reem says the move from PhD to industry was not hard for her, partly because she had already
  consulted on industry projects. The harder part was how others saw her. People assumed that a PhD
  graduate would stay in an academic mindset, and recruiters were unsure whether years of research
  count as work experience. At intervu.ai, candidates do a 15 to 20 minute interview with an avatar
  called Isa. The system scores soft skills against levels the recruiter sets for the role and
  returns a ranked list. Recruiters make the decisions, and candidates below a level are not
  rejected automatically.

  Answering a listener's question about the path of an ML project, Reem starts with understanding
  the problem together with stakeholders and domain experts. Psychologists on her team supplied
  scoring criteria in a spreadsheet, which turned a vague goal into a data science problem. In
  parallel comes access to data, using proxy data or interviews collected from people the team
  knows. She prefers the simplest model first, warns against adopting a full MLOps stack too early,
  and stresses regular iteration. When early interviews produced short answers, the team made the
  questions more specific and added guidelines telling candidates that an AI assesses them.

  Reem argues that LLMs should not change this process. A GPT cannot score an interview against
  detailed criteria on a fine scale, and generated synthetic interviews lacked variety and clearly
  bad answers. She sees LLMs as useful for the interface and orchestration layer, such as an avatar
  that reacts to the candidate. To reduce bias, several people score each interview, criteria are
  broken into small standardized checks, and scoring panels meet regularly to calibrate. Audio and
  video are not used to assess soft skills because the literature does not support them.

  For people who want to grow in the field, she recommends the DataTalks.Club Zoomcamps, projects
  that resemble real team work such as those at Omdena, and active communities like DataTalks.Club
  and the MLOps Community.
