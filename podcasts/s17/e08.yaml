intro: 'Reem Mahmoud, Director of Data Science at intervu.ai, talks with Alexey about building machine
  learning products at an HR tech startup that runs AI video interviews. Reem trained as an electrical
  engineer, did a master''s and a PhD on transfer and multitask learning from limited data, co-founded
  an AI education startup during her PhD, and joined intervu.ai as one of its first team members. <br><br>
  The conversation covers moving from a PhD into industry, how an avatar interviewer assesses soft skills
  and ranks candidates for recruiters, and the steps of an ML project: understanding the problem, working
  with domain experts such as psychologists who define scoring criteria, getting access to data or proxy
  data, starting with the simplest model, keeping MLOps tooling minimal, and iterating on both data collection
  and user experience. <br><br> Reem also explains why she does not hand interview scoring to a GPT, where
  LLMs help as an interface layer, why synthetic interviews did not work, and how multiple raters, standardized
  criteria and calibration sessions reduce bias in the labels.'
