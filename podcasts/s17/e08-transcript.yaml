podcast: production-ml-search-vector-search-embeddings-hybrid-search
segments:
- header: Episode Introduction
- line: Hi everyone, welcome to our event. This event is brought to you by DataTalks.Club, which is a
    community of people who love data. We have weekly events. Today is one of such events. If you want
    to find out more about the events we have, there is a link in the description. Go there, click on
    that link and you'll see many events we have in our pipeline. Actually, right now there are quite
    a few of them, so go check it out.
  sec: 0
  time: 0:00
  who: Alexey
- line: Then do not forget to subscribe to our YouTube channel. This way you will get notifications about
    future streams like the stream we have today. And we have an amazing Slack community where you can
    hang out with other data enthusiasts. During today's interview, you can ask any question you want,
    but Slido does not work for some reason today, so ignore that part of the slide. Just use live chat
    for asking questions, and I will keep an eye on the questions because I have them on my phone here.
  sec: 23
  time: 0:23
  who: Alexey
- line: So ask your questions during the interview in the live chat. I will stop sharing right now. So
    just use the live chat, ask your questions, and then I'll be keeping an eye on these questions. And
    I think that's pretty much it. Now I am opening the questions we prepared for you, but mostly you
    yourself prepared.
  sec: 55
  time: 0:55
  who: Alexey
- line: I'm a huge fan of the community, by the way, so I do encourage everyone to join the Slack. And
    I also have your events set up on my Google Calendar, so I'm always up to date with them. So you guys
    do great things.
  sec: 76
  time: '1:16'
  who: Reem
- line: Thank you. You're setting a very good example. That's what everyone should do. Okay, I just want
    to make sure I pronounce your name correctly. It's Reem?
  sec: 91
  time: '1:31'
  who: Alexey
- line: Yeah, so it's like long "e", right. Yeah, if you know French, it's like an "i". R-i-m is also
    another way you can pronounce it.
  sec: 100
  time: '1:40'
  who: Reem
- line: I learned French like 10 years ago. I actually spent one year learning French and now I cannot
    even count to 10.
  sec: 110
  time: '1:50'
  who: Alexey
- line: I get that. I actually studied French all of my elementary and high school and I can barely put
    a proper sentence together.
  sec: 120
  time: '2:00'
  who: Reem
- line: Yeah, I remember how to say "I do not speak French." That was very useful when I lived in France.
    Yeah, probably if I start living in a French-speaking country again, then it will come back. But now
    I live in Germany, I don't need French.
  sec: 131
  time: '2:11'
  who: Alexey
- line: Yeah, German displaced all the French, like, immediately.
  sec: 148
  time: '2:28'
  who: Reem
- header: 'Guest introduction: Reem Mahmoud, intervu.ai'
- line: Anyways, let's start. So this week we will talk about building machine learning products and teams,
    and we will see where it goes. Originally the topic was that, but we changed the questions a little
    bit in between. But we have a very special guest today, Reem. Reem is the director of data science
    at intervu.ai. Do I pronounce it correctly? Intervu?
  sec: 156
  time: '2:36'
  who: Alexey
- line: Yeah, intervu.ai.
  sec: 183
  time: '3:03'
  who: Reem
- line: Which is an HR tech startup. She has a lot of experience in training and mentoring people in the
    data space. She also co-founded an AI education company and has skilled more than 3,000 people in
    total. She has over 8 years of experience in the data space and she also has a PhD. And you researched
    transfer learning, right?
  sec: 183
  time: '3:03'
  who: Alexey
- line: Yes, machine learning from limited data. Yeah, exactly. Transfer learning was essentially where
    that led.
  sec: 211
  time: '3:31'
  who: Reem
- line: So yeah, welcome to the interview, to our event.
  sec: 219
  time: '3:39'
  who: Alexey
- line: Thank you. It's a pleasure to be here. Like I said, a huge fan of what you guys do, so I was very
    happy to get the chance to be here and contribute back in some way.
  sec: 222
  time: '3:42'
  who: Reem
- line: Yeah, thank you for being here. And yeah, the questions for today's interview are prepared by
    Johanna Bayer. Thanks, Johanna, for your help as always. And before we go into our main topic of building
    machine learning teams, let's start with your background. Can you tell us about your career journey
    so far?
  sec: 234
  time: '3:54'
  who: Alexey
- header: 'Career journey: from electrical engineering to AI'
- line: Yes, so I originally started my career in my bachelor's studies, as most people, and there I was
    actually an electrical engineer. So I was fascinated with physics. I was a huge nerd when it came
    to electromagnetics and that was something I was very passionate about. It led me into electrical
    engineering. So it was not too far, but a bit of a different field than where I am today. But there
    was still an intersection with software engineering, computer engineering in general.
  sec: 257
  time: '4:17'
  who: Reem
- line: But it was in my last year where I took, accidentally actually, my first course in AI, and that
    was my first exposure to the topic. And I got fascinated. I was someone who was always curious about
    how things are built. And so when I came across this idea that we can get machines to do things in
    a smart way, that was fascinating for me, because I was only familiar with traditional software and
    explicitly giving machines instructions on how to do things. So this idea of being able to do more
    than that was very cool for myself back then.
  sec: 286
  time: '4:46'
  who: Reem
- line: So I decided that I wanted to pursue a master's degree specializing in this area, purely out of
    just being more curious. And back then, I mean, it wasn't that long ago, but back in 2015, it was
    kind of an obvious choice to go for graduate school. I think today you have a lot more options on
    how you can dive into the field. So that's what I did. I went into graduate school, really enjoyed
    the research that I did, so I extended it into the PhD as well and continued working in the field.
  sec: 321
  time: '5:21'
  who: Reem
- line: During my PhD, that's when I co-founded the startup on AI education. So I started kind of balancing
    between my academic work as well as the startup world and how things worked there. Got fascinated
    with startups, finished my PhD, joined another startup, where I'm currently building the HR tech solution
    that you mentioned. And yeah, this is where I'm at today.
  sec: 357
  time: '5:57'
  who: Reem
- line: Yeah, well, it must be not easy to simultaneously start a startup and do your PhD, right?
  sec: 388
  time: '6:28'
  who: Alexey
- line: No, yeah, it was not easy, but it was a lot of fun actually, because it was a nice balance. PhD
    is very intense and you get to do a lot of work. I mean, for those who have been on a similar journey,
    you get to do a lot of very intense work, and mostly, to some extent, alone. And I balanced that out
    with the excitement of working with a team and training people, and kind of that community aspect,
    because everything that we also did in that company was very much community-driven. So it was kind
    of a balancing act. As long as you're enjoying what you're doing, really, you end up managing somehow,
    I guess.
  sec: 399
  time: '6:39'
  who: Reem
- header: 'PhD research: multitask learning and transfer learning'
- line: Yeah, so you said that you had your first course in AI in the last year of your bachelor studies,
    you really liked it, and you enrolled in the master program. You also liked it, so then you continued
    researching it during your PhD. And your research was about transfer learning with limited data, right?
    Can you tell us a bit more?
  sec: 441
  time: '7:21'
  who: Alexey
- line: Yeah, sure. So, I mean, that was a very long time ago, but I hope I can remember how things came
    together. So during my masters, my adviser was already working on certain areas, and he was specifically
    focused on natural language processing and context-aware sensing. And back then NLP was still not
    the hype that it is today. So it was more foundational NLP stuff, I would say. Not basic, but more
    foundational. I was fascinated with the context-aware sensing because the applications that he was
    working on were very much touching people's lives.
  sec: 468
  time: '7:48'
  who: Reem
- line: You said context-aware sensing? So something like context-aware sensing?
  sec: 504
  time: '8:24'
  who: Alexey
- line: Yeah, like wearable devices for human activity recognition, emotion recognition, sensing human
    behavior and environments, stuff like that, right. So he was working on a variety of these things,
    so I started looking down this direction. I didn't end up going down that path, but along the way
    I came across the idea of transfer learning and multitask learning, and this concept of getting models
    to learn from each other.
  sec: 513
  time: '8:33'
  who: Reem
- line: Again, I was starting in the field back then, so for me, driven by the same curiosity, I was like,
    wow, okay, that's interesting. Not only can you teach a machine, but you can get them to kind of learn
    from each other's experiences. That sounds very cool. So that's when I got into diving into multitask
    learning, specifically a branch of transfer learning where you're able to learn multiple tasks, multiple
    problems that you're trying to optimize the model for, using one model essentially. So saving on resources.
    If your data sets are limited, you're able to share and leverage knowledge across the tasks to boost
    the performance and stuff like that.
  sec: 545
  time: '9:05'
  who: Reem
- line: And that was the focus in my Master's. It extended into my PhD and branched out a bit more, where
    I started looking into teacher models and, if you want, more overarching challenges in multitask learning
    and transfer learning. Like the challenges of catastrophic learning, where when you fine-tune a model,
    you forget the old task. Are you able to maintain tasks as you fine-tune models even though their
    data is missing? And kind of diving into these things in more detail. But all within the realm, or
    the umbrella, of leveraging trained models to boost performance on other tasks and new tasks that
    suffer from limited data. Whether some tasks naturally suffer from limited data, or whether you're
    in your initial stages of training and you don't have access to this data.
  sec: 584
  time: '9:44'
  who: Reem
- line: It's the first time I hear the term catastrophic learning. That's interesting.
  sec: 641
  time: '10:41'
  who: Alexey
- line: Sorry, forgetting.
  sec: 646
  time: '10:46'
  who: Reem
- line: Yeah, I know not the term, but the concept. Because it happened when you set the learning rate
    too high, the model just overrides the weights accidentally. I don't know, if you take this ImageNet
    model...
  sec: 649
  time: '10:49'
  who: Alexey
- line: Yeah, exactly. It just forgets. Or even if you fine-tune it on a smaller data set, it's going
    to become optimized for the new one and not really be able to perform the same on the old task. Very,
    very interesting problems. Again, research-driven, so they were very detailed, but it was an interesting
    space, and this is the direction that I took.
  sec: 668
  time: '11:08'
  who: Reem
- header: Moving from academia to industry
- line: And how did you switch your focus more towards the industry? You were doing your PhD and then
    you probably wanted to have something more practical, or how did it happen?
  sec: 692
  time: '11:32'
  who: Alexey
- line: Yes, actually. So even though I enjoyed the research that I was doing and the work that I was
    doing, I wasn't very much driven by the way that academia worked, and kind of the reward that you
    would get out of this heavy, heavy effort that you would put in. And I really wanted to be in a place
    where I was able to build something that would actually make it into practice, and I would actually
    be able to see the impact and touch people's lives, basically. Because most of the research that you
    do today doesn't end up making it to industry, because of many, many factors.
  sec: 710
  time: '11:50'
  who: Reem
- line: So that was something I actually decided early on, that I would be switching to industry once
    I'm done with my PhD. And so yeah, it was driven from that, being able to make a direct impact with
    a solution that people can actually use.
  sec: 749
  time: '12:29'
  who: Reem
- line: Yeah, I guess touching people's lives with PhD research is way more difficult, because in industry
    the loop between you doing something and then it affecting people is way shorter, right?
  sec: 770
  time: '12:50'
  who: Alexey
- line: Yes, yes. And then, again, most research doesn't make it to industry, right? On the industry side
    you don't see it that way, because you do see these foundational models that come up from R&D teams,
    but they are really centralized in these big tech companies. Everyone else in the world who's doing
    research, most of the time they're contributing to the body of work that's out there, yes, but it's
    not making it to production.
  sec: 784
  time: '13:04'
  who: Reem
- line: And one of the main reasons actually is, when you do research and you're optimizing models or
    you're improving them, you're not really doing it with industry standards in mind. So many of the
    methods that are out there are probably not practical to make it into production, probably not needed,
    especially with companies that are still in early stages. At least where I am, I know that getting
    to a point where you have R&D-grade models in production is not really needed in most of the companies.
    In the region where I am, people are still in very early stages, kind of discovering how AI can help
    bring value to their organizations.
  sec: 813
  time: '13:33'
  who: Reem
- line: And did you immediately start with a startup, or was there something else? How did your transition
    go? What did you do?
  sec: 859
  time: '14:19'
  who: Alexey
- line: I did. I immediately started with a startup. Actually, I started before I finished my PhD, by
    a few months. It was a coincidence really. I got approached by the founders.
  sec: 869
  time: '14:29'
  who: Reem
- line: So you accidentally started the startup?
  sec: 883
  time: '14:43'
  who: Alexey
- line: Not really. I'm not a founder of the startup, but I was approached by the founders, who I'm sure
    did not accidentally begin their startup. But they were still in the initial stages of thinking it
    out and they wanted to brainstorm feasibility and all that stuff. And through the conversation we
    got to a point where I was like, yeah, I'm finishing my PhD, and they're like, oh, would you be interested
    to join? It was a very interesting product that they had in mind. It was something I knew would be
    very challenging and interesting to work on, and the impact for me was very meaningful. So I was like,
    okay, here we go, that's what I'll be doing after I'm done.
  sec: 888
  time: '14:48'
  who: Reem
- line: Was it a difficult transition?
  sec: 927
  time: '15:27'
  who: Alexey
- line: Not really. I know a lot of people think that the transition from PhD to industry is challenging.
    I think the one area that it's challenging in is the perception on the opposite side. I think people
    in industry look at you as a PhD candidate and they have certain assumptions that are difficult for
    you to navigate, depending of course on who you're talking with. But I've seen this a lot. People
    assume you're going to be driven by whatever you were doing in research, and you're going to be very
    detail-oriented, and you're not going to be able to adapt to industry standards and industry requirements.
    Prejudices, how do I say...
  sec: 933
  time: '15:33'
  who: Reem
- line: Prejudices.
  sec: 974
  time: '16:14'
  who: Alexey
- line: Yes, exactly. That you're going to be stuck with your academic mindset. And obviously some people
    think you're overqualified and they don't consider you, et cetera. These challenges.
  sec: 975
  time: '16:15'
  who: Reem
- line: It's not like you're going to be stuck with your academic mindset. It's what people think you're
    going to do, right?
  sec: 985
  time: '16:25'
  who: Alexey
- line: 'Well, yeah, exactly. And then there''s also this thing that I faced, and I know many people who
    face it, which is, you leave your PhD and in industry your experience is counted in years of work
    in other companies. So for them it''s a bit weird to process: you''ve been in school for the past
    X years, so do you have work experience? I''ve been there and I was like, right. It''s hard to explain,
    honestly. I''ve been in situations where it was hard to explain. I have the experience. I might not
    have the experience that you have structured in your mind. I gained it elsewhere and in different
    ways. So it''s hard to communicate that to the opposite side.'
  sec: 990
  time: '16:30'
  who: Reem
- line: But the transition, at least for me personally, wasn't that difficult. Maybe especially because
    I had already gotten exposed to industry. I was already consulting on projects, so working on industry
    projects wasn't something entirely new for me. And so I knew that the mindset would have to be different.
    You're not coming in to try and build complex models that are one to two percent outperforming state-of-the-art,
    and so on and so forth, right? So as long as you have the right expectations in mind when you do this
    transition, it shouldn't be difficult. And in many cases, actually, there are industry roles specifically
    tailored for PhD graduates. In my case, I wasn't working in a role that would require, let's say,
    a PhD. But there are many roles that would require that, in which case you don't really need to transition
    from your mindset.
  sec: 1038
  time: '17:18'
  who: Reem
- header: 'intervu.ai: AI video interviews for candidate screening'
- line: So maybe let's talk a bit in more detail about what you were doing for this HR tech company. As
    I understood, first it was a startup, not the one you joined. I don't know, was it in HR tech too,
    the first one?
  sec: 1092
  time: '18:12'
  who: Alexey
- line: You mean the first startup? So the first startup was the training, it was an education startup.
    That was my startup that I co-founded with a group of friends and that I worked on during my PhD.
    But the one I'm in right now, I joined after I finished my PhD. And I was one of the initial team
    members. I'm not a founder, but I was one of the people who kind of initiated the whole thing. And
    yes, it's an HR tech startup.
  sec: 1114
  time: '18:34'
  who: Reem
- line: So we're building an AI... Actually, HR tech in general, in a nutshell, is any technological solution
    that's serving the HR space, right? Which is hiring or upskilling people, or both. So usually in HR
    you can talk about hiring, right, which involves actually many, many things. So screening and then
    the different interviewing phases that could be involved, managing, like what ATSs probably do today.
    And then you can talk about employee... I don't know what's the exact term, but kind of employee retention,
    employee assessment, right? And training as well. So this is all within HR. In my case, we're focusing
    specifically on recruitment, so the initial stages of people coming in, and more specifically on the
    screening phase.
  sec: 1141
  time: '19:01'
  who: Reem
- line: So this is the company where you work at right now, right? So what do you do?
  sec: 1199
  time: '19:59'
  who: Alexey
- line: So we're building an AI video interviewing solution.
  sec: 1208
  time: '20:08'
  who: Reem
- line: That's cool.
  sec: 1211
  time: '20:11'
  who: Alexey
- line: It is. It's very cool. Of course I'm biased. But the idea, or the motivation behind what we're
    doing is, and I think we'd all agree, CVs are not really the best way to present yourself, right?
    And so the motivation is to give everyone a chance to present themselves through a richer medium than
    just their CV. Usually in the screening process, you submit your CV wherever you submit it, the ATS
    system would do some keyword matching and decide if you match the requirements or not. Many flaws
    there, right, on many different levels.
  sec: 1214
  time: '20:14'
  who: Reem
- line: We want to kind of change that and allow you to start with an interview and your CV. I mean, we're
    not going to get rid of your CV. The recruiter still needs to know what you've done. But to allow
    you to interview, so it's kind of like you're getting directly into the first HR interview, where
    you usually would not get this chance. And we assess you basically on behavioral traits. So we're
    not looking to assess you on your technical capacity, that would happen in later stages beyond screening.
    But the point is to give you a chance to present yourself and your qualifications as an individual.
  sec: 1254
  time: '20:54'
  who: Reem
- line: So behavioral aspects, like soft skills, right? And is the interview with an actual human or with
    an AI?
  sec: 1290
  time: '21:30'
  who: Alexey
- line: No, it's with an AI. So it's an avatar that interviews you. She actually has a name, her name
    is Isa. At the moment, we're going to have more interviewers in the future, but you get interviewed
    by an avatar. So the entire process is automated. It's cool because you get to do the interview really
    at any time that suits you, anywhere that you like, your phone, your laptop, et cetera. It's like
    a 15, 20 minute interview, and you get a chance to really give more than just your CV, right? And
    then in the background, your recruiter is able to look at your CV as well as your richer representation,
    if you will, of what you can bring to the table as an individual.
  sec: 1300
  time: '21:40'
  who: Reem
- line: So then it's also, I guess, recorded. So then the recruiter can look at the interview itself.
    Probably there is a summary, right, at the end of the interview?
  sec: 1348
  time: '22:28'
  who: Alexey
- line: There's a whole assessment. So you're getting interviewed by an AI, you get assessed by an AI,
    but the point of the AI assessment that happens in the background is to rank the candidates based
    on their performance, in terms of your level of soft skills, right? So in the background, the recruiter
    has an open position, whatever that position may be, let's say it's for a software engineer, and they
    would define the required level of soft skills that they believe is necessary for the role. And so
    you perform the interview, and then your performance on those soft skills is compared and benchmarked
    against the requirements, and you get ranked.
  sec: 1359
  time: '22:39'
  who: Reem
- line: So the recruiter, at the end of the day, gets a ranked list of candidates. We don't tell them
    you should hire this person. The decision is up to them. But they get an easier filtration, if you
    want, where they can start with the best-fit candidates in terms of behavioral qualifications, check
    their CVs, see if they make it through the requirements, and they get into the system for the next
    stage of the interview. So this is essentially how it works.
  sec: 1399
  time: '23:19'
  who: Reem
- header: How candidates feel about being interviewed by an avatar
- line: And what do candidates think about being interviewed by an avatar?
  sec: 1427
  time: '23:47'
  who: Alexey
- line: Mixed feelings. I've seen mixed feelings, actually. And one interesting pattern I noticed is that
    it seems younger generations really enjoy it, which I find weird. I get it if you're neutral, but
    they really enjoy it. I even had candidates who would tell me they were more comfortable interviewing
    with the avatar than an actual person, because the avatar was not judging them with facial expressions.
    I was like, we've probably had bad interviews in the past. I don't know what kind of recruiter was
    judging you straight on.
  sec: 1432
  time: '23:52'
  who: Reem
- line: But yeah, I've had mixed. So I see candidates who are excited about this innovation and this new
    way of doing things. Candidates who are obviously uncomfortable, like, I'm not comfortable talking
    to the screen. And then candidates who refuse the process altogether, candidates who are not comfortable
    getting recorded and their data being stored or being used for training, or whatever reasons they
    may have.
  sec: 1464
  time: '24:24'
  who: Reem
- line: I was wondering, maybe there are cases when people think it's disrespectful that instead of a
    human, an actual human being... Can't you just find time for me? Why is there a robot?
  sec: 1496
  time: '24:56'
  who: Alexey
- line: 'That''s interesting. That''s a good point. I would get that as a candidate, right? For me, I
    would motivate it from the perspective of: this is not even an interview you would get, right? It''s
    not like we''re replacing the recruiter''s interview or the interviews that come in the process. We''re
    giving you an extra opportunity to showcase yourself better. You can think about it in a way like
    we present ourselves on LinkedIn as well, right? So you have your LinkedIn profile, which is an additional
    representation to your CV, and now this is kind of an additional step where you can present yourself
    as naturally as possible and have that taken into consideration.'
  sec: 1504
  time: '25:04'
  who: Reem
- line: I mean, what was the other option? You're going to upload your CV and some ATS is going to screen
    you for keywords, and you'll probably not hear back from the recruiter for a while. So again, that's
    my perspective. I'm on the inside. But that's interesting. I will see how we can translate that into
    the solution so no one feels disrespected. That's a good point, actually. It never crossed my mind.
  sec: 1555
  time: '25:55'
  who: Reem
- line: Because I imagine this is a replacement for when I apply for a job, there could be a questionnaire
    that I need to fill in, right? And this is kind of a replacement, but more interactive. Instead of
    thinking and typing, and that might take even more time actually than just having a 15 minute chat.
    And I guess the time is when it's convenient for me as a candidate. It's not like, okay, you need
    to show up at 3 p.m., right?
  sec: 1581
  time: '26:21'
  who: Alexey
- line: Yeah, exactly.
  sec: 1613
  time: '26:53'
  who: Reem
- line: You can take it whenever you want.
  sec: 1618
  time: '26:58'
  who: Alexey
- line: 'Exactly. So we tried to make it as convenient as possible. And this is actually what I do. So
    when I recruit for my positions, this is your application process: upload your CV and take the interview,
    and this is where the screening would start. We can talk about this a bit more, but I''ve had many
    cases where I really felt like if I had looked at your CV, I would not have picked you out of the
    screening. But it was because of the interview, and because of the way I saw that you presented yourself,
    that I was interested in you, and I thought, this candidate looks like they have promise and I would
    like to interview them further. So I''ve been there personally and I sense the value that can be brought
    to the table out of this experience.'
  sec: 1620
  time: '27:00'
  who: Reem
- line: It's like a CV is a soulless thing, just a piece of paper. Not even a piece of paper, like one
    or two PDF pages, right? And you don't always remember that there is a human. But when it's recorded,
    you can see what kind of person it is, right? Maybe it gives...
  sec: 1664
  time: '27:44'
  who: Alexey
- line: Yeah, exactly. And they provide richer responses. They give you examples from their work experience
    and you get to know them a bit better. Also, a lot of us are not very good actually at making our
    CVs. It's probably better these days because you get all these tools that kind of help you. Still,
    most of us are not good at designing our CVs, so it's really not a good representation of you, even
    in that single page.
  sec: 1686
  time: '28:06'
