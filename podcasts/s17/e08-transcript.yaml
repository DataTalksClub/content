  sec: 3071
  time: '51:11'
  who: Alexey
- line: Yes. In other areas, a lot of things have been simplified.
  sec: 3083
  time: '51:23'
  who: Reem
- line: Yeah.
  sec: 3088
  time: '51:28'
  who: Alexey
- line: Because, like I told you, there are a lot of opportunities, for example, enhancing the interview
    process, being able to make it more user-friendly, giving the candidates maybe live feedback. These
