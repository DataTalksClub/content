    do that. So they didn't really serve the job as well as needed. So yeah, I guess it was one of those
    use cases that didn't see much value, at this point at least.
  sec: 3139
  time: '52:19'
  who: Reem
- header: Mitigating bias in ML-based candidate assessment
- line: I see an interesting question from Brendon. So I imagine that in these evaluation systems, we
    can have some biases. Because when humans rate other humans, we have some biases, and these biases
    inadvertently creep into our machine learning solutions for rating people. So how can we mitigate
    these biases when we work with machine learning?
  sec: 3199
  time: '53:19'
  who: Alexey
- line: It's a very good question, because the bias comes up in many different areas, right? The first
    initial step is the human bias that can creep in, which is essentially where the data is being labeled,
    the interviews are being labeled, for example, in my case. I'm going to give specific examples here
    to my use case. One methodology, if you want, that we use to mitigate having a person's bias creep
    into the modeling process, at least, is to have several people score an interview and then take an
    aggregate of their scores. And by the way, this is actually how it's done in practice. Usually, when
    companies conduct these interviews, you have several interviewers who are scoring you, and then they
    would combine their results to come up with the final results, so that not one person's bias is creeping
    into the system and defining their own opinions on you.
  sec: 3229
  time: '53:49'
  who: Reem
- line: The second way is through the criteria that I mentioned. So by having very clear criteria, and
    by trying to standardize the process across every candidate and across everyone who's scoring, you
    try as much as possible to navigate that people don't come up with their own definition of what good
    communication is, right? So they follow very specific criteria. Did the candidate show this behavior?
    Yes, no, medium, high, et cetera, right? Did this candidate show this specific behavior here? So to
    break it down into as small pieces as possible to mitigate these internal biases, to standardize,
    right, and to aggregate results across the scoring panel, essentially, whose labels are taken and
    fed into the models.
  sec: 3291
  time: '54:51'
  who: Reem
- line: So I imagine these criteria, the standards, they exist for a reason, and this reason is we humans
    have biases. So how can we remove subjectivity as much as possible when humans interview other humans,
    right? So we want to remove subjectivity there. That's why there are these criteria, right? That's
    why there are these standards.
  sec: 3341
  time: '55:41'
  who: Alexey
- line: Exactly. So my teammate, who's the psychologist on the team, explained it to me in a very nice
    way. She said, if I tell you, score this person on communication, and I score this person on communication,
    and that's the only criteria we have, we have very different mental models of what communication means.
    And when we talk about bias here, I'm not talking about negative intended bias, right, but these internal
    mental models that we have. But if I tell you we mean XYZ by communication, we have a closer model
    representation in our minds when we're scoring. But if I give you very specific criteria, we're as
    close as possible to thinking about this assessment in the same way.
  sec: 3367
  time: '56:07'
  who: Reem
- line: There's still differentiation, and that's a good thing, right? There's still differentiation because
    you're getting an overall assessment from several people and not just one person's opinion, which
    is to ensure fairness and to ensure that there's not one specific person's opinion going into play.
    But we're assessing the same thing, we're looking at the same criteria, and we're very diligent about
    this. So there's a lot that's done. We conduct regular sessions where, for example, the panels score
    together, and they meet and they discuss the results and they make sure no one has drifted and is
    scoring in a different way, but make sure we're following the criteria the same way, the rules of
    scoring the same way, trying to standardize it as much as possible, right?
  sec: 3410
  time: '56:50'
  who: Reem
- line: And again, there are always potential flaws that can creep in. But for me, I always go back and
    I compare it to the benchmark. The benchmark is, you would be assessed by one person in reality if
    you make it to the actual interview, and you will be judged by that person's own biases, right? In
    an automated interview like the one that we have, and actually there are many of them out there today,
    it's a standardized approach. But also, at least in our case, we don't really know anything about
    you. We're not collecting anything about you in terms of personal information. We don't care. We're
    really just listening to your interview and following that criteria.
  sec: 3456
  time: '57:36'
  who: Reem
- line: We're very careful about how we evaluate audio and video. We don't use these to assess your soft
    skills, by the way. We assess different aspects, because according to literature they're not reliable.
    So, obviously, trying to do things as diligently as possible to make sure you're not coming up with
    your own idea of what good communication is, and you're following standard research that's been established
    in the psychology space. That's the best that you can do, really, to make sure that the process is
    as reliable as possible.
  sec: 3492
  time: '58:12'
  who: Reem
- header: Adjusting soft skill expectations for different roles
- line: Maybe the last question. I know we are a bit over time.
  sec: 3526
  time: '58:46'
  who: Alexey
- line: It's okay, it's good on my side.
  sec: 3528
  time: '58:48'
  who: Reem
- line: Yeah, good. So there's a question from B, and it's related to what we were talking about. So communication
    can be quite subjective, but it's also different for different roles. The communication we expect
    from a data analyst can be different from the communication skills we expect from a data engineer,
    right? Data analysts need to talk more with stakeholders, while data engineers might mostly need to
    talk to the manager, something like that, right? So the expectations are different, and the sort of
    communication skills are different. Does it mean that your system needs to have adjustments for different
    roles?
  sec: 3532
  time: '58:52'
  who: Alexey
- line: It does. Today, the way that it's handled is by the recruiter. So the recruiter is the one who
    essentially knows, or should know, the requirements for the position they're hiring for. So the system
    assesses you the same way, right? In the background, the system is assessing you regardless of what
    your industry is, where you're going to work, et cetera. You have a certain communication capability
    that's been presented in your interview, and that's assessed. But the way that you are ranked and
    presented to the recruiter is based on criteria that they set. So they set a specific level or expectation
    of communication, let's say, depending on the role requirements, and then your score is matched with
    their requirements. If you are above that score, you're considered to be a good fit for the role.
    If you're below, you're considered to be not well fit in this specific capacity, the specific competency.
  sec: 3576
  time: '59:36'
  who: Reem
- line: We also have this interesting concept, actually, that I wasn't aware of before. If you are above
    the requirement by a certain threshold, you're also considered to be overqualified. You could have
    an overqualification of soft skills that would get you to a point where perhaps you might end up unsatisfied
    with the role and want more, right? So these are things that we measure, and we show where you are
    on the scale reference that the recruiter defines, depending on the job requirements. So that's a
    good question, actually.
  sec: 3634
  time: '1:00:34'
  who: Reem
- line: Yeah, on the candidate side it must be quite frustrating when you get rejected with this "overqualified".
  sec: 3667
  time: '1:01:07'
  who: Alexey
- line: 'You don''t. We don''t reject because you''re overqualified. It''s a concept of... It was a really
    interesting concept that was defined by, again, my teammate. This is her area of expertise. It''s
    not like you''re overqualified, like you''re not a good fit. She defined it differently, which is:
    you either have the capability, right, so this is what makes you the perfect fit today, but you could
    also have potential, exceeding potential. So when you''re overqualified, you have the capability and
    you have potential. So you''re a plus-plus, right? You have the potential to grow, you have potential
    perhaps for a higher role, maybe a different position. So all these things are monitored and reported
    back.'
  sec: 3676
  time: '1:01:16'
  who: Reem
- line: Yeah, exactly. Even if you're underqualified in that skill, you're not rejected automatically.
    If you don't match on a specific portion of the criteria, then you're not the best fit, but you're
    not thrown out. Again, the way that we've done the system is to be very careful that we're not making
    decisions. All the candidates are there. We're simply assessing. The recruiter looks at the results
    and they decide.
