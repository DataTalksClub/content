    to start with really understanding what it is that you're trying to solve. And I feel like this is
    actually a step that many people go past pretty quickly. In many cases, I mean, I've been there, we
    make the mistake of assuming things that are not necessarily the case, and we get past a lot of information
    that's missing from the table.
  sec: 1784
  time: '29:44'
  who: Reem
- line: Defining the problem doesn't really happen in one stage. I've tried to do this, where I would
    sit and be like, okay, I'm going to define the problem and work through the data science life cycle,
    collect the data and build the models and put them into production. It never actually ends up working
    that way. And especially when you're in a startup and there's a lot of changing dynamics, what you
    define today may not be what you need in another month, and being aware of that is very important.
    So you would start with a cycle, and I'll walk through my cycle, and then I'll add an important point
    at the end of it.
  sec: 1824
  time: '30:24'
  who: Reem
- line: 'So defining the problem: this could be with the stakeholders, so the business owners or whatever
    business department you''re working with to make this product happen, whoever is involved in bringing
    this product to life, depending on your problem. And in most cases, I assume you''re going to need
    domain experts. This is not something you should overlook. In my case, for example, in the case of
    the HR tech company, I came into this problem of, let''s do behavioral interviews and let''s get AI
    to assess them. And the first thing that popped into my mind is, how on Earth are we going to assess
    soft skills? Because as people, we can assess them quite differently. And I had no idea how to tackle
    this problem, even just from a general sense, not from a machine learning sense.'
  sec: 1863
  time: '31:03'
  who: Reem
- line: And we came to realize that actually there are experts who are specialized in designing these
    behavioral interviews and in scoring behavioral interviews. In real life, this is actually a process
    that happens. Humans usually score, they have a system, they have a framework, and it's very, very
    well defined and it's very rigorous, right? So there's a scientific framework behind it. It's very
    important that the domain expert is involved at that stage to define the problem properly.
  sec: 1917
  time: '31:57'
  who: Reem
- line: In parallel, I would say, not even as the second step but in parallel to this, you need to keep
    in mind access to data, right? And obviously, depending on your situation, this may vary a lot. Do
    you already have access to the data? Do you not have access to the data? How long would it take you
    to get access to the data? This was for me one of the biggest challenges, at least in the latest venture
    that I have with the HR tech startup, because you have this kind of balance. You need to get a product
    out there, the product is still not there, the data is still not in, right? So where do you start?
  sec: 1948
  time: '32:28'
  who: Reem
- line: And there's a lot that you can do here. So you can try to find proxy data that might serve as
    an initial data set for your problem, if that's something that you can find. So something available
    online that's as close as possible to what you're trying to solve. You could try to somehow get data
    in any way possible. So for example, for me it was trying to get people I know to conduct interviews
    and start collecting that initial base to run experiments, right, and some PoCs to see how we can
    get this off the ground. So defining the problem and access to data would be the initial stage of
    starting the whole process.
  sec: 1983
  time: '33:03'
  who: Reem
- header: Translating criteria into data science problems; start simple
- line: Once you have a good idea of what the problem is, and you've understood from the domain expert
    what it would take to actually bring that to life... So for example, in my case, with the product
    that I have right now, it's understanding that there are psychologists who conduct these interviews.
    They have criteria. When I say criteria, I mean an Excel sheet of criteria, right? This is what we
    look for in a candidate when we're evaluating their communication skill, let's say. So once I was
    able to get this criteria, I was like, okay, now this is something I can work with, right?
  sec: 2027
  time: '33:47'
  who: Reem
- line: If you were to tell me, score the person's communication skill, I wouldn't even know where to
    start. But when you tell me we need to look specifically at how the person presents certain things
    in the conversation, or how the person speaks, or how fluent they are in the conversation, this is
    where you can start to translate the business problem into a data science problem and have something
    solid that you can actually build in the data science world.
  sec: 2060
  time: '34:20'
  who: Reem
- line: And then you start diving into the modeling side. So how do I tackle the problem? The most straightforward
    way is to see what others have done in a similar place, what they have used before, what has worked,
    what has not worked. And from there, I'm always someone who would opt to start with a simpler solution
    as a starting point, PoC, see how it goes, and then add complexity if needed. I have seen a lot of
    direction, especially recently, where people would jump directly on, oh, let's get a GPT to take all
    the data and solve the problem for us. And it really, really doesn't work that way.
  sec: 2088
  time: '34:48'
  who: Reem
- line: I mean, there's a lot of benefit to the latest type of LLMs that we've seen. There's a lot of
    amazing things that you can do. But for example, there is no way that I could throw whatever criteria
    I have at a GPT and be like, score this interview for me. That would be a disaster. So you really
    want to work with what you have, right? Make sure that you really understand the problem, see what
    people have done, how they solved it, and start with the simplest possible solution that you can find,
    and iterate from there.
  sec: 2129
  time: '35:29'
  who: Reem
- header: Serving models simply, ignoring MLOps noise, and iterating
- line: Once you've had an initial good starting point with PoCing, the modeling stage, where you actually
    have a brain that functions for the functionality that you want, you want to also start thinking about
    the engineering side. I actually did those things at the same time. So I was thinking of the modeling
    and, when I say engineering, I mean serving of the models and what that would require. With that,
    I would stress even more on simplicity. Because for me, this was the area that I was newer to, coming
    from a PhD, right? So what would be the best way to do it, the best way to serve, the best way to
    put things into production? And I was bombarded. When you read online, there are so many recommendations,
    best practices, so many tools.
  sec: 2165
  time: '36:05'
  who: Reem
- line: So many tools.
  sec: 2216
  time: '36:56'
  who: Alexey
- line: And I really felt like, at least at the stage that I was, I don't really need this whole world
    of MLOps, with all the delicate pieces and all the complexities that would come into it, to do what
    I need to do today. So one very critical thing for me was to block out this noise of "you need to
    do it this certain way," and really try to have the best judgment that you can, taking into consideration
    your resources, the size of your company, the number of users that you're serving, and the reliability
    that you need to offer in the product that you're serving. There are certain places where mistakes
    are tolerable, certain places where mistakes are not.
  sec: 2216
  time: '36:56'
  who: Reem
- line: So this is kind of how I went through the flow. It's a typical flow, but the most important point
    that I said I'll mention at the end is the iteration. I know it's cliche, we all say that, right?
    But if you don't stop, maybe every sprint, or however you work, every month, at a certain interval,
    and look back at the decisions that you've made, and see what has changed and what needs to be improved,
    or what needs to be put on hold, or what needs to be added now that wasn't necessary before, you will
    end up finding yourself in a disastrous position, really.
  sec: 2263
  time: '37:43'
  who: Reem
- line: Because, especially again in a startup, or it doesn't even have to be a startup, but a smaller
    organization, or even an organization that's large but starting with their data initiatives, there's
