  sec: 2650
  time: '44:10'
  who: Reem
- header: Do LLMs change the ML product process?
- line: Yeah. And you mentioned LLMs, and you also said something along these lines, that nowadays some
    people think that all you need to do is just throw your problems at an LLM and then the LLM will just
