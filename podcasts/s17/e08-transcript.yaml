  sec: 3106
  time: '51:46'
  who: Alexey
- line: She talks to you, she encourages you. She's really nice.
  sec: 3123
  time: '52:03'
  who: Reem
- line: Yeah, things can be built with these chatbot capabilities that are way better with LLMs than without
