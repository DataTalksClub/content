  sec: 2346
  time: '39:06'
  who: Alexey
- header: 'Collecting the right data: improving interview questions and UX'
- line: And I would add, for the point about what data is available, also what data do you need, right?
    Because sometimes you have data available and you might think this is what works for your problem,
    but you have things that are missing. And I've been there over and over again. Actually, this is an
    ongoing process for me, where you collect data and then you look at it, and when you really evaluate,
    you find it's missing something that's critical for you, right? You need to go back, adjust the data
