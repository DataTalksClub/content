    for or not.
  sec: 2412
  time: '40:12'
  who: Reem
- line: So for example, to give you something practical, when we first started collecting interviews,
    we started with a set of questions. We realized the candidates are not really giving very detailed
    responses. We need details from them, right? So we were like, okay, maybe the questions are too broad.
    So we improved the questions and we made them more detailed and more specific. The responses got a
    lot better. Candidates were responding for longer. Previously they had really short responses, they
    were not enough to extract information from. Now they got to a point where they're giving longer responses,
    they're giving examples, et cetera.
  sec: 2447
  time: '40:47'
  who: Reem
- line: 'We noticed in some cases candidates were kind of assuming that a person is watching, and they
    were referring to the CV, et cetera. So we added guidelines that clarified: you''re being assessed
    by an AI, make sure that each response is complete and coherent, don''t refer to other responses or
    something offline, right? This helps, and so on and so forth, right? So you collect, you evaluate,
    you see something''s missing, you adjust. This is also something that I assume would happen in any
    case where you''re building something new.'
  sec: 2484
  time: '41:24'
  who: Reem
- line: And many of these things are more related to the product work and user experience work rather
