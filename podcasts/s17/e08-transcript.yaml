  sec: 2688
  time: '44:48'
  who: Alexey
- line: I would say the process should not change. Has it? Probably. I think people are taking shortcuts.
    Whoever is following the mindset that I shared, which is, okay, let's get a GPT to solve it, or to
    score it, or to assess it, or whatever. Because that would get you past all the initial stages of
    understanding the problem, of choosing the right technique to solve the problem, maybe even finding
    the right data for it, right? Especially if you're not eloquent enough to be able to properly assess
    these LLMs and how they're performing at the end of the day.
  sec: 2731
  time: '45:31'
  who: Reem
- line: I say GPTs because LLMs have been around for longer, but I'm talking about the GPTs, the generation
    models, and kind of the hype that happened there. We still have the LLMs, like BERT, for example,
    text classification, all that stuff. So these are still very task-specific. I would say these are
    still tools that we can use. What they have changed is the way that we can do things, right? So one
    application of LLMs that I really love, and I feel like there's a lot of value there, is using it
    as an interface to your product. You can use it as an orchestration layer. So just the way that a
    user will be able to interact with your application can be enhanced greatly because of this advancement
    that we've seen. But I wouldn't use it as a replacement, right?
  sec: 2769
  time: '46:09'
  who: Reem
- line: I have been in many scenarios where I have people tell me, can we get OpenAI models to predict
    a certain classification value for us in a certain problem? And this is what people assume, right?
    They assume these models can do anything, and they forget the initial capabilities of the model. They're
    not built to support such tasks. And this is kind of the challenge that I've seen. And I don't know
    if you've been there, I actually want to hear your opinion on this, but I've been in many situations
    where I felt like I was looked upon like I'm outdated, right? It's like, oh, you're anti... I'm like,
    no, but this is not the intention of these models, right? You're setting yourself up for failure if
    you work with them with an incorrect assumption. So I think these models have brought about a lot
    of opportunity, but I don't see it changing the way that things have been done, but more new opportunities,
    actually, that can be presented in how we solve problems. What's your take?
  sec: 2823
  time: '47:03'
  who: Reem
- line: Well, it looks like if we manage to keep the process the same, we can have a first iteration way
    faster with these new tools, right? So for example, we can just say, hey, these are criteria for assessing
    fluency, just tell us if the candidate is fluent or not. Well, fluency maybe is a bad example, because
    you probably analyze audio rather than text. But let's say coherence, right? Whether they speak coherently
    or not. You just throw a bunch of text at this and say, here are criteria for how you evaluate coherence,
    and then what do you think, right? So probably you can arrive at the first solution rather quickly,
    right? And then maybe it will work, maybe it will not, but at least you will start getting some feedback.
  sec: 2890
  time: '48:10'
  who: Alexey
- line: First PoC, yeah. That's also one of the good opportunities that you could have, right? So being
    able to, if it's applicable for you, test things quickly and have something that works for you quickly.
    That's something I was faced with, honestly. And one thing that might come back to bite you is if
    you start PoCing with these models and you think that they work, but they're not working, and then
    you realize you have to take a step back and you're going into more basic techniques, right? So now,
    instead of starting with something that works, you're put behind, right? You're put behind on schedule.
    This is something that I've at least faced in the past.
  sec: 2940
  time: '49:00'
  who: Reem
- line: I see. Well, it's not like I have a lot of experience of using LLMs to solve business problems,
    but as a user, I use them quite extensively. So for example, right now I'm preparing for an exam in
    German, and there is this writing part, and they have strict criteria. And what I do is I give ChatGPT
    my text and a set of criteria and say, okay, ChatGPT, what do you think, how many points will I get?
    And then, oh, your text is awesome, you'll get like 15 out of 15.
  sec: 2988
  time: '49:48'
  who: Alexey
- line: Don't trust it. Yeah, because I've played around with it, honestly, with specifically these criteria,
    and seeing if it's able to do things as needed, right? Because it depends on what you're trying to
    solve. If you're trying to just say the person is good, the person is bad, maybe it can do that decently
    well. But if you're trying to distinguish between people on a scale of 0 to 100, and really be very
    specific about the criteria and how good this person is versus this person, you really need something
    that's a lot more specialized for what you're trying to build. And for me, GPTs did not do that.
  sec: 3027
  time: '50:27'
  who: Reem
- line: Which means, for you, your life doesn't really become simpler. You still need to do all this modeling,
