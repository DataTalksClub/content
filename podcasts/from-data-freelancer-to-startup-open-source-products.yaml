intro: How do you move from freelancing to building an open-source data company that wins via bottom-up
  adoption? In this episode Adrian Brudaru — an economics graduate who pivoted to business analysis in
  Berlin, then spent years freelancing before co-founding a data startup — walks through that transition
  and the practical tradeoffs he encountered. <br><br> We cover lessons from freelancing and agency work,
  why they chose product over agency growth, and the recurring pain of stakeholder alignment versus technical
  setup. Adrian explains DLT — a declarative JSON→relational transformation for data pipelines — and why
  the product targets Python users as a developer-focused library. Hear how workshops, documentation,
  and live support doubled as product validation, how scrappy bootstrapping and consulting revenue funded
  early payroll, and what signals indicate product–market fit for open-source tooling. <br><br> If you’re
  building open-source data tools, developer tooling, or plotting a bottom-up go-to-market, this episode
  offers concrete tactics on iteration, docs-as-product, ecosystem partnerships, and positioning against
  platforms like Airbyte/Fivetran — helping you prioritize engineering, adoption, and sustainable monetization.
