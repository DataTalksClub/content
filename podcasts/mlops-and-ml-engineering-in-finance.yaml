intro: 'How do you deploy machine learning in heavily regulated finance environments while keeping CI/CD
  pipelines, model governance, and operational risk under control? In this episode Nemanja Radojkovic—an
  electrical engineer turned data scientist and MLOps practitioner who moved from Belgrade to Leuven—walks
  through real-world constraints and pragmatic solutions for MLOps in finance. <br><br> Drawing on his
  PhD background, consulting experience, and teaching, Nemanja covers finance use cases such as compliance,
  AML, fraud detection, and document/email automation, then drills into ML engineering responsibilities:
  deployment choices, CI/CD, release management, and building trust with governance and approvals. We
  examine legacy and regulatory constraints, on-premises platforms (Hadoop, OpenShift), and low-cost MLOps
  strategies: minimal viable setups (dev/test/prod, monitoring, model registry, data versioning, reproducible
  pipelines) and tactical workarounds like S3-based registries. <br><br> Listeners will gain actionable
  guidance on adapting ML workflows to corporate DevOps, prioritizing MLOps on a shoestring, standardizing
  deployment patterns and platform reuse (FastAPI, internal libraries), and the core skills needed for
  ML engineering and production readiness. Ideal for ML engineers and data teams tackling regulated deployment,
  CI/CD, and model governance in finance.'
