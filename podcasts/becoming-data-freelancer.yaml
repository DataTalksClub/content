intro: 'How do you move from corporate analytics to independent data consulting while pricing services
  fairly, finding steady clients, and avoiding contract pitfalls? In this episode Dimitri Visnadi — an
  independent data consultant who has advised brands like Unilever, Ferrero, Heineken and Red Bull and
  who trained at UCL and HP — walks through the practical realities of becoming a data freelancer. <br><br>
  We cover the full transition: career pivoting from marketing to data, early startup and corporate analytics
  experience, and the decision to resign and pursue freelancing. Dimitri breaks down client acquisition
  tactics (cold outreach, recruiter channels, proactive self-marketing), pricing strategy (platforms vs
  direct contracting, rate benchmarking, project pricing), and contract strategy (dependent contractor
  risk, platform terms vs direct agreements, subcontracting). He also addresses vetting clients, payment
  delays, financial runway recommendations, common pitfalls like mispositioning and mispricing, and learning
  resources including the Data Freelancer newsletter. <br><br> Listen to get actionable guidance on pricing,
  client acquisition, contract formats, and the business practices that help sustain a freelance data
  consultancy.'
