intro: How can a startup implement Lean MLOps that gets models into production quickly without incurring
  vendor lock-in or crushing tech debt? In this episode Nemanja Radojkovic — an Electrical Engineer turned
  Data Scientist and MLOps Engineer, former consultant at Big4 and boutique firms, DataCamp course author,
  and teacher of Python and machine learning — walks through practical strategies for building a SaaS-first
  MVP stack while preserving future flexibility. <br><br> We dig into the core trade-offs of a SaaS-first
  approach for an MVP, patterns to avoid vendor lock-in, and pragmatic ways to manage accumulating tech
  debt in machine learning systems. Nemanja draws on hands-on experience across data science, MLOps, and
  product environments to explain how startups can choose tooling, limit integration risk, and plan safe
  migration paths as needs change. <br><br> Listeners will come away with concrete considerations for
  designing a lean MLOps stack, assessing SaaS versus self-hosted options, and thinking ahead about maintainability
  and portability — essential guidance for founders, ML engineers, and product teams building production-ready
  ML on a startup timeline.
