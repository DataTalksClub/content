summary: |-
  Lindsay McQuade is a senior career coach at SPICED Academy in Berlin, a bootcamp that teaches
  full stack development and data science. Before that she spent ten years in management
  consulting and later ran careers work at a business school in London. Alexey invites her to
  explain how career changers can land a junior data job, starting with why people so often
  dismiss their own past work.

  Lindsay says career changers undervalue their experience and need help extracting their
  achievements. She uses a lawyer as an example. The first step is to ask whether they have worked
  with data, then to show similar skills, such as an engineer's simulation models, and to write
  achievements rather than responsibilities. Every line should make sense to a recruiter outside
  the field. Her coaches offer unlimited sessions, and she estimates that an average student books
  about four.

  The market is hard to read because titles vary and roles merge. Lindsay says data scientist
  postings often include data engineering work, and that she counted more than 800 junior data
  analyst roles in Berlin, up from 60 when she started. The hardest part is getting students to
  choose a focus. She suggests the ikigai model, starting with high-level trend reports and a few
  interest areas, and says a tailored application with a recommender system project works better
  than a generic CV.

  Alexey says he has imposter doubts every month. Lindsay argues that people who get hired and
  praised would not survive if they were frauds, so the feeling reflects a distorted self-view
  shaped by early labels and confirmation bias. She suggests noticing the trigger, treating
  mistakes as things to learn from, reading Pauline Clance's book on the imposter phenomenon, and
  finding a coach or mentor. For career changers, she recommends building a learning path by
  asking people who made the same move, and developing one area of real depth.

  On practical questions, Lindsay says internships are scarce but can lead to junior roles, and
  networking can create openings that are never advertised. Alexey notes that his team closed some
  internships quietly because public posts draw too many applications. Recruiters rarely place
  juniors, so she suggests calling them to ask which companies are hiring. On LinkedIn, she
  recommends a short note that mentions a shared background and asks an informational question.
