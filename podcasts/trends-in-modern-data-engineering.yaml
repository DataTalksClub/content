intro: How can engineering teams build reliable, scalable lakehouse pipelines that combine transactional
  table formats with AI-driven automation? In this episode Adrian Brudaru—an economics-trained analyst
  turned freelance data practitioner and co-founder of a data company focused on open source tooling—joins
  us to explore the realities of modern data engineering. <br><br> Adrian draws on years of startup and
  freelance experience and a current mission to democratise data engineering through open source to discuss
  the practical trade-offs between Iceberg and Delta Lake, how table formats fit into a data lakehouse
  architecture, and where AI can augment pipeline development and observability. Key topics include selecting
  the right table format for versioning and governance, integrating AI-powered features into ETL/ELT workflows,
  and the role of open source tools in scaling data platforms. <br><br> Listen to gain grounded perspectives
  on Iceberg, Delta Lake, AI-powered pipelines, and data pipeline best practices—especially useful for
  data engineers, architects, and engineering managers evaluating lakehouse strategies or looking to adopt
  open source solutions.
