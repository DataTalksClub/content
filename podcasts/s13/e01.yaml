summary: |-
  Dania is a co-founder and director of the AI Guild, a community of data professionals in Berlin
  that now has more than 2,000 members, mostly in Europe. She studied applied mathematics in
  Brazil, worked as a marketing analyst and wrote a master's thesis comparing Spark and Hadoop for
  recommendation systems. She moved to Berlin in 2015 for a data scientist role and later worked
  in machine learning for a German company. Alexey invites her to discuss diversity and leadership
  in data science and AI, and the story of the community.

  Dania describes the origin of the AI Guild. She met few women working in data science in Berlin,
  so she began a women's group with informal sessions in which members shared their experiences.
  In 2018 the group widened to address common problems such as proofs of concept that never
  reached production and questions about career paths. The community became official in 2019 with
  monthly dinners, and it moved online during the pandemic. In June 2022 it held the Datalift
  Summit, its first in-person conference, which sold 300 tickets. Her first meetup series was
  called Career Options, a panel of women describing the careers they had chosen. Dania describes
  Berlin's internationality as a strength, with many people who are all outsiders together.

  The discussion turns to why diversity matters. Dania says a team of similar people can build
  products that serve only their own group. Dania cites a Lean In anecdote about parking spaces to
  show that people often do not see problems outside their own experience. Leaders must say they
  want to hear from others and share their own experiences first. The community's policy is to
  invite women to speak first, which makes events more welcoming and helps the speaker pool grow.
  They also use a code of conduct, which Dania says must be enforced when someone breaks it, and
  they handle repeated reports case by case.

  The AI Guild is also a consulting business that Dania runs full time with co-founder Chris
  Armbruster. Dania leads machine learning deployment work, which is vendor-agnostic, and Chris
  leads career coaching for junior and senior members. Work is staffed with freelancers from the
  network, and they plan to hire full time if demand grows. For recruiting a diverse team for a
  finance client in Hamburg, they used English-taught university programs and reached a group that
  was half women and mostly non-native speakers. Her book recommendations are Weapons of Math
  Destruction by Cathy O'Neil and the film Coded Bias.
