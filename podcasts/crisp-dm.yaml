notes: "The topic today is the processes in a data science project. We want to understand how cross-functional\
  \ teams work together to ship real value. We'll use a concrete example (auto-categorizing marketplace\
  \ listings) and walk through CRISP-DM step by step.\n\nWe covered:\n- [Why Processes Matter](#why-processes-matter)\n\
  - [CRISP-DM Methodology](#crisp-dm-methodology)\n- [Example Use Case](#example-use-case)\n- [Step 1:\
  \ Business Understanding](#step-1-business-understanding)\n- [Step 2: Data Understanding](#step-2-data-understanding)\n\
  - [Step 3: Data Preparation](#step-3-data-preparation)\n- [Step 4: Modeling](#step-4-modeling)\n- [Step\
  \ 5: Evaluation](#step-5-evaluation)\n- [Step 6: Deployment](#step-6-deployment)\n- [Iteration and Continuous\
  \ Improvement](#iteration-and-continuous-improvement)\n- [Best Practices](#best-practices)\n- [Data\
  \ Collection and Quality](#data-collection-and-quality)\n- [Q&A from the Audience](#qa-from-the-audience)\n\
  \n**Q: Can you remind us about the different roles that typically exist in a data science team and how\
  \ they work together?**\n\n**Product managers** make sure the team is doing the right thing.\n\n**Data\
  \ analysts** understand and explain the data.\n\n**Data scientists** focus more on predicting than explaining,\
  \ and are more engineering-focused than data analysts.\n\n**Data engineers** ensure that analysts, data\
  \ scientists, and everyone else have access to the data and tools they need for analysis and model training.\n\
  \n**Machine learning engineers** work with data scientists to take their models and make them scalable\
  \ and production-ready as web services.\n\n**Site reliability engineers** (now often called MLOps engineers)\
  \ focus on reliability, monitoring, and operational aspects of the solution.\n\n## Why Processes Matter\n\
  \n**Q: Why is having a structured process important for machine learning projects? What problems can\
  \ it help avoid?**\n\nEveryone in a team needs to work together. Without a process, projects may fail—or\
  \ worse, you can spend months building something only to discover it wasn't useful.\n\nWith a process,\
  \ you can iterate faster, ensure you're solving the right problem, validate your assumptions, and kill\
  \ unpromising projects early without wasting time.\n\n## CRISP-DM Methodology\n\n**Q: What methodology\
  \ will you be discussing today, and why did you choose this particular framework?**\n\nThere are many\
  \ methodologies for organizing machine learning projects. Today I'll talk about CRISP-DM, which stands\
  \ for Cross-Industry Standard Process in Data Mining. Created by IBM in the 90s when data science was\
  \ called data mining, this framework surprisingly still applies to modern data science projects.\n\n\
  **Q: What are the main steps in the CRISP-DM methodology, and what does each step involve?**\n\nCRISP-DM\
  \ consists of six steps:\n\n1. **Business Understanding** - Understand the business problem, set objectives,\
  \ and ensure the problem is worth solving.\n\n2. **Data Understanding** - Analyze available data and\
  \ decide if it's good enough or if you need new data.\n\n3. **Data Preparation** - Transform the data\
  \ into a format usable for machine learning models.\n\n4. **Modeling** - Train the model using libraries\
  \ like scikit-learn.\n\n5. **Evaluation** - Check if the model performs according to your objectives\
  \ from the business understanding step.\n\n6. **Deployment** - If the model meets expectations, roll\
  \ out the solution to all users.\n\n## Example Use Case\n\n**Q: Can you give us a concrete example to\
  \ illustrate how these CRISP-DM steps work in practice?**\n\nWe'll use an example of classifying listing\
  \ categories. Imagine an online classified website like Craigslist, eBay, or Avito where people sell\
  \ and buy items. When you want to sell an iPhone, you create a listing, and interested buyers contact\
  \ you.\n\n**Q: What specific problem are we trying to solve in this example?**\n\nWe want to help sellers\
  \ create listings faster by developing a model that automatically suggests the right category. When\
  \ you create an iPhone listing, it suggests \"mobile phones\" as the category.\n\n**Q: What does the\
  \ team composition look like for this particular project?**\n\nWe have a cross-functional team responsible\
  \ for the posting flow. The team includes a product manager, back-end and front-end engineers, a data\
  \ analyst, a data scientist, a data engineer, a machine learning engineer, and a site reliability engineer.\n\
  \n## Step 1: Business Understanding\n\n**Q: How does the business understanding step work in practice?\
  \ What does this process look like?**\n\nWhen someone brings a problem to the team, the product manager\
  \ doesn't immediately commit. First, they analyze whether it's worth solving. Together with data analysts,\
  \ they quantify the size of the problem.\n\n**Q: What specific questions need to be answered during\
  \ the business understanding phase?**\n\n- How many users complain about this problem?\n- How many sellers\
  \ cannot finish posting because they can't figure out the correct category?\n- How many items end up\
  \ in the wrong category?\n\nWe need numbers to explain how big the problem is before jumping into solving\
  \ it.\n\n**Q: How do you actually measure something like user drop-off or category misclassification?\
  \ What are the practical challenges?**\n\nMeasuring user drop-off is tricky because it's hard to understand\
  \ why users stop—was it the category selection or something else? User interviews help, but they don't\
  \ easily translate into metrics.\n\n**Q: How did you actually quantify this problem in your example?\
  \ What data did you use?**\n\nWe talked to the moderation team—people who manually inspect listings\
  \ and correct them. They told us that 10% of listings end up in the wrong category, and they spend 10\
  \ hours per week (25% of their time) manually fixing categories. This is a significant problem worth\
  \ solving.\n\n**Q: Once you have quantified the problem with numbers, what are the next steps in the\
  \ business understanding phase?**\n\nWe need to set an objective. In this case: reduce the time moderators\
  \ spend manually reassigning categories by 50%. This means moderators will save 5 hours per week and\
  \ can focus on more important work.\n\nWe now have:\n- A way to measure the problem size\n- A way to\
  \ measure success\n- Clear direction on whether we're moving in the right direction\n\n**Q: Do you validate\
  \ whether machine learning is actually the right approach to solve this problem?**\n\nYes. The PM and\
  \ data analysts consult with data scientists to confirm that machine learning can solve this problem.\
  \ For this case, machine learning can indeed suggest the right category for a listing.\n\n**Q: Why is\
  \ the business understanding step so crucial? What happens if you skip it or rush through it?**\n\n\
  This step ensures the problem is worth solving before investing time in development, training, and productionization.\
  \ Many teams waste time on unimportant problems. Investing more time upfront in understanding and quantifying\
  \ the problem prevents this.\n\n## Step 2: Data Understanding\n\n**Q: What happens in the data understanding\
  \ step? What activities does the team focus on?**\n\nData scientists and data analysts work together\
  \ to understand what data is available and what's needed to solve the problem.\n\n**Q: What specific\
  \ data do we need for the listing categorization example? What sources should we consider?**\n\nWe need:\n\
  - Listing title (e.g., \"iPhone\")\n- Description\n- Images (potentially)\n- Correct category (from\
  \ moderator decisions)\n\n**Q: What do you do if some required data is missing or difficult to access?\
  \ How do you make decisions about data availability?**\n\nWe found that we have title and description,\
  \ but images are difficult to access. We need to decide whether to invest time getting images or proceed\
  \ without them. After consulting with data scientists, we determine that title and description are sufficient,\
  \ so we proceed without images.\n\n**Q: What role do data engineers play in the data understanding step?**\n\
  \nIf all data is in our data lake, data engineers don't need to do anything. If some data isn't accessible\
  \ (like moderator decisions), data engineers work with other teams to ensure the data is available in\
  \ our data lake.\n\n## Step 3: Data Preparation\n\n**Q: What happens in the data preparation step? What\
  \ activities are involved?**\n\nData engineers prepare the data by setting up pipelines to move data\
  \ from other teams (like the moderation team) into our data lake.\n\n**Q: How polished and complete\
  \ does the data pipeline need to be when you first start? What is the initial approach?**\n\nWhen starting\
  \ a project, iterate quickly. The pipeline doesn't need to be perfect—just good enough to get data from\
  \ other teams.\n\nThe goal is to have data easily accessible, ideally in a single table with all features\
  \ and the target. In our case: features are title and description, target is the correct category.\n\
  \n## Step 4: Modeling\n\n**Q: What happens in the modeling step? What is the typical workflow?**\n\n\
  Train a model. Ideally, the data is prepared so you can do a simple database select and feed it directly\
  \ into `model.fit`. For text data, apply preprocessing like CountVectorizer or TF-IDF Vectorizer.\n\n\
  **Q: What metrics do you use to evaluate your models during the modeling step?**\n\nDefine model evaluation\
  \ metrics like accuracy, precision, recall, F1, or AUC. These are internal data science metrics, not\
  \ business metrics.\n\n**Q: Should you start with a complex model, or is there a better approach for\
  \ the initial modeling phase?**\n\nStart with a simple baseline first—even just rules like \"if 'iPhone'\
  \ is in the title, then category is mobile phones.\" Check the accuracy. If it's good enough, proceed\
  \ to evaluation. If not, train a slightly more complex model. The key is having a way to measure performance.\n\
  \n## Step 5: Evaluation\n\n**Q: What happens in the evaluation step? How do you test whether the model\
  \ meets your objectives?**\n\nCheck if the model meets the objective we set. In our example: does it\
  \ reduce moderator time by 50%?\n\n**Q: How do you test the model in a production environment? What\
  \ is the testing strategy?**\n\nTest on a small portion of traffic (e.g., 5% of listings). Assign a\
  \ couple of moderators to work only with this traffic, while the rest handle the remaining 95%. Run\
  \ for one to two weeks and measure whether you hit your target—50%, 25%, or no reduction at all.\n\n\
  **Q: What are the possible outcomes of the evaluation step, and how do you respond to each scenario?**\n\
  \nThree possible outcomes:\n\n1. **Meets expectations** - Deploy it.\n\n2. **Doesn't meet expectations**\
  \ - The heuristic or model needs improvement. Train a better model (e.g., using scikit-learn), redeploy,\
  \ and evaluate again on 5% of traffic.\n\n3. **Doesn't move the metric at all** - Stop the project and\
  \ move on to something else.\n\n## Step 6: Deployment\n\n**Q: What happens in the deployment step? What\
  \ are the key activities and considerations?**\n\nIf the solution meets expectations, roll it out to\
  \ all users (100% of traffic).\n\n**Q: What do you need to focus on during the deployment phase? What\
  \ are the priorities?**\n\nFocus on engineering: ensure the service is reliable and scalable at 100%\
  \ traffic. Machine learning engineers and site reliability engineers handle infrastructure, monitoring,\
  \ and alerting.\n\n**Q: What does success look like after deployment? How do you measure it?**\n\nThe\
  \ model is in production, affecting all users reliably. Even if it's just a heuristic, it's packaged\
  \ as a web service and deployed.\n\n## Iteration and Continuous Improvement\n\n**Q: What happens after\
  \ deployment? Is this the end of the project, or is there more work to do?**\n\nGo back to business\
  \ understanding and decide how much to improve the model. Set a new objective and iterate. For example,\
  \ once you have a simple logistic regression model, consider adding images and training an image classification\
  \ model for better predictions.\n\n**Q: How do you decide whether to add complexity to your model or\
  \ keep iterating? What factors influence this decision?**\n\nAlways keep the business objective in mind.\
  \ Before adding complexity (like image classification), calculate the return on investment. Will spending\
  \ weeks or months on this bring enough improvement? If not, work on something else—what you have may\
  \ already be valuable enough.\n\n## Best Practices\n\n**Q: What is your recommended approach for following\
  \ the CRISP-DM methodology? What are the key principles?**\n\n1. Start with a simple heuristic (rules,\
  \ counters)\n2. Validate it works and brings value through one full iteration\n3. If the objective is\
  \ met, great! If there's room for improvement, add complexity\n4. Add proper machine learning, more\
  \ features, or use heuristics as features\n5. After iterating with simple models, try complex models\
  \ (NLP, deep learning) only if needed\n6. Calculate ROI before investing in complex models—usually the\
  \ PM handles this\n\n## Data Collection and Quality\n\n**Q: Why is data collection such an important\
  \ aspect of data science projects, and why is it often overlooked?**\n\nJulián Martínez noted that one\
  \ of the hardest aspects in machine learning is labeling data correctly, and few people talk about this.\
  \ It's an often overlooked but critical topic.\n\n**Q: Does the CRISP-DM methodology specifically address\
  \ data collection, and where does it fit in the process?**\n\nYes, it's part of the data understanding\
  \ step. We analyze what data we have and what's missing. If something crucial is missing, invest time\
  \ and money in collecting it—either by building better infrastructure or working with third-party providers\
  \ for labeling.\n\n**Q: How do you ensure data quality throughout the project? What strategies and tools\
  \ do you use?**\n\nData analysts typically check data quality to see if it's possible to build a sensible\
  \ model. \n\nOne useful trick: train a model and apply it to the training set. When the model makes\
  \ mistakes, it's often because the training data is incorrect. Identify these cases and manually fix\
  \ them.\n\n## Q&A from the Audience\n\n**Q: Isn't it better to establish the relationship between business\
  \ metrics and data science metrics before modeling, rather than discovering this through A/B testing\
  \ at the end?**\n\nYes, but if you don't have a model yet and want to start quickly, you need to roll\
  \ out something simple to test if business metrics move. Once you have a running model and want to improve\
  \ it, you can link data science metrics to business metrics.\n\nFor example, with a recommender system,\
  \ if mean average precision is 60%, you can try to correlate that with a business metric like user engagement.\
  \ This is possible once you have a running model.\n\n**Q: Is the CRISP-DM methodology practical for\
  \ smaller teams, or is it mainly for larger organizations?**\n\nTeam size doesn't matter. You don't\
  \ have to follow CRISP-DM by the letter—adjust it to your needs. If you want a dedicated data collection\
  \ step, add it. There are many similar methodologies you can find by Googling \"machine learning processes.\"\
  \n\nHaving a process is always a good idea, especially the business understanding step, because you\
  \ don't want to spend time solving unimportant problems. The emphasis on business understanding is what\
  \ makes these processes valuable.\n\n**Q: Do you typically conduct A/B tests as part of the CRISP-DM\
  \ process, and when are they most valuable?**\n\nYes, A/B tests are the best way to evaluate models\
  \ in production."
