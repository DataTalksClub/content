context: 'Context: This episode follows Tamara’s journey from software and music-tech engineering into
  computational linguistics and open-source stewardship, and uses concrete case studies (credit-scoring
  fairness, moderation systems) plus tool discussions (Fairlearn, interpretability packages, secure model
  serialization) to examine how technical choices, metrics, and developer practices translate into real
  societal outcomes. Recurring threads include tradeoffs in fairness metrics, the necessity of domain
  expertise and human-in-the-loop processes, the engineering challenges of interoperable, secure ML tooling,
  and the role of community and practitioner education in shaping responsible ML.

  Core: The unifying idea is that building fair, trustworthy AI is a sociotechnical engineering task:
  it requires not just algorithms but pragmatic, community-driven tools, secure software practices, clear
  interpretability, and organizational processes that embed human judgment and domain knowledge so technical
  models produce just, accountable outcomes in the real world.'
