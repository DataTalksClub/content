context: 'Context: This episode surveys the Scikit-Learn ecosystem, related projects (Scikit Lego, Skrub),
  and initiatives like Calm Code and :probabl., weaving together career stories, governance, tooling choices,
  content production, maintainer handoffs, CI/cost concerns, and early business models.

  Core unifying idea: Long-term health and impact of open-source machine-learning projects depends not
  just on great code but on a deliberate integration of engineering excellence, community stewardship,
  accessible education, and sustainable operational/business practices — i.e., building pragmatic tools
  and clear learning paths while creating incentives (training, consulting, platform models, cost-efficient
  infrastructure, and low-pressure contributor experiences) that enable maintainers and contributors to
  keep projects useful, adoptable, and durable.'
