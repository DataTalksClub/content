intro: How can open source ML tools stay healthy, useful, and financially sustainable while serving both
  researchers and industry? In this episode Vincent Warmerdam — Research Advocate at Rasa, author of the
  Koaning blog, creator of the Algorithm Whiteboard playlist, and cofounder of Calm Code — walks through
  the real-world tradeoffs of scikit-learn governance, sustainability, and business models for ML tooling.
  <br><br> We dig into scikit-learn's history, NumFOCUS relationships, and the plugin-versus-core strategy;
  practical maintainer issues like transitions, motivating volunteers, and using open source contributions
  as hiring signals; and the intersection of developer relations and core engineering. Vincent also explores
  Calm Code's low-pressure teaching philosophy, content and monetization choices, and platform decisions
  (Django, contributor hiring). Technical operations topics include CI cost optimization with custom runners
  and sustainable compute examples (Leaf.cloud), plus hands-on projects like Skrub's table vectorizer
  and GAP encoder for pragmatic tabular defaults. <br><br> Listeners will gain actionable insights on
  governance models, maintaining project health, and realistic business options — training, consulting,
  and partnerships — for anyone building or stewarding open source ML tools.
