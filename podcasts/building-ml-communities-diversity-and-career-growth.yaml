intro: 'How do you build and scale a data science community that actually advances diversity, supports
  machine learning deployment, and accelerates career growth? In this episode, Dânia Meira — AI Guild
  co-founder, data scientist, teacher and speaker with a Master’s in Computer Science (AI) — walks through
  her journey from applied math and marketing analytics to founding a global data science community in
  Berlin. <br><br> We cover practical community building: turning women’s meetups into monthly dinners
  and an international membership, curating meetup content and the Datalift Summit, and policies like
  visibility-first speaker invites, codes of conduct, and misconduct response. Dânia explains why diversity
  (gender, nationality, neurodiversity) improves product fit and market reach, how to create psychological
  safety, and how to source and train diverse talent for regulated industries. She also outlines a vendor-agnostic
  consulting model for machine learning deployment, community-to-client matching, and scaling from a freelance
  network to full-time teams.'
