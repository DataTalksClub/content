intro: How do you build data infrastructure that stops stolen-card transactions and return abuse in real
  time? In this episode, Angela Ramirez, a Sam’s Club data engineer who moved from Sephora and specializes
  in machine learning for fraud prevention, walks through the engineering behind retail fraud detection.
  Drawing on her background in NLP and four years as a data engineer, Angela explains pipelines, feature
  engineering workflows that combine daily batches with real-time scoring, and the MLOps responsibilities
  for model metrics, deployment, and monitoring. <br><br> We cover system design best practices—stakeholder
  alignment, timing, documentation—and data modeling tradeoffs across relational, document (Elasticsearch),
  and graph databases (SPARQL, Neo4j) to support network features connecting members, transactions, and
  products. Angela also discusses hybrid architectures for instant inference, tooling like PySpark, Pandas/PyArrow,
  Cassandra, GCP/Dataproc, and data quality practices (Great Expectations), plus operational debugging
  and scaling patterns. Listen to learn practical approaches to real-time scoring, graph-powered investigations,
  and the engineering decisions that make retail fraud detection reliable and actionable
