description: 'Learn data governance in the cloud: build data classification, catalogs & policies, automate
  tagging, add stewards and measure ROI for trusted, compliant data'
intro: 'How do you build data governance in the cloud that enables access, meets regulation, and demonstrates
  ROI? In this episode, Jessi Ashdown, Senior UX Researcher for Google Cloud, and Uri Gilad, Product Manager
  for Data Governance at Google Cloud, walk through practical approaches to data governance in the cloud—grounded
  in real user research and product experience. <br><br> They define governance beyond security and PII,
  explain how GDPR and high-profile events like Cambridge Analytica accelerated adoption, and outline
  the core components: people, processes, and tools. Key topics include data classification and taxonomy,
  building scalable data catalogs versus spreadsheets, policy design (retention, freshness, purpose-based
  access), enforcement models, and access workflows. They cover roles such as data stewards and producers,
  data quality signals, automation (tagging and requests), and what to measure for ROI—catalog metrics,
  cost versus usage, and compliance value. You’ll also hear an MVP strategy for minimum viable governance
  and what to include in a catalog (technical metadata, lineage, business glossary). <br><br> Listen to
  gain actionable steps to scope a cloud data governance program, prioritize by the “why,” and implement
  classification, catalogs, and policies that balance control and democratized access.'
