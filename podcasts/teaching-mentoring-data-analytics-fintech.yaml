intro: 'How do you design a FinTech data analytics curriculum that teaches fraud detection, chargeback
  modeling, and real-world cloud skills while also mentoring diverse learners? In this episode, Irina
  Brudaru — Head of Data & Analytics at Finlex, former Google data leader, and long-time mentor and teacher
  — walks through building practical FinTech courses informed by industry experience across Berlin, Amsterdam
  and the Bay Area. <br><br> We cover curriculum components you can reuse: rule-based vs neural approaches
  to fraud detection, chargeback modeling, deploying ML in production, and essential business skills for
  analysts. Irina explains hands-on BigQuery labs, student cloud access strategies, and how to demystify
  Google Cloud for analysts. She shares mentoring methods (visual explanations, learner-centered teaching),
  instructor sourcing and storytelling for classroom impact, cohort analysis for product metrics, recruiting
  women to zoomcamps, and securing technical reviewers. <br><br> Listen to gain actionable guidance on
  structuring FinTech analytics training, designing cloud labs, teaching fraud detection and chargeback
  workflows, and adopting mentoring practices that help career changers and underrepresented learners
  succeed in data analytics.'
