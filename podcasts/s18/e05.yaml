summary: |-
  Erum Afzal is a lead machine learning engineer and a PhD researcher at Justus Liebig University in
  Giessen, near Frankfurt, who specializes in AI for education. She heads Omdena Academy. She comes
  from a less developed area of Pakistan where girls are often not allowed an education, and she
  began giving workshops and courses instead of only attending them. Alexey invites her to talk
  about community building and teaching.

  Omdena started in 2019 as a global community where groups of 50 to 60 collaborators solve real-
  world problems with AI. Erum joined as a collaborator on the first project, and the academy grew
  out of the projects. Courses taught what was learned in a project, such as a solution for vision-
  impaired people in Germany, and later, on organizational demand, foundational courses in Python
  and pandas, natural language processing and interview preparation. Teaching helps the instructors
  too, Erum says, because they have to solve problems in order to explain them. Collaborators apply
  through an always-open registration page, and the team reviews their content before launch.

  Courses are free for students, and instructors are not paid. Erum says her CEO believes education
  should be free for learners, so Omdena charges organizations instead. Anyone can join a course
  without being in the community, and graduates can join any project. The courses are live. Omdena
  invites about 100 of 400 to 500 registrants, based on prerequisites, motivation and availability,
  and the graduation rate is around 33 percent, because many attend but do not submit assignments.
  Free DataCamp subscriptions help motivation.

  Erum says community management is not her main role, since a community manager handles it. Her
  advice is to start small, as AI Wonder Girls did, growing from seven or eight girls to more than
  100, and to let people use the community's name for local groups. Alexey says he should encourage
  local DataTalks.Club chapters in Slack. To compete with recorded content, Erum suggests clear
  takeaways for each session and courses split into basic, intermediate and advanced levels. She
  does not think the market is saturated, but says people need distinctive skills and should use
  ChatGPT without just copying.

  To teach at Omdena, Erum recommends joining a project first and then applying through the Omdena
  Academy page. Teaching there is volunteer work, but it helps build a course that could later be
  sold on platforms such as Coursera or Udemy. For women looking for AI education, she suggests AI
  communities, Coursera scholarships and GitHub projects.
