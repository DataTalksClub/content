    abuse.
  sec: 2194
  time: '36:34'
  who: Sabina
- header: Metrics, false negatives and survey bias
- line: Does it help to address the skepticism you mentioned?
  sec: 2213
  time: '36:53'
  who: Alexey
- line: What do you mean?
  sec: 2219
  time: '36:59'
  who: Sabina
- line: You said that it was met with skepticism, because people say AI, no, it's not going to help.
  sec: 2219
  time: '36:59'
  who: Alexey
- line: Yes, obviously we're transparent about the metrics we've used, and we've been through many, many
    iterations in order to make this as good as possible. We've been looking at the typical standards
    in the industry, like the AUC score. We've looked at false positives, false negatives. Obviously,
    we've tried to put the weight on removing false negatives as much as possible. But at the same time,
    if we say that everything is high risk, then that's not very useful either. So we've tried to strike
    a balance as much as possible, thinking about the typical metrics that are used, and also thinking
    about the types of questions that we selected in our survey and what's more likely to be answered
    by someone in those situations.
  sec: 2226
  time: '37:06'
  who: Sabina
- line: Ah, so this is also important, because maybe there are good questions that can show you that this
    sort of abuse is happening, but the victim might not answer them, right?
  sec: 2278
  time: '37:58'
  who: Alexey
- line: Yeah, might be less likely to answer. However, the thing is, in different settings you will have
    different answers. And this is also why the survey that we did was online rather than in person. Because
    in person you already have some biases occurring from when the interviewer asks the questions to receiving
    the answer.
  sec: 2291
  time: '38:11'
  who: Sabina
- line: And these biases, so here it means that because a person is asking, there could be some pressure.
    Even though the person might be the friendliest person on Earth, still, because somebody is asking,
    you might think, okay, there's another person, why are they asking that, right? It might not give...
  sec: 2319
  time: '38:39'
  who: Alexey
- line: I think humans are very complicated and have complicated emotions, so it's very difficult to predict
    that, right? So removing this intermediate step is likely to reduce such biases. There's also such
    a thing as social desirability bias. So for example, if you're a man and you disclose that you've
    been experiencing abuse, that might not fare well, right? You might not want to be seen as a weak
    man.
  sec: 2340
  time: '39:00'
  who: Sabina
- line: I see. And when it's online, there is less. Because I imagine there is this big police officer.
    In Berlin, the field police officers have to be quite strong, and I see that they are usually tall,
    they have muscles. And if this person is asking you, maybe you don't want to admit that you're weak.
    But if it's just a screen and you tick boxes there, it's less likely that you give incorrect answers.
    This is what you're saying, right?
  sec: 2369
  time: '39:29'
  who: Alexey
- line: Yes, this is what I would expect, right? You're simply interacting online, you don't have your
    identity disclosed. We're also taking care to not have the identity of the people that we have surveyed.
    So yes, we're hoping to reduce that bias that is already happening. And this is also important because
    a lot of studies in the domestic abuse sector are also based on police data, right? And police data
    will be inherently biased because of the way it's been collected. So this is where the biases come
    in, and we hope to eliminate at least those biases through having this as a survey.
  sec: 2410
  time: '40:10'
  who: Sabina
- line: How do people get to fill in the survey? Is it something like they are at the police, and then
    the police officer says, okay, there is this tool, I will leave now, but while I'm away, can you please
    go through the website and answer the questions? Or how does it work?
  sec: 2459
  time: '40:59'
  who: Alexey
- line: No, I think they ask the questions. So they ask the questions and fill in the survey, or they're
    given a tablet where they can answer these questions. But yes, we're piloting and we're learning.
  sec: 2477
  time: '41:17'
  who: Sabina
- line: Because if a person is asking, then you have these biases, right? Even if they are sitting with
    a tablet, and I'm asking you and then making some notes here, it's still me asking you.
  sec: 2494
  time: '41:34'
  who: Alexey
- line: Yeah, so actually I'm not completely sure about this, because I've been kept very much on the
    development side of things, I would say. Potentially it could be either. But yeah, I think I will
    stick with the data side.
  sec: 2506
  time: '41:46'
  who: Sabina
- header: 'Model choice: why logistic regression won'
- line: Well, yeah, maybe let's go into the development side of things then. We talked about skepticism,
    right? And in my experience, to reduce this level of skepticism, a person needs to understand what
    is happening inside. And usually you want to use simple models. Usually you can explain linear regression
    or logistic regression in layman's terms to anyone, if you have enough patience. Typically this is
    the case. So I imagine you need to use models like decision trees maybe, or linear models, right?
    Or others?
  sec: 2527
  time: '42:07'
  who: Alexey
- line: So actually logistic regression works quite well, surprisingly. We've tried a couple of models.
    We've tried decision trees, we've tried boosting algorithms, we've tried support vector machines,
    because it's somewhere in the middle of the data set. But we found that actually logistic regression
    has performed best, with the features that we selected and the number of features that we selected.
    And by best I mean both in terms of the overall performance and in having a lower likelihood of overfitting,
    because this is what typically happens with trees, if you go to random forests and XGBoost and whatnot.
  sec: 2578
  time: '42:58'
  who: Sabina
- line: Actually, now when you talk about that, I remember there was a Kaggle competition also on survey
    data. I don't remember what the target was, but it was something in social sciences, and linear models
    worked best there too. The winning solutions used linear models. So I'm actually not surprised. But
    also, as a benefit, you can explain in simple terms why it works, why at the end the result is high
    risk. Because you say this answer has this sort of weight, this answer has this sort of weight. Because
    this person said true to that statement and false to that statement, we think that maybe this is financial
    abuse, or maybe this is emotional abuse. And then because they understand how it works, they are more
    likely to use the tool and trust it, right?
  sec: 2626
  time: '43:46'
  who: Alexey
- line: Yeah, this is what we're hoping, and we're trying to get some of the decision... It's much easier
    to explain for sure, because you just have the coefficients and you can get the odds ratio from that.
  sec: 2688
  time: '44:48'
  who: Sabina
