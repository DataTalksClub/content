    things you see. I won't say that I got desensitized, but I think sometimes I just look at data. I
    don't look at what actually has happened, I look at numbers. Because at the end of the day, these
    models are fed with data, and I think about, okay, how can I get these metrics higher. So when I do
    the model development bit, I don't really think about it. I just think about how awesome it is that
    I get to help these people.
  sec: 3394
  time: '56:34'
  who: Sabina
- line: But when I go into the analysis bit and start to think about, oh, what correlates with physical
    abuse, and you see how abuse doesn't happen in isolation, and you're thinking about all of these experiences
