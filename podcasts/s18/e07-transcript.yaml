  sec: 2712
  time: '45:12'
  who: Alexey
- line: Everything when it comes to model development. It's funny, because I started the MLOps course
    that you do, and I'm still at the first homework, because I built the MLOps workflow, let's say, with
    MLflow. I started with PyCaret and then I left it because it was too heavy for the app itself. So
    I did the whole model development cycle, obviously with a lot of input from both Balin and Babs in
    terms of what outcomes we want, what statistical tests maybe we should focus on when doing X and Y.
    And building on what my previous colleague Joy did in the past, in terms of recording data, the analysis
    he did and the initial models.
  sec: 2720
  time: '45:20'
  who: Sabina
- line: So you would say that your main focus is on the modeling side?
  sec: 2780
  time: '46:20'
  who: Alexey
- line: Definitely. My main and only focus, really. My colleagues were laughing that I'm really bad at
    selling, and that's because I have no practice, right?
  sec: 2783
  time: '46:23'
  who: Sabina
- header: 'Hardest part: validating individual predictions'
- line: What is the most challenging thing for you?
  sec: 2796
  time: '46:36'
  who: Alexey
- line: I think the very pragmatic aspects of data are challenging, in the sense that I can build all
    of these models and I can have all of these metrics, I can run thousands of models, I can put them
    on AWS, la la la, all of that stuff. But then what does that actually mean? What happens afterwards?
    If a person answers X, Y, Z on a question, what happens, right? And being able to test that and validate
    that, the testing of the final models, having the setting in mind, is definitely the hardest thing.
  sec: 2804
  time: '46:44'
  who: Sabina
- line: Because I think also testing for ML models is not as developed as unit testing or integration
    testing is in software development. So I found it quite difficult to wrap my mind around that and
    figure out a way to do it. But yeah, I'm working on that, and we're working on scenarios in order
    to make that happen. And make sure that, sure, our models work on the bulk of the data, but we also
    want to make sure that for each individual we're getting answers in the range that we expect. So this
    is another thing that we do in addition to other tools, because our main goal is to be there and help
    every single victim of domestic abuse. And yeah, it was a bit packed.
  sec: 2848
  time: '47:28'
  who: Sabina
- line: So I'm a bit lost. For sure, I took some notes. So you said you want every individual to answer
    in the range we expect, something like that?
  sec: 2901
  time: '48:21'
  who: Alexey
- line: 'No, so we want things to make sense, right? The models output a probability, right? That''s all
    they do. What that probability means is something that we interpret: is that high, low, medium risk.
    That''s one thing. Second, it''s regarding the severity of abuse, right? Because a machine learning
    model will not make the difference between someone controlling your finances, or checking your Facebook
    account, or hitting you. So these are all things that we''re taking into consideration. And we want
    to make sure, and I think this is kind of a bit of data validation, that the output of the model is
    within what we would expect as humans to see as a high or low probability. But the probability is
    output by a logistic regression. They''re just there to optimize for victim or non-victim. They''re
    not giving more detail than that. So that''s what we need to do.'
  sec: 2917
  time: '48:37'
  who: Sabina
- line: I think I'm starting to understand. So here the idea is that a model just gives a number, but
    we need to also remember that, well, there is a human there for whom we calculate the number. But
    also, what does this number actually mean, right?
  sec: 2989
  time: '49:49'
  who: Alexey
- line: Yeah, exactly.
  sec: 3009
  time: '50:09'
  who: Sabina
- line: How high it is. Because in the usual logistic regression case, if it's 0.51, then you predicted
    that this is y equals one, right? Otherwise...
  sec: 3009
  time: '50:09'
  who: Alexey
- line: 'Yeah. And obviously, as you know, when you do model optimization, you play with the thresholds,
    right? You see what gets you better results or not. But that doesn''t really tell us: is this person
    high risk? Does this person need immediate intervention? So this is why we need all of this post-modeling
    testing.'
  sec: 3030
  time: '50:30'
  who: Sabina
- line: 'Okay. What you''re saying is there could be two people: for one the risk is 60%, for the other
    it''s 90%, but it doesn''t necessarily mean that the 90% case needs more urgent help, right?'
  sec: 3054
  time: '50:54'
  who: Alexey
- line: No, I think in terms of relative scale, that's definitely the case. But at what point do you say
    it is high risk? I think that's more what I mean.
  sec: 3073
  time: '51:13'
  who: Sabina
- line: Okay, so one thing is predicting positive, that there is an instance of, I don't know, digital
    abuse. But also, to what extent, after which cutoff point we need to actually intervene as soon as
    possible.
  sec: 3086
  time: '51:26'
  who: Alexey
- line: Exactly. And also, what types of abuse has the victim already admitted to? For example, if a victim
    has been choked at some point, that's already quite a severe thing. So in that sense, that person
    is already high risk, even though a model might not see it as fully high risk. But usually this does
    happen, fortunately. The thing is, you don't know until you test all of these different scenarios,
    right? What model metrics give you is overall performance, and I do trust that, but it doesn't give
    you the individual results, and those tend to be more important. This is why we want to focus on them.
    So I think that's quite a difficult thing. I think it's very underdeveloped in machine learning, but
    it's something that we're focusing on.
  sec: 3105
  time: '51:45'
  who: Sabina
- line: How many data scientists are working on this?
  sec: 3169
  time: '52:49'
  who: Alexey
