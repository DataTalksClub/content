  sec: 2150
  time: '35:50'
  who: Alexey
- line: Oh yeah, obviously.
  sec: 2164
  time: '36:04'
  who: Sabina
- line: And they don't need to calculate it themselves, they don't need to add up the points.
  sec: 2167
  time: '36:07'
  who: Alexey
- line: Yeah.
  sec: 2171
  time: '36:11'
  who: Sabina
- line: So they go through the survey, they get the results immediately, and they see that for these types
