  sec: 3267
  time: '54:27'
  who: Sabina
- line: Yeah, I'm just curious. Usually probably more women than men have this problem, but are there
    men who... Because we talked about this bias, social disability bias, was it? Desirability bias?
  sec: 3283
  time: '54:43'
  who: Alexey
- line: Yes.
  sec: 3302
  time: '55:02'
  who: Sabina
- line: Can you say it again?
  sec: 3302
  time: '55:02'
  who: Alexey
- line: Social desirability bias.
  sec: 3302
  time: '55:02'
  who: Sabina
- line: Desirability, yeah. So maybe men don't even think that they need to seek help.
  sec: 3306
  time: '55:06'
  who: Alexey
- line: I would say that it's the case for both women and men, about seeking help, just because it's intimate
    partner violence. That's a very difficult topic. And I think one of the misconceptions is that the
    person can just leave the relationship, which is absolutely not true, because they have become partners
    with this person because they love them. So maybe they think the person will change or that things
    will be different. So maybe they reach out at some point, but then they change their minds. And it's
    usually quite difficult for people who are close to them to intervene as well.
  sec: 3316
  time: '55:16'
  who: Sabina
- line: And percentage-wise, in this data, do you remember how many men and women?
  sec: 3353
  time: '55:53'
  who: Alexey
- line: I will tell you that men typically experience more emotional abuse, whereas women experience more
    physical and sexual abuse. And overall, women experience more abuse.
  sec: 3361
  time: '56:01'
  who: Sabina
- line: I see. And for you as a person, it must be quite difficult to work with this data. Because every
    line in this data is a person, is a tragedy, right? Because they have to live with this situation.
  sec: 3378
  time: '56:18'
  who: Alexey
- line: Yeah, I mean, I would say it's a bit similar to... well, I don't want to compare myself to a doctor,
