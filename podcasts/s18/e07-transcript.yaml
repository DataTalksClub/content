  sec: 2010
  time: '33:30'
  who: Alexey
- line: Yes. And there is obviously lots of skepticism when bringing in AI to help officers. But that's
    the thing. I think there has been a lot of news criticizing the way that AI has been used in order
    to make decisions, and this is why we haven't created Lizzy to make decisions for police officers,
    but to help them. It's a tool for them to make a decision. However, it has been shown in practice
    that risk assessments are more effective than expert judgment. So this is why I think it's quite important
    to have these tools, but not use them as the decision makers.
  sec: 2038
  time: '33:58'
  who: Sabina
- line: Which means that instead of just saying the probability of abuse occurring again is very high,
    you also explain why, right? Or how? What does it mean in practice that you don't use it to make decisions,
    but to guide?
  sec: 2088
  time: '34:48'
  who: Alexey
- line: That we're looking at the risk of the abuse occurring, but we are not social workers, we're not
    police officers. We're a research company. So we can tell you that, based on the research that we've
    done, this person is likely experiencing abuse. And you, as an expert, can say, okay, if they're experiencing
    high financial abuse and high physical abuse, this is what I should do in this scenario. We don't
    give recommendations. We give suggestions, like, okay, this is something that may help. But we are
    not there to make decisions.
  sec: 2104
  time: '35:04'
  who: Sabina
- line: Okay. And the users, the police officers, the social workers, they go through the survey, and
    then they see the results, I imagine, immediately, right? They don't need to send the results anywhere
