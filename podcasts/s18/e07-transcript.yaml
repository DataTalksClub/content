podcast: building-domestic-risk-assessment-tool
segments:
- header: Episode Introduction
- line: Hi everyone, welcome to DataTalks.Club. This event is brought to you... Yeah, I think I haven't
    done this in a while. Usually I remember the line, I remember what to say without thinking about this.
    And yeah, we haven't had podcast interviews in three weeks, maybe four. So now we are finally back.
    We are again looking for speakers, so if somebody wants to speak, let us know.
  sec: 0
  time: 0:00
  who: Alexey
- line: Anyways, welcome to our event. This event is brought to you by DataTalks.Club, which is a community
    of people who love data. We have weekly events, or at least we try. If you want to know more about
    our events, there is a link in the description. Click on that link and check what we have in our pipeline.
    And I need to update the number of subscribers, I think now it's more. So do not forget to subscribe
    to our YouTube channel. Very important. This way you'll stay up to date with all our future streams,
    like the one we have today.
  sec: 27
  time: 0:27
  who: Alexey
- line: And we have a great Slack community where you can hang out with other data enthusiasts. During
    today's interview, you can ask any question you want. There is a pinned link in the live chat. Click
    on that link, ask your questions, and we will be covering these questions during the interview. And
    I still remember something, that's good, so I haven't forgotten completely what to ask. I'll quickly
    open the questions so I can monitor them, which I should have done before.
  sec: 61
  time: '1:01'
  who: Alexey
- line: It's okay, I feel you. It's okay. It's also my first podcast on the other side of the podcast.
    So there you go, it's fine.
  sec: 97
  time: '1:37'
  who: Sabina
- line: On the other side? So you interview people?
  sec: 105
  time: '1:45'
  who: Alexey
- line: No, I mean, everyone these days can have a podcast. My friends and I tried to do a tango podcast
    some time ago. And yeah, interviewing friends.
  sec: 109
  time: '1:49'
  who: Sabina
- line: Yeah. But tango is a very visual topic and a podcast is typically audio only. How do you talk
    about tango? How do you discuss different moves?
  sec: 122
  time: '2:02'
  who: Alexey
- line: Well, we don't discuss moves, that's the thing. We talk about the social aspect of tango. We talk
    about how interesting the invitation in tango is, about our experiences leading and following in tango,
    dancing with people, meeting people, going to events and being obsessed enough to travel around the
    world just to do tango. Those sorts of things. Everything but the actual dance.
  sec: 133
  time: '2:13'
  who: Sabina
- line: Do you travel around the world to meet other people and dance tango?
  sec: 163
  time: '2:43'
  who: Alexey
- line: Yes, actually. Well, around Europe so far.
  sec: 166
  time: '2:46'
  who: Sabina
- line: Around Europe. Yeah, I only tried bachata, so I haven't...
  sec: 172
  time: '2:52'
  who: Alexey
- line: Yeah, people do travel for bachata as well. So yeah, I can imagine, because it's also fun.
  sec: 177
  time: '2:57'
  who: Sabina
- line: Yeah, it is. I think I attended six sessions. I only remember the basic move, but yeah.
  sec: 182
  time: '3:02'
  who: Alexey
- line: I mean, that's good enough, you know. You can already go dance socially, which is...
  sec: 192
  time: '3:12'
  who: Sabina
- header: 'Guest introduction: Sabina Firtala and Frontline 100'
- line: That's right. Anyways, this week we will not talk about tango, maybe a little bit. We will talk
    about building a domestic risk assessment tool. And we have a special guest today, Sabina. Do I pronounce
    it correctly, Sabina?
  sec: 198
  time: '3:18'
  who: Alexey
- line: Yeah, it's perfect. Yeah, it's Romanian pronunciation.
  sec: 215
  time: '3:35'
  who: Sabina
- line: Okay. So Sabina works on Frontline 100's AI product development. Frontline 100 is a company name.
    So she's involved in all aspects of model development, from data wrangling and visualization to statistical
    tests, model training and validation. She has a background in natural sciences and previously worked
    as a data analyst in finance and SaaS companies. As a freelance data analyst, she takes on challenging
    projects for mission-driven companies, being especially interested in social impact, health care and
    accessibility. You are a freelancer, right?
  sec: 219
  time: '3:39'
  who: Alexey
- line: Yes, at the moment. Yes.
  sec: 256
  time: '4:16'
  who: Sabina
- line: So welcome to our interview.
  sec: 256
  time: '4:16'
  who: Alexey
- line: Nice to see you.
  sec: 262
  time: '4:22'
  who: Sabina
- line: Nice to see you again. I hope you have your Soylent with you.
  sec: 262
  time: '4:22'
  who: Alexey
- line: Was it Soylent, right? It was...
  sec: 270
  time: '4:30'
  who: Sabina
- line: yfood. yfood, yeah. That's the brand that they have here, the meal replacement.
  sec: 275
  time: '4:35'
  who: Alexey
- line: Because that's how we met, right?
  sec: 279
  time: '4:39'
  who: Sabina
- line: Yeah, that's how we met. So, for background, this is how we met. There was a meetup. I think it
    was actually co-organized by DataTalks.Club, but the only thing we did to co-organize the event is
    place our logo there. It was mostly done by DT Hub, which bought food. What else? They provided the
    office and food and drinks. Very important.
  sec: 279
  time: '4:39'
  who: Alexey
- line: Yeah.
  sec: 310
  time: '5:10'
  who: Sabina
- line: So basically they did the whole thing and they just asked me to show up. How can I say no to that,
    right?
  sec: 310
  time: '5:10'
  who: Alexey
- line: Yeah. And it was so funny, because I knew about DataTalks, and after the event I was like, wait
    a second, is this person that I met actually from DataTalks?
  sec: 316
  time: '5:16'
  who: Sabina
- line: Yeah. So it was a bit noisy there. They have a, how do you call it, a room for meetups, right?
    It's not the largest room for meetups, and when many people start speaking there, it gets loud. So
    of course I was trying to hide in a calm room, and then there was Sabina also hiding. And I had this
    yfood bottle, which is a meal replacement. You just drink it and it has 500 calories. And then your
    comment was like...
  sec: 326
  time: '5:26'
  who: Alexey
- line: I'm more like a Huel person. Yeah, because I was very into meal replacement at some point. I drank
    Huel for lunch every single day.
  sec: 363
  time: '6:03'
  who: Sabina
- line: Ah, so you were that into it.
  sec: 374
  time: '6:14'
  who: Alexey
- line: Yeah. I mean, I still have Huel at home, but I just find it difficult to have it nowadays on a
    regular basis. Otherwise I would still love to have it. It's great, a time saver.
  sec: 378
  time: '6:18'
  who: Sabina
- line: Yeah, I just drink it after the gym usually. I want to consume a certain amount of protein per
    day, and when I don't hit the number, then I just drink this, because they have a lot of protein.
  sec: 389
  time: '6:29'
  who: Alexey
- line: Anyways, so this is how we met. Then we talked a little bit about Sabina's work, and that was
    pretty interesting. So when we connected later on LinkedIn, I thought, I have to interview her. So
    that's why we're here talking today. And yeah, as always, the questions for today's interview are
    prepared by Johanna Bayer. Thanks, Johanna, for your help.
  sec: 407
  time: '6:47'
  who: Alexey
- header: 'Career journey: from organic chemistry to data analytics'
- line: So let's start. Before we go into our main topic, we start with your background. Can you tell
    us about your career journey so far?
  sec: 432
  time: '7:12'
  who: Alexey
- line: Yeah, I think the bio was quite well put already. I've been in the workplace for very little time,
    but I've already had quite a few career switches. So yeah, I studied chemistry at the University of
    Cambridge. I started off with natural sciences and then specialized in organic chemistry. Afterwards,
    I decided that lab work was not really my thing. I much more preferred the thinking work of organic
    chemistry compared to the grunt work of doing experiments and working in the wet lab.
  sec: 445
  time: '7:25'
  who: Sabina
- line: So then I thought that I would like to do something, either in consulting, but then this opportunity
    appeared to work as a data analyst in tenie, and I had to take it. Because it's quite rare to get
    to work on something very interesting, also for mission-driven companies, and also in a lovely place
    to live in. And then from finance, I realized I didn't like Excel that much. I didn't want to work
    all of my life in Excel. It wasn't really my thing.
  sec: 486
  time: '8:06'
  who: Sabina
- line: I was very keen on Python since the pandemic. I'm not sure if you know about Hyperskill, but they're
    super cool. But do you know about JetBrains, by any chance?
  sec: 520
  time: '8:40'
  who: Sabina
- line: JetBrains, yeah.
  sec: 533
  time: '8:53'
  who: Alexey
- line: So they've worked with Hyperskill on creating this learning platform for Python and lots of other
    programming languages. And I think it's one of the best I've seen. That's how I started learning Python.
  sec: 536
  time: '8:56'
  who: Sabina
- line: Hyperskill, right?
  sec: 549
  time: '9:09'
  who: Alexey
- line: Hyperskill, yeah. I highly recommend it. It is quite pricey, but I think they offer a lot of value
    as well. So I started learning Python and I thought, hey, I've already worked in data analysis in
    finance and I already know a bit of programming. And then I went for Ironhack and studied data analytics
    with them. Since then I've been taking data analytics positions, and I switched to freelancing because
    I find it more suited to my interests. I like dipping my toes into multiple fields.
  sec: 549
  time: '9:09'
  who: Sabina
- line: And yeah, right now my main focus is Frontline 100, because I think the work that we do is very
    important and very impactful, and I really, really love it. Obviously the topic is quite heavy, so
    saying it very enthusiastically might come across as weird, but I really love having the opportunity
    to contribute to such a topic.
  sec: 592
  time: '9:52'
  who: Sabina
- header: 'Frontline 100: ending domestic abuse sooner with AI'
- line: And right now I want to ask you about the topic, of course, but I want to give a warning. A disclaimer,
    not a disclaimer, probably a warning would be a better word. We are going to talk about a sensitive
    topic, which is domestic abuse and violence. If you know somebody who is experiencing domestic abuse,
    you should seek help. If you live in Germany, there is a national helpline available at 116 016. And
    if you live somewhere else, please find a number to contact.
  sec: 618
  time: '10:18'
  who: Alexey
- line: I think this is an important topic. That's why, when I heard about what Sabina is doing... I have
    not heard about AI applications to that topic, so that's why we're here. I wanted to talk about that.
    So yeah, please tell us about Frontline 100 and what you're trying to solve.
  sec: 653
  time: '10:53'
  who: Alexey
- line: Right. So the main purpose of Frontline 100 is to end domestic abuse sooner. And as you very correctly
    pointed out, AI in this field is not something that's very common, which is why what we're bringing
    to domestic abuse prevention is quite relevant. Most of the domestic abuse risk assessments in the
    field are on paper only. So I think that having an AI tool involved in this, especially with all of
    the hype around AI, and having in general an application of AI to social issues, is very relevant.
    So I was very excited when I first saw the Frontline website. I was like, this is incredible, I've
    never thought of using AI for such a cause. So I was very excited from the get-go.
  sec: 675
  time: '11:15'
  who: Sabina
- line: How did you find them, or did they find you?
  sec: 736
  time: '12:16'
  who: Alexey
- line: It's very funny, because I found them through a Telegram group. One of the previous data scientists,
    Joy, posted in the computer science university alumni Telegram group. And then one of my friends who
    also studied there sent me this job post, and I was like, wow, this is incredible, this is exactly
    what I want. Because I was looking for many positions at the time. So yeah, it was very fun.
  sec: 740
  time: '12:20'
  who: Sabina
- header: Finding data jobs at mission-driven organizations
- line: Well, I'm not actively looking for a job, but sometimes I come across different job descriptions,
    typically on LinkedIn. And usually it's e-commerce or internet companies, ad tech or marketing, the
    usual thing, right? I don't typically come across social initiatives like that one. So it's pretty
    interesting how people can find it. For example, if I want to also contribute to a similar project,
    where would you suggest looking for jobs in this area?
  sec: 781
  time: '13:01'
  who: Alexey
- line: To be fair, what I started doing now is simply to look for organizations that I'm interested in
    and see if they have openings. Because, as you said, it's very rare that you would find these job
    adverts. I remember I follow Our World in Data quite a lot, because they post very interesting reports
    and data visualizations. And at some point I just found a job post that was expiring the same day.
    So I was like, okay, I have to code something now so I can apply.
  sec: 824
  time: '13:44'
  who: Sabina
- line: So yeah, I would suggest to actively look for organizations in the causes that you're interested
    in, be it data transparency, be it accessibility, social impact, whatever, and follow them and look
    for updates, or even message them. Because if they're small organizations, they're more likely to
    answer than if they're bigger. And I diverged a little bit.
  sec: 862
  time: '14:22'
  who: Sabina
- header: How domestic abuse risk assessment works today
- line: So we talked about domestic abuse, and you said that it's very rare that AI is used for risk assessment
    of domestic abuse. I'm wondering how it is done usually. You said it's done on paper, but how exactly?
    What is the process, and what is the risk assessment of? Are they looking at a family and thinking
    how likely it is that in this family there is this problem? I'm trying to figure out, how to put it
    correctly... typically in a usual setting I would say business case, but it sounds very weird to say
    it like that here.
  sec: 886
  time: '14:46'
  who: Alexey
- line: Yeah, a use case maybe.
  sec: 926
  time: '15:26'
  who: Sabina
- line: Use case, yeah. Or maybe a scenario.
  sec: 930
  time: '15:30'
  who: Alexey
- line: Scenario, yeah. I would say what happens at the moment is you have victims interacting with institutions,
    be it police, be it health care practitioners, be it social workers. And the people that they're in
    contact with usually administer a survey which has been studied previously and shows high correlation
    with abuse, usually physical and sexual abuse. That's typically what is being tested. And it's usually
    just about the victim's experience. There have been qualitative studies as well, but it's mostly very
    academic.
  sec: 938
  time: '15:38'
  who: Sabina
- line: And what's currently used by police officers in Germany is a mixture of risk assessment tools
    that were built in North America, for people in that demographic, based on data that they've collected.
    And it's used on the German population. Usually they administer a set of questions, and then based
    on that, whether the person is at high risk or medium risk.
  sec: 988
  time: '16:28'
  who: Sabina
- line: 'But usually there is a victim, right, and somebody is talking to them: police, health care personnel,
    social workers. But if the victim already approached them, they already know that there is a problem.
    Or they approach them with something different?'
  sec: 1028
  time: '17:08'
  who: Alexey
- line: What do you mean by approach them?
  sec: 1050
  time: '17:30'
  who: Sabina
- line: If I already go to the police and say, look, my husband is beating me up, they kind of already
    know that.
  sec: 1050
  time: '17:30'
  who: Alexey
- line: Yeah. So what can happen is that some people, yes, at that point it already is quite a big problem.
    R2 is also meant for cases that are not like that. But in that case, even then, because a victim might
    still be in love with their partner, they might not disclose everything that has happened in the relationship.
    For example, maybe they come because of financial abuse or because of physical abuse, but they haven't
    disclosed that there has been sexual abuse happening as well. And this is what we're trying to predict
    using our tools.
  sec: 1058
  time: '17:38'
  who: Sabina
- line: Because even if they come, maybe they change their minds as well, right? Because it's a very high-pressure
    environment that they're in, being asked questions by the police, very personal questions as well,
    and they might tone down the things that they disclose. So then it's quite important to have these
    risk assessments, not only to see what will happen in the future, but also what is likely happening
    right now that a person might not disclose in that moment.
  sec: 1100
  time: '18:20'
  who: Sabina
- line: Okay, so in this scenario, if I'm a police officer, I would have something like that, and with
    a very serious face ask tough, no, not tough, but these questions, and maybe put some pressure on
    the person. I can imagine a room, maybe without windows, and if you put them in this environment,
    and then somebody with a piece of paper and a serious face is taking notes... So this is how it's
    done right now?
  sec: 1132
  time: '18:52'
  who: Alexey
- line: Yes, very much so.
  sec: 1162
  time: '19:22'
  who: Sabina
- header: 'Lizzy app: taking the risk assessment off paper'
- line: And how are you approaching it?
  sec: 1165
  time: '19:25'
  who: Alexey
- line: Right. So first off, we're taking things off paper. We already have an app built, right now for
    people interacting with victims, to also track cases of domestic abuse, which I think is another plus.
    Because besides having the paper tracking of what happened, you can also look over time at what cases
    occurred, how many are high risk, how many are medium. You can also look at the person's history as
    well.
  sec: 1171
  time: '19:31'
  who: Sabina
- line: I think in terms of interaction with the victim itself, at the moment, given that the survey is
    still administered by a social worker or police officer, there are still trainings that we do with
    the people so that they administer it in the way that it's meant to be. We cannot eliminate that human
    part or make it better, but we can create the interface to help relieve the load of the social workers
    and police officers, who are obviously overworked as well, which might come into play when it comes
    to their interactions with victims. And hopefully in the future we might work on that as well.
  sec: 1211
  time: '20:11'
  who: Sabina
- line: So it would be a police officer sitting with a phone, talking to the victim, and then marking
    answers to the questions?
  sec: 1264
  time: '21:04'
  who: Alexey
- line: Yeah. We have been thinking about maybe an LLM version of that, given LLMs are so popular at the
    moment, where you'd have a chatbot that interacts directly with the victim and directly extracts the
    answers. But that is already a very high involvement and requires much more funding. But we would
    be very keen on doing that, and maybe making it easier for victims to come forward.
  sec: 1276
  time: '21:16'
  who: Sabina
- header: Nationally representative survey and three-month recidivism
- line: And you mentioned that currently what is happening is that there are these paper surveys with
    questions coming from the United States, from Canada, from North America, right? And they are applied
    to Germans. And this is something you also change, right? Do you do something specific to the geography,
    to the country?
  sec: 1306
  time: '21:46'
  who: Alexey
- line: Yes. So we have already done two surveys looking at domestic abuse. The first on a sample of 7,400
    people, which is nationally representative, and we also use weighting in order to ensure that all
    of the demographics are nationally representative as well. And then we did a second survey looking
    only at people who have been victims in the first one, and seeing whether they've re-experienced abuse
    after three months.
  sec: 1328
  time: '22:08'
  who: Sabina
- line: And this again is another innovation that we're doing. Because what happens at the moment is,
    when people are looking at reoccurrence of domestic abuse, they are looking at reoccurrence after
    a year or more. Some tools are after seven years, can you imagine? And looking at three months brings
    it to more immediate attention and makes it better for resource management as well, because you know
    you have to act within three months, not within a year.
  sec: 1368
  time: '22:48'
  who: Sabina
- line: And AI here means that you do some sort of machine learning, or what exactly?
  sec: 1402
  time: '23:22'
  who: Alexey
- line: Exactly, yeah.
  sec: 1407
  time: '23:27'
  who: Sabina
- line: I mean, obviously for a general audience AI already means machine learning, but if you're a data
    audience, you know that AI is an if-else. But now, when I hear AI, to me it's all this LLM stuff,
    right? You can actually feel that this thing is somehow intelligent. When I talk to ChatGPT, it feels
    like I'm talking to a very smart person.
  sec: 1407
  time: '23:27'
  who: Alexey
- line: Right, yes. A very literate person, maybe.
  sec: 1440
  time: '24:00'
  who: Sabina
- line: Yes, literate. Because the expressions it uses are much better than the ones I use, honestly.
    Well, I don't know if it's better, but it's different. I don't know if people speak like that, but
    yeah, it's different.
  sec: 1445
  time: '24:05'
  who: Alexey
- line: I think it's fantastic for writing text. I find it so useful for writing text.
  sec: 1461
  time: '24:21'
  who: Sabina
- header: 'Features and targets: five types of abuse, ten targets'
- line: So you use machine learning, and then you said you had the survey with 740 people that you interviewed.
  sec: 1467
  time: '24:27'
  who: Alexey
- line: 7,400, yes. Very important.
  sec: 1478
  time: '24:38'
  who: Sabina
- line: More, yeah. Okay, this is serious. And this is what you use as your training data, right?
  sec: 1482
  time: '24:42'
  who: Alexey
- line: Yes.
  sec: 1487
  time: '24:47'
  who: Sabina
- line: So the target variable here was whether the abuse happened again in three months, right?
  sec: 1491
  time: '24:51'
  who: Alexey
- line: That's one of them, yes. They have multiple.
  sec: 1503
  time: '25:03'
  who: Sabina
- line: And I guess the features are the answers to questions.
  sec: 1508
  time: '25:08'
  who: Alexey
- line: 'Exactly, yes. I mean, the features and the targets are answers to questions. So we''re looking
    at five different types of abuse: digital, emotional, financial, physical and sexual. And this again
    is another plus that we have compared to what''s happening at the moment, because perhaps some intervention
    tactics might need you to look at the different types of abuse. One example of that would be: a person
    experiences intense physical abuse, and then the immediate course of action would be, leave your partner.
    However, if you''re financially dependent on that partner, then that is very tricky to do. Which is
    why it''s important to be able to distinguish between these categories.'
  sec: 1512
  time: '25:12'
  who: Sabina
- line: Sorry, I'm trying to remember where we were. Oh, the targets, yes. So we have the targets from
    digital to sexual abuse, and we're using questions that do not point directly to that type of abuse,
    what we call proxy questions, in order to figure out whether that abuse is happening at the current
    moment or whether it will happen in three months.
  sec: 1564
  time: '26:04'
  who: Sabina
- line: So you have basically 10 targets?
  sec: 1592
  time: '26:32'
  who: Alexey
- line: Yes, 10 targets. So five types of abuse, and identification and recidivism, as we call it internally.
  sec: 1597
  time: '26:37'
  who: Sabina
- header: Survey design, domain experts and the founding team
- line: And I imagine coming up with this survey was the most difficult part, right? And then interviewing
    people. Because I imagine if I as a data scientist try to come up with this survey, it will probably
    not be a very good survey. You have to have proper social scientists, right, who know how to ask questions.
  sec: 1610
  time: '26:50'
  who: Alexey
- line: Yeah. So for this, I wasn't part of the data collection, because that happened before I joined
    the company. But basically we took the literature for this, because there's already a huge body of
    literature looking at surveys and creating these risk assessments. And we tried to use the questions
    that were most relevant in those risk assessments, and in addition some questions that we wanted to
    test out, to see whether they have any correlation with abuse.
  sec: 1631
  time: '27:11'
  who: Sabina
- line: And I imagine you also need to work closely with police and social workers, right?
  sec: 1670
  time: '27:50'
  who: Alexey
- line: So at the moment we're piloting, and we're working closely with police and social workers. And
    we also have a lot of advisers on our team who work in criminal law and domestic abuse, and also econometrics,
    you name it. If you look at our website, I think we have around 12 people that have advised us along
    the way. Because our CEO is the main domain expert, and Balin is also a domain expert as well, a social
    scientist. So she's been my first point of contact when it came to technical and social science questions.
  sec: 1677
  time: '27:57'
  who: Sabina
- line: But obviously the CEO has been working in the field for 15 years and knows a lot of the nitty-gritty
    that we should take into account when we create these tools, because it can get very theoretical at
    times. And I think as a data scientist you can get very technical and very into your world of developing
    a lot of models and looking at all of these features, but then in reality you don't need as much technicality.
  sec: 1723
  time: '28:43'
  who: Sabina
- line: So the founders, it was CTO, CEO, right?
  sec: 1757
  time: '29:17'
  who: Alexey
- line: Well, so we have, and co...
  sec: 1764
  time: '29:24'
  who: Sabina
- line: So there were three co-founders, right? Do they all come from this, how to say, business domain?
    That doesn't sound very good. But do they all come from this domain?
  sec: 1768
  time: '29:28'
  who: Alexey
