podcast: ai-for-ecology-biodiversity-and-conservation
segments:
- header: Episode Introduction
- line: Hi everyone, welcome to our event. This event is brought to you by DataTalks.Club, which is a
    community of people who love data. We have weekly events and today is one of such events. If you want
    to find out more about the events we have, there is a link in the description. Go there, check it
    out, you'll see all the events we have in our pipeline.
  sec: 0
  time: 0:00
  who: Alexey
- line: If you have not subscribed yet to our YouTube channel, now it's the best time to do that. If you
    subscribe, you will get notified about all future streams like the one we have today. And we have
    an amazing Slack community where we can hang out with other data enthusiasts. During today's interview,
    you can ask any question you want. There is a pinned link in the live chat, so click on that, ask
    your question, and we will be covering these questions during the interview. I'll stop sharing right
    now.
  sec: 0
  time: 0:00
  who: Alexey
- line: And I don't know where my mobile is. Usually I also open the stream on my mobile phone to track
    questions there, but it's gone, so I'll try to make do without it. Okay, so now I'm opening the questions
    we prepared for you. And if you're ready, we can start.
  sec: 49
  time: 0:49
  who: Alexey
- header: 'Guest Introduction: Tanya Berger-Wolf'
- line: Let's start. This week we'll talk about AI for ecology, biodiversity and conservation. And we
    have a special guest today, Tanya. Tanya is a computational ecologist with research at the unique
    intersection of computer science, life biology, and social sciences. And this is what we will be talking
    about today. So welcome to our interview.
  sec: 61
  time: '1:01'
  who: Alexey
- line: Thank you, thank you for having me.
  sec: 101
  time: '1:41'
  who: Tanya
- line: Yeah. And as usual, the questions for today's interview are prepared by Johanna Bayer. Thanks,
    Johanna, for your help. And let's start.
  sec: 104
  time: '1:44'
  who: Alexey
- header: 'Career Journey: From Theoretical Computer Science to Computational Ecology'
- line: So before we go into our main topic of AI for ecology, biodiversity and conservation, let's start
    with your background. Can you tell us about your career journey so far?
  sec: 111
  time: '1:51'
  who: Alexey
- line: Yes. So currently I am professor of computer science and engineering, electrical and computer
    engineering, and evolution, ecology and organismal biology at the Ohio State University, in the state
    of Ohio in the United States. I'm also director of the Translational Data Analytics Institute there.
    That's the largest interdisciplinary research institute at OSU, and OSU is a very large university.
    And that is a research community within the university that unites anybody who in some way generates,
    uses, analyzes, represents, is curious about, is enabled by, or adjacent to data in their research,
    scholarship and creative expressions. And these days that's pretty much everybody. So we have people
    from arts and humanities to statistics and computer science.
  sec: 123
  time: '2:03'
  who: Tanya
- line: My own research and my own focus is on AI for ecology, environment, biodiversity and conservation.
    And that journey in research started with my PhD at the University of Illinois at Urbana-Champaign,
    which I got in 2002, a while ago. And after postdoctoral training at the University of New Mexico
    in computational phylogeny, that's evolutionary biology, and then in computational ecology at Princeton,
    I started as a faculty at the University of Illinois at Chicago in 2005 and came to the Ohio State
    University in 2020, right before the pandemic. January 2020 was great timing. So I've been here ever
    since.
  sec: 172
  time: '2:52'
  who: Tanya
- line: And along the way in my journey, I did my PhD in very theoretical computer science, so that had
    nothing to do with ecology. But I did have jobs in ecology departments and worked with ecologists
    and am married to one. So I've walked away from many conversations with ecologists thinking that there
    are better ways. There's got to be better ways of answering questions that they were asking, other
    than what was typical at the time, which is creating systems of partial differential equations describing
    different aspects of the system, with more parameters than birds or animals in the population that
    we wanted to characterize.
  sec: 231
  time: '3:51'
  who: Tanya
- line: And so I also studied, it's called computational ecology or biology, where you model population
    of fish, or there's also these models like predator-prey, right?
  sec: 279
  time: '4:39'
  who: Alexey
- line: Yeah, a ton of differential equations.
  sec: 292
  time: '4:52'
  who: Tanya
- line: And actually when I was studying, I was studying computer science and I was thinking, why do I
    need all that?
  sec: 295
  time: '4:55'
  who: Alexey
- line: Yeah, so I was thinking the same thing, especially when working on data sets. I remember one was
    working for the Army Corps of Engineers. Because the thing is, in the US, the army bases are often
    the last big untouched habitats, actually habitats of many rare and endangered species. And so they're
    required by law to do impact assessment of their activities on these endangered species. This is the
    Endangered Species Act that just celebrated its 50th anniversary in the United States in December.
    So if they want to do a military exercise or put a road through the military base, they need to figure
    out what's the impact going to be on the endangered species.
  sec: 305
  time: '5:05'
  who: Tanya
- line: 'And so I spent a lot of time modeling the impact on like 30 birds population with like 100-parameter
    systems. And I was like, no, there''s got to be a better way. So after my PhD, I did start developing
    the whole area: what would it look like, what are the algorithmic approaches that are not necessarily
    the dynamic systems. And in the process realized that we need methods like machine learning, computer
    vision methods, for even basic analysis of data, because images are by far the largest and most abundant
    source of information about anything in the world, including wildlife.'
  sec: 358
  time: '5:58'
  who: Tanya
- header: 'Zebra Identification: The Two-Click Bet'
- line: And so that's where in 2011 we got, almost by accident, the first program for identifying individual
    zebras from photographs with just two clicks. And that was part of my collaboration with behavioral
    ecologists. So I started out working with ecologists who study behavior of animals, particularly social
    behavior, and more specifically zebras, which is why there's a zebra in my background here. So Dan
    Rubenstein, a professor at Princeton University in the US, in New Jersey, is the premier researcher
    who studies equids, so zebras, horses, donkeys.
  sec: 405
  time: '6:45'
  who: Tanya
- line: And they were studying social behavior, and I was like, wait, how do you know who is whose zebra
    friend? Like, well, we have a field assistant who goes out in the field, drives on a closed loop in
    this nature preserve in Kenya. Every time she sees zebras, she stops, she takes GPS, tries to make
    very, very careful pictures of every zebra that she sees, making sure they're facing right, with the
    whole side visible. And she keeps the best picture, and then she brings them back to the lab and then
    starts clicking on the outline of the zebra.
  sec: 459
  time: '7:39'
  who: Tanya
- line: And I was watching her do that, and I'm an impatient engineer, right? So two minutes into it,
    I'm like, how long is it going to take? They're like, wait. Five minutes later, I'm like, this is
    taking forever, how long is it going to take? Like, wait. 20 minutes later, after clicking on the
    outline. Because what happened is that they would click very, very carefully on the outline, and there
    was a program that would fit a 3D model and then match pixel for pixel the lines of the zebras, which
    is also very inaccurate. I'm like, oh my God, this is insane, this is taking forever.
  sec: 497
  time: '8:17'
  who: Tanya
- line: And they're like, oh, if you're so impatient, do you think you can do better? I'm like, you want
    a bet? It should take two clicks. So after that, of course, I go to my then PhD student, and
    I just bet my reputation that we can identify individual zebras from photographs in two clicks. But
    I also had an idea how to do it. So we did, and it was okay. But it got a lot of publicity because
    of the walking barcodes kind of analogy, even though it's not accurate. But that's really identifying
    individual zebras from photographs.
  sec: 535
  time: '8:55'
  who: Tanya
- header: From Research Paper to Wild Me and Wildbook
- line: Great. So a proper computer vision researcher, Chuck Stewart at Rensselaer Polytechnic Institute,
    heard about it and approached me at a conference, saying, great, you can identify individual zebras
    from photographs, but we can do better. I'm like, fantastic, let's do it. And so we did. And that's
    when in 2013 we published this paper on properly identifying individual animals from photographs,
    anything striped, spotted, wrinkled, notched. So that expanded the number of species, a proper computer
    vision approach. We published it in some obscure computer vision conference.
  sec: 575
  time: '9:35'
  who: Tanya
- line: And then we thought we were done, because we published, right? This is how research works. But
    two months later, we had requests from about 70 researchers all over the world asking, can you do
    my species, can you do my species? Everything from tiny Hawaiian snails, beautiful ones, look them
    up, to whale sharks and tigers, everything. I'm like, oh my God, this is actually useful for conservation.
    So we started a nonprofit, Wild Me, that creates AI solutions for conservation and is home of the
    platform Wildbook, which is using this individual ID to really organize observations about animals.
  sec: 617
  time: '10:17'
  who: Tanya
- header: Imageomics and the AI and Biodiversity Change Center
- line: And then to continue research in this, recently funded by the US National Science Foundation,
    we founded a whole new field of science called imageomics, the omics of images. And we'll practice
    pronouncing that.
  sec: 662
  time: '11:02'
  who: Tanya
- line: Imageomics, the omics of images. So it's imageomics, right? Like economics?
  sec: 682
  time: '11:22'
  who: Alexey
- line: No, like genomics, like proteomics, metabolomics.
  sec: 688
  time: '11:28'
  who: Tanya
- line: So proteins, right? So proteomics, genomics. There are so many more omics than I could ever imagine.
  sec: 691
  time: '11:31'
  who: Alexey
- line: Yeah. Yes, so we'll talk a little bit about that. And then the AI and Biodiversity Change Global
    Climate Center, also recently funded by the US National Science Foundation and Canada's Natural Sciences
    and Engineering Research Council, is a new center to understand the impact of climate change on biodiversity
    using AI. So with that, this is kind of most of the icons that are in my background, and a very brief
    summary of my journey.
  sec: 704
  time: '11:44'
  who: Tanya
- header: Why Ecology Lags Behind Industry in Data Methods
- line: Funny that you mentioned that, like you said, you are married to, if I remember correctly...
  sec: 734
  time: '12:14'
  who: Alexey
- line: I'm married to an ecologist.
  sec: 740
  time: '12:20'
  who: Tanya
- line: An ecologist, yeah. And then you also observed how people do this in this field, and for you,
    a computer scientist, that was like, seriously, that takes so much time? And this is also... my mother
    is also an ecologist. And I noticed, I think it was 10 years ago, when I was helping her with some
    calculations, that the methods that are super commonplace in data science in industry are only getting
    attention in ecology, right? Things like, I don't know, time series analysis, all this machine learning,
    classification, regression. They're not really that widespread.
  sec: 742
  time: '12:22'
  who: Alexey
- line: And you could publish a paper by just taking a data set with some climate data and then an off-the-shelf
    model from scikit-learn, fitting it, and then publishing the paper. And to me it was a very interesting
    observation, because I had no idea. I thought it's normal, because I'm a data scientist, I see this
    happening every day at work, right? And I guess this was also kind of your experience, right? That
    you saw that there's so much to be automated in this area.
  sec: 778
  time: '12:58'
  who: Alexey
- line: So it's more than automated. I would separate a little bit the climate science and environmental
    science, and biodiversity and conservation. Climate science, I think, gets a lot of attention and
    a reasonable amount of resources recently. So there are amazing climate models and they're constantly
    improving, and there's an insane amount of data that's there, particularly through remote sensing.
    So agencies like all the space agencies that observe, led by NASA, the US space agency, and well,
    National Atmospheric... No, not atmospheric, I combine the two agencies together, apologies to NASA.
    Because NOAA and NASA, sorry, are the two agencies that collect remote sensing data in the US.
  sec: 825
  time: '13:45'
  who: Tanya
- line: But then also space agencies and equivalent agencies throughout the world. So there's a lot of
    data about climate and climate change, and also environmental data. But for biodiversity and conservation,
    the data situation is very, very different. In fact, we actually do not have good data in this area.
  sec: 896
  time: '14:56'
  who: Tanya
- header: The Biodiversity Data Gap
- line: You gave an example, like there was only 30 birds of a certain species, right? And how could you
    do this with a standard model for population? But the biodiversity, that's related, right? Because
    I'm not really knowledgeable in all these areas.
  sec: 920
  time: '15:20'
  who: Alexey
- line: 'Yeah, yeah, absolutely. So not only are populations not observed often enough... So the whole
    journey there started with: we have 30 birds in a particular area, that''s the population of these
    birds, there are other populations. And so when they try to model these population dynamics, where
    you need birth rate, death rate, dispersal rate, mating rates, all of these kinds of things, successful
    mating, the parameters that they would take are: okay, so this is the population in Florida, but we
    have this birth rate from similar species in Texas, great, we''ll use that. We have a death rate from
    this species, but from 50 years ago. So it''s all over the place.'
  sec: 939
  time: '15:39'
  who: Tanya
- line: 'And this is just the tip of the iceberg. We don''t even have the basic data. Right now the recent
    reports are saying that a million species are threatened with extinction. And by the way, a million,
    to put this in context: there is total estimated only about 10 million species of plants, fungi and
    animals out there. That includes all bugs, all the beetles, insects, everything. That''s a shockingly
    low number, right? So only 10 million species. People think they''re billions.'
  sec: 996
  time: '16:36'
  who: Tanya
- line: Mm-hmm. That's what I thought too. I thought billions.
  sec: 1034
  time: '17:14'
  who: Alexey
- line: Yeah.
  sec: 1039
  time: '17:19'
  who: Tanya
- line: I thought... No, only 10 million. Which means that a million is like 10% threatened with extinction.
  sec: 1041
  time: '17:21'
  who: Alexey
- line: Yeah, so that's the shocking number, right? But the thing is, these are estimates. People have
    done now four different ways of estimating the number of species, and they still come to the same
    number roughly. And the one million threatened with extinction is probably an underestimate. There's
    probably even more, but we really don't have good numbers to give more accurate estimates. Even though
    we know that the situation is dire.
  sec: 1051
  time: '17:31'
  who: Tanya
- line: 'Because the International Union for Conservation of Nature Red List is the official organization
    that tracks the biodiversity of the world. It''s called the biodiversity monitor of the planet. Biodiversity
    in general is the who, where, when: what are the species, where they are, and what are the population
    trends of the species. And this is the organization that, when we say the species are endangered,
    it''s because the species commission for IUCN Red List for that species, using some metrics, determined
    that that''s the status of the species. So they need data to do this.'
  sec: 1081
  time: '18:01'
  who: Tanya
- line: So of the species that they track currently, and that's about 160,000, also not a big number,
    more than half are either data deficient, so they don't have enough metrics to determine anything,
    or the population trend isn't known. These are not obscure species. So killer whales, orcas, the largest
    dolphin in the ocean, the largest dolphin in the world, killer whales, they're data deficient. I mean,
    you cannot tell me anything about killer whales? I mean, they're hard to miss when they're in the
    ocean, right?
  sec: 1129
  time: '18:49'
  who: Tanya
- line: Especially when they attack boats now in Spain. How can we actually use technology to...
  sec: 1172
  time: '19:32'
  who: Alexey
- line: Exactly.
  sec: 1179
  time: '19:39'
  who: Tanya
- line: There are whales, yes, and we cannot miss them when we are on a ship. But still, how can we...
    There's data deficiency and the population is not known, so how can we use technology to actually
    measure that?
  sec: 1180
  time: '19:40'
  who: Alexey
- header: 'Technology for Monitoring: Sensors, Images and Bias'
- line: That's exactly where we decided, okay, we're going to do something about it. Because, you know,
    polar bears' population trend is unknown. I'm like, are you kidding me? This is the conservation icon
    of the world, polar bears. So if we don't know anything about species like orcas and polar bears,
    we really are in a bad situation. So over the last 20 years, clearly technology has exploded. We have
    remote sensing, we have autonomous drones, right? Autonomous vehicles underwater, on the ground and
    in the air. We have sensors that we can put on animals themselves, everything from radio collars to
    Bluetooth, GPS, accelerometers, everything. We have in situ sensors such as camera traps, that are
    motion-activated cameras. We have acoustic sensors.
  sec: 1202
  time: '20:02'
  who: Tanya
- line: And we have these guys, devices that everybody uses to take pictures. But even with all of that...
    So one, by far images are the most abundant source from all of this. But two, if we look at the data
    and how it's distributed, it's very biased towards North America and Europe. That's not where the
    highest biodiversity is. The highest biodiversity is in the tropics, and it's South America and Africa
    by a large margin, and we have very little data from there.
  sec: 1251
  time: '20:51'
  who: Tanya
- line: Also, all the methods for analyzing images, right? All the AI and computer vision that's being
    developed for image analysis, if this is what we're using as our primary source, again, the vast production
    of these methods is in North America, Europe and China right now. That's not where the biodiversity
    is. So that's developed in absence of the context of what's needed for these kinds of questions. And
    you cannot actually just take off-the-shelf methods that are out there for images and apply them directly
    to questions in biodiversity monitoring, for many, many different reasons that I'm happy to get into
    in more detail.
  sec: 1283
  time: '21:23'
  who: Tanya
- line: So we need to really develop methods that are appropriate for, let's say, image analysis for biodiversity
    monitoring. And there is a community, not a huge community, still well under 100 if I'm being super
    generous, that is working on developing these methods. And so methods like I mentioned, identifying
    individuals, that allows us to do population counts. So Wildbook now has been used for updating whale
    shark, Grévy's zebras, Saimaa ringed seals and Iberian lynx population monitoring, directly from the
    data in Wildbook to the IUCN Red List status.
  sec: 1332
  time: '22:12'
  who: Tanya
- line: Also, we have now Wildbook for whales and dolphins, so humpbacks and orcas, killer whales, are
    now part of that. So hopefully there will be soon enough data to reassess the species status, and
    killer whales won't be data deficient.
  sec: 1378
  time: '22:58'
  who: Tanya
- header: Using Photos from People and Social Media
- line: How does it actually work? Do you use satellite data, or do you use some sort of radio signals?
  sec: 1397
  time: '23:17'
  who: Alexey
- line: Pictures. Pictures, any kind of pictures. Cameras, aerial photographs, people taking pictures
    when they're on whale watching or fishing boats.
  sec: 1404
  time: '23:24'
  who: Tanya
- line: But you cannot take pictures...
  sec: 1418
  time: '23:38'
  who: Alexey
- line: Not in the entire ocean. It's still biased towards where the boats are, where the people are,
    right?
  sec: 1423
  time: '23:43'
  who: Tanya
- line: So it's where the boats are, or shores, where whales try to stay away from, like...
  sec: 1428
  time: '23:48'
  who: Alexey
- line: 'Or maybe to some extent, yes. But we''ve shown, for example, with whale sharks, which is the
    largest fish in the ocean, the data collected by people, even though it is biased towards shores by
    quite a bit, data collected by people, including data from social media, people posting on YouTube
    and other social media platforms: hey, we went on this whale watching tour, swimming with whale sharks,
    here''s my pictures, here''s my videos. All of these data together improved the population size estimate,
    and was used in fact to have the most comprehensive study on the biology of whale sharks.'
  sec: 1440
  time: '24:00'
  who: Tanya
- line: It for the first time revealed migration patterns, seasonality of migration patterns of the species.
    People knew, but we never had enough data to show that they travel 5,000 miles. These are global species.
    You can identify the same whale shark in Cancun and then in the Philippines, because we can identify,
    yes, it's the same animal, from the spot pattern of the sharks. We can now know how far they travel,
    what's the pattern of that travel. As a global species, there is not one project, not one organization
    that has data on even one individual. So you have to put together the data from the entire globe to
    really create the picture of a global species. And that's what platforms, that's what technology like
    this allows. We really can take all available data from the entire world.
  sec: 1493
  time: '24:53'
  who: Tanya
- line: Okay, so if I understood correctly, let's say there are these whales. There's already some estimate...
    I think for whales you said it's unknown, but for certain sharks there's already some estimate, right?
    And then what you can do, you can tap into social media pictures or streams from these boats, all
    the signals, and you can use that. And also knowing the patterns of how these animals travel, how
    they migrate, you can correct it or make a more accurate estimate, right?
  sec: 1553
  time: '25:53'
  who: Alexey
- header: Mark-Recapture and the Great Grévy's Rally
- line: Yeah, so the underlying... particularly when you can identify individuals, there is a particular
    statistical method that's used for population size estimates. It's capture-mark-recapture. To explain
    a very, very simple situation... And by the way, the same technology was used for the first ever full
    census of an entire species, the endangered Grévy's zebra in Kenya. So those are not the endangered
    ones, the ones behind me are the common zebras. Those are the ones in the Serengeti, thousands, migrations
    with wildebeest, and what most people think of when they think zebra.
  sec: 1590
  time: '26:30'
  who: Tanya
- line: 'The common ones are not endangered, and they are found throughout the entire continent of Africa.
    There are two other species of zebras left that are both endangered, and one of them is the Grévy''s
    zebra, mostly found, outside of zoos, in Kenya and a little bit in Ethiopia. And these are beautiful
    species. They look very different: smaller stripes, thinner stripes, they''re bigger, also white belly
    and Mickey Mouse ears. And it was estimated that there''s about 3,000 of them left in the world, 95%
    in Kenya.'
  sec: 1640
  time: '27:20'
  who: Tanya
- line: 'And because we can identify individual animals from photographs, the same technology enabled
    for the first time in 2016 the Great Grévy''s Rally. That was an event organized by the Grévy''s Zebra
    Trust in Kenya, co-organized later with Kenya Wildlife Service, which is a government organization,
    and WildlifeDirect, a conservation nonprofit, to bring everybody together. Anybody: tourists coming
    into the country on the safaris, but also Kenyans, school kids, the park rangers, volunteers, and
    even the US ambassador to Kenya at the time participated. So we had hundreds of people driving around
    the country for two days, taking pictures of every Grévy''s zebra they saw and anything else they
    wanted. And in two days that resulted in 40,000 images of zebras.'
  sec: 1679
  time: '27:59'
  who: Tanya
- line: 'So what you can do then: you can make a simple assumption that in two days there are very few
    to no deaths, births, immigration, emigration. So it''s a closed population. And let''s say on the
    first day you saw a thousand zebras, and so you essentially, let''s say, spray paint them with pink
    color. You shouldn''t, but let''s say you spray paint them. On the second day you go out and you do
    the same thing. You try to photograph every zebra, and you end up with another maybe 500. But of those
    500, 50 are spray painted pink.'
  sec: 1755
  time: '29:15'
  who: Tanya
- line: So what that tells you is that on any day, if you go out to see zebras, assuming that it's a closed
    population, you see about 10% of the population at random. Because on the second day you saw 50 of
    the 500 were marked. So that means that you randomly see about 10% of the population. So this 500
    represents about 10% of the total, so your estimate should be about 5,000.
  sec: 1807
  time: '30:07'
  who: Tanya
- line: Okay. Works for most animals, I guess? For most species, right?
  sec: 1842
  time: '30:42'
  who: Alexey
- line: This works if you can mark them when you capture them, right? And what used to be done, literally
    people would capture animals to tag them somehow. It's often done with mice, it's often done with
    small animals, and birds, they put tags, rings on birds, so that you can do the estimate. But then
    it also works if you have a closed population. But there are versions of this model that work for
    open populations, when you can take into account birth, death, immigration, emigration over a long
    period of time.
  sec: 1846
  time: '30:46'
  who: Tanya
- line: The nice part about being able to recognize individual animals from photographs is that you don't
    have to capture them anymore. It's not invasive. You take a picture, that's your capture. You mark
    them by identifying who that individual is. Not just a zebra, but that's Zoe the zebra, that's Zach
    the zebra, right? And so then when you take a picture again...
  sec: 1885
  time: '31:25'
  who: Tanya
- line: Patterns, or what?
  sec: 1908
  time: '31:48'
  who: Alexey
- line: Yes, they have unique patterns, like your fingerprint.
  sec: 1910
  time: '31:50'
  who: Tanya
- line: Okay.
  sec: 1913
  time: '31:53'
  who: Alexey
- line: And so on the second day, if somebody else takes a picture of the same zebra, we know it's the
    same zebra. So that's the recapture. And we knew that by mid-morning of the second day, there were
    essentially no photographs of any new animals. Every zebra that was photographable, that anybody saw,
    was already photographed. So that gives you amazing confidence bounds for population size estimates,
    because you know essentially that you have a photograph of every zebra that's out there that wasn't
    too shy to be photographed.
  sec: 1914
  time: '31:54'
  who: Tanya
- line: So then the question is how many were not seen at all. And that's where you can compare 2016 to
    2018, which was the same kind of event, and 2020, and now 2024. And so we know that in the intervening
    years there were no zebras that suddenly came out of the bush, like, well, you know what, I did not
    want to be photographed when there were too many people around, but now please do take my picture.
    So no, there were none of those.
  sec: 1949
  time: '32:29'
  who: Tanya
- header: 'Telling Individuals Apart: Whales, Bears, Turtles and More'
- line: Which answers my earlier question about whales trying to stay away from people, right? Because
    the majority may stay away from people, but some of them do not, because they're looking for food
    or whatever. And then if you measure multiple times, you can see. And you find a way to distinguish
    one animal from another of the same species. I guess whales also have a way to tell that these two
    animals are different, right?
  sec: 1980
  time: '33:00'
  who: Alexey
- line: Yeah, so we're not asking animals. We need to do it from photographs, so we need observable features.
    And for whales we have several ways. One, some whale species like orcas or humpback whales have distinct
    markings, right? So when you have a picture of the tail of an animal, for humpback whales, they have
    black and white kind of patterns. Those are unique to every individual, so you can use them like a
    fingerprint, the same way we do zebras. For orcas, killer whales, they have the black and white spots
    on them. Again, those uniquely identify every individual in a pretty straightforward way. And many,
    many species have that.
  sec: 2014
  time: '33:34'
  who: Tanya
- line: For sperm whales, they don't actually have unique markings, so we use the shape of a whale's fluke,
    the whale's tail. That edge of the tail is a unique marking, just like your ear. By the way, the shape
    of your ear, that outline, is unique. And so is the elephant's ear. You can use that outline when
    it opens.
  sec: 2067
  time: '34:27'
  who: Tanya
- line: I was going to ask you about polar bears, like there are no patterns. But I think you already
    answered that, because maybe there are no patterns, but there are other features that we can look
    at.
  sec: 2087
  time: '34:47'
  who: Alexey
- line: 'So for bears actually, and many other forward-looking animals, all the bear species, there''s
    BearID, which a Canadian couple started as a project, which we''re starting to incorporate into Wildbook
    platforms. So bears, and cats, dogs too, all the cats, all the forward-looking animals, and seals.
    And all the primates: we''re actually working now with a group that does primate facial identification,
    so we can start incorporating that.'
  sec: 2101
  time: '35:01'
  who: Tanya
- line: And then also, for many other species... So we have species on the platform like weedy and leafy
    sea dragons. These are seahorse relatives. These guys look like aliens, and yet every single one is
    individually identifiable. All turtles, all eight species of sea turtles, we have a Wildbook that
    has turtles. The scale patterns on the head and on their appendages are unique after about three months
    of age. So there are many, many species that are uniquely identifiable. In fact, it turns out most
    of us are special. Every animal is unique, even if we humans cannot discern the...
  sec: 2142
  time: '35:42'
  who: Tanya
- header: Human Visual Bias and Seeing Like Other Species
- line: I think for me all chihuahuas look the same, right? But they are probably not. It's just me, like
    I never had a dog, right? For me, okay, I can tell a pug from a chihuahua, right? But when it comes
    to a specific breed, then all of them look the same to me, right? But it's because of me, right? Not
    because they are.
  sec: 2200
  time: '36:40'
  who: Alexey
- line: Yeah, so humans are actually biased. Humans are very biased with our visual system. There was
    a paper about a year and a half ago showing that part of it is hardware limitations in our visual
    system. So we do not have, for example, enough of the red-orange acuity to distinguish different phenotypes
    of moths, like different types of moths within one species, or butterflies. Because these differences
    did not actually evolve for our benefit. They're for birds, right? Moths and butterflies are signaling
    to birds. So when you translate the images into a bird acuity model, machine learning has no problem
    telling the differences. Humans cannot.
  sec: 2231
  time: '37:11'
  who: Tanya
- line: So that's the advantage of using AI. Another advantage of using computational approaches is that
    computers can look at the world from the perspective of other species, not limited by our hardware,
    or software for that matter. So even though we see the differences between the zebra patterns, and
    you can certainly, if you look long enough... If I show you two pictures of zebras, you can tell,
    oh yeah, these are the same, these are not the same, after about five minutes of looking at zebras.
    But if I ask you, are these two more similar to each other than these two, we have no way of quantifying.
    Even though we can see that they're different, we can't tell how different.
  sec: 2285
  time: '38:05'
  who: Tanya
- line: So that part, no amount of...
  sec: 2334
  time: '38:54'
  who: Alexey
- line: Right, yeah. So no amount of training will let us do this, because we evolved as a species to
    be able to recognize faces. So we can say, oh yeah, the baby looks like mom, the baby looks like dad,
    or this person looks like that celebrity. We're great at that. But if I ask you, who is this baby
    zebra's mom and dad, just by the stripe pattern? I don't know. But computers, again, can quantify
    the similarity of the stripe pattern, right? We have computational approaches for this, and that's
    the advantage.
  sec: 2339
  time: '38:59'
  who: Tanya
- line: 'And so that is also the premise of the Imageomics Institute and the field of science of imageomics:
    that we can extract biological information, such as traits and phenotype, the overall collection of
    traits that are the product of genes and the environment and the interaction of those, directly observable
    ones, directly from images, and connect that to biological function. Because we can use computational
    approaches, right? We can use computers to complement what we''re seeing, and extend our ability to
    see and to quantify what we''re seeing from images, and to see in other spectra, to see in other models,
    to see the world from a perspective which is nonhuman.'
  sec: 2371
  time: '39:31'
  who: Tanya
- line: To me, these are two messages. One is that we can use AI, we can use computational approaches,
    as a partner. AI truly is a partner to humans, to complement, not to take over, but to complement
    our abilities to make connections among data points, among humans, among different parts of the world,
    between a person and nature. As well as to give us the ability to see what we cannot see, to see what
    we're missing. That to me is the very hopeful and exciting aspect of the partnership between AI and
    humans.
  sec: 2422
  time: '40:22'
  who: Tanya
- header: Do Stripe Patterns Reveal Relatedness? SIFT Features and Kinship
- line: 'Coming back to the zebras, I''m really curious how it works. Let''s say we have this task: we
    have a zebra and we need to find the mama and the papa of the zebra based on the stripe patterns.
    Can computers already do that?'
  sec: 2472
  time: '41:12'
  who: Alexey
- line: Yeah, so we're starting to. We had a very small preliminary study specifically for zebras, because
    the approach that we're using for zebra identification is actually a computer vision, non-ML approach
    at the moment. We're expanding it now to include machine learning, specifically for zebras. For other
    species we do use machine learning quite a bit. But here we use an approach known as scale-invariant
    feature transform, SIFT features, which are based on the gradient of the pixel value difference on
    a sliding matrix across the body of the zebras.
  sec: 2494
  time: '41:34'
  who: Tanya
- line: And because they have black and white patterns, the gradient is super high where the changes are,
    and you can kind of create a histogram of these changes that kind of creates a signature for each
    zebra, right?
  sec: 2540
  time: '42:20'
  who: Alexey
- line: Yes, it creates a signature for each zebra, for each image, and you can match the signatures between...
  sec: 2555
  time: '42:35'
  who: Tanya
- line: Then you have one vector, another vector, and you can say how close these vectors are. And then
    this would give us the overall pattern similarity, right away. And if the patterns are similar, they
    are probably relatives.
  sec: 2562
  time: '42:42'
  who: Alexey
- line: 'So we don''t know. Nobody knew whether the stripe pattern has any kind of genetic component to
    it, whether it''s heritable in any way, whether it''s inherited from parents to baby. But we had a
    small data set of pictures of moms and babies together. And the way we could ask is: here''s a picture
    of a baby, who is the closest, most similar adult in our data set to this picture of a baby? And it''s
    a large population of about 3,000, and the mom was consistently in the top 10, and quite often, the
    majority, in the top three. So that''s a signal that, yeah, there''s something there. So now we''re
    actually collecting genetic data, so we can directly correlate.'
  sec: 2579
  time: '42:59'
  who: Tanya
- line: We've done a similar pilot study on leopards, Indian leopards, and there the facial information
    was the most relevant, so the patterns around the face. And then we also did a similar study on bird
    eggs.
  sec: 2637
  time: '43:57'
  who: Tanya
- header: Bird Eggs, Brood Parasites and Generative AI
- line: 'So why bird eggs? Because birds are a visual species, and they recognize eggs that are theirs
    versus not theirs purely by sight. So researchers have done the studies: is it the shape, is it the
    texture, is it the smell, is it anything else other than sight? And the answer is absolutely not.
    You can put a 3D printed egg with a pattern that is similar to theirs, they will accept it. And with
    a pattern that''s too far from theirs on the egg, they will kick it out of the nest.'
  sec: 2653
  time: '44:13'
  who: Tanya
- line: Interesting. So they're using... Eggs have no patterns?
  sec: 2692
  time: '44:52'
  who: Alexey
- line: They do. Many eggs do have patterns. You're thinking chicken. This is not chicken, this is other
    species. Most eggs actually have spots, like quail eggs, for example.
  sec: 2695
  time: '44:55'
  who: Tanya
- line: No way. If it's...
  sec: 2708
  time: '45:08'
  who: Alexey
- line: They do. But they also have color. Like chickens that are not bred for production, for genetic
    similarity, very quickly start... from brown, blue, greenish.
  sec: 2713
  time: '45:13'
  who: Tanya
- line: Like all the chickens have the specific genome, right? Genes?
  sec: 2734
  time: '45:34'
  who: Alexey
- line: Yeah, so they're bred. The industrial production breeds are very close.
  sec: 2740
  time: '45:40'
  who: Tanya
- line: That's why the eggs are... It's like they're all siblings.
  sec: 2745
  time: '45:45'
  who: Alexey
- line: Not quite, but yeah, close. And so there's not a high diversity there in general. So they're not
    a good model for studying relatedness. And they're also nonparasitic, so they're not species that
    need to recognize their eggs. They're in fact bred to... the eggs are taken away from them generally.
    There are few ones that will bring their chicks to the point where they break out of the egg. But
    with wild species of birds, especially the ones that have, like, cuckoos that parasitize other species,
    so they will lay eggs in other species' nests and trick the host into raising them with their own.
    So birds that have the danger of somebody else laying eggs in their nest, they're like, nope, no,
    no, no. They learn how to differentiate.
  sec: 2750
  time: '45:50'
  who: Tanya
- line: Really?
  sec: 2813
  time: '46:53'
  who: Alexey
- line: And by learn, I mean evolutionarily, over millions of years, they evolved to know how to recognize
    eggs from their nest versus not their nest.
  sec: 2814
  time: '46:54'
  who: Tanya
- line: And so all the birds, apparently...
  sec: 2825
  time: '47:05'
  who: Alexey
- line: Not all, yes. So not all the birds, not all the species. But the question is, for the species
    that do that, how do they do this, right? And if you look at this... So we worked with Mark Hauber,
    who is an ornithologist who specializes in eggs and wrote the book literally called Eggs. It's a thick
    book. So there were pictures of eggs from about 80 nests, and not only could we train a machine learning
    model to differentiate between nests, we could also use generative AI to generate an egg that looks
    like this.
  sec: 2829
  time: '47:09'
  who: Tanya
- line: 'But before I get there, we also showed that it correlates highly with genetic relatedness. So
    the eggs of the same bird, of course, are very close together in similarity. The same bird over years
    are also close. A mom and her daughter are closer than any random bird, and so on. So there is a strong
    genetic signal. And then we could generate an egg that looks like an egg from the nest, 3D print it,
    and ask a bird: would you take it? And so this is the future. We can start generating eggs gradually,
    sort of between one nest and another, and see at what point the bird would start rejecting the egg.
    Literally drawing isolines of sort of kin recognition.'
  sec: 2881
  time: '48:01'
  who: Tanya
- line: This is still work in progress, right? You haven't...
  sec: 2937
  time: '48:57'
  who: Alexey
- line: This is work in progress. We showed that there is genetic relatedness, there's strong correlation
    between the genetic relatedness and the egg similarity, something that humans cannot do without the
    help of a computer, right? But the next step, of asking the bird directly, is the future, is work
    in progress. But that's an example of where we can really use machine learning, AI, and computational
    approaches to do something that humans absolutely cannot do, and understand biology.
  sec: 2942
  time: '49:02'
  who: Tanya
- header: Basic Science vs. Practical Implications
- line: 'I''m just curious why. Okay, this is a very interesting experiment: we generate with AI an egg
    and put it in the nest to see if the bird rejects it or not. This sounds like a lot of fun, but what
    are the practical implications of that experiment? What does it give us, knowing that the bird rejects
    this egg or does not reject this egg?'
  sec: 2989
  time: '49:49'
  who: Alexey
- line: Basic understanding of the world. This is basic science. Understanding how kin selection, how
    kin recognition... how do birds recognize who is theirs, who is not, in a species, which we cannot
    at all replicate, right? We cannot do it by just observation. It also gives us insight in general
    into how kin recognition works in nature. Do different animals use different smells? Why does it matter,
    right? Why do they have that? So this is about fitness. It's about how we ensure that our offspring
    survive better than somebody else's. Why would I invest any effort into raising somebody else's kids
    if I am a bird?
  sec: 3012
  time: '50:12'
  who: Tanya
- line: 'And so this is basic science. To push back a little bit on the idea that everything has to have
    practical implications: because we start out with a curiosity about the world. Basic science is a
    human endeavor of understanding the world that is out there, by humans, for humans. A child asks,
    why is the sky blue? It is a basic curiosity question, without worrying whether it''s a chemistry
    question, a physics question, cognition, vision, psychology, right? It is basic human curiosity that
    drives us to understand the world, and it doesn''t worry whether it has some practical implication.
    It''s the drive to know.'
  sec: 3067
  time: '51:07'
  who: Tanya
- line: Now, having said that, understanding how the world works, particularly how different species perceive
    the world, how species interactions happen, also helps us. This is the practical part. It helps us
    understand what drives the loss of biodiversity, and what will happen if the conditions change. What
    will happen if the habitats are smaller, what will happen if environmental conditions change, right?
    So we can start building models that predict how the species will respond. What will happen if the
    butterflies disappear from this particular region and move a little bit north because it's warmer
    up there, right? What will happen to the birds that are relying on these butterflies for food, and
    so on.
  sec: 3111
  time: '51:51'
  who: Tanya
- header: 'Wildbook in Practice: Conservation Partners and Historic Data'
- line: 'Because, I was also thinking while you were answering, curiosity is a perfect reason to do that,
    because right now I''m super curious what actually will happen when you do that. But also, thinking
    about the previous examples that you gave, about estimating the number of zebras of a specific type,
    or counting polar bears: you want to see population trends, right? Is it decreasing, increasing, staying
    the same? And if it''s decreasing, then it gives us a clear signal: okay, something needs to happen,
    we somehow want to save it, right? If it''s increasing, then okay, that''s good.'
  sec: 3166
  time: '52:46'
  who: Alexey
- line: And I guess this is the main outcome of what we talked about, right? So now we have a better way
    of doing these things than we did before. Do you actually collaborate with... Because, okay, now you
    have this method. How is it being used right now? Are you...
  sec: 3209
  time: '53:29'
  who: Alexey
- line: Extensively. Extensively collaborate. So it's used by hundreds of conservation organizations around
    the world. Wildbook has more than 70 species now, and it's used by government organizations, including
    Kenya Wildlife Service, African Wildlife Foundation. The entirety of the North American catalog is
    on the platform, so that's all of the data from the US Bureau of Ocean Energy Management and the National
    Oceanic and Atmospheric Administration, NOAA. BOEM and NOAA. The Canadian whale data is up there.
    So this is now used as the definitive source of data for many, many species.
  sec: 3241
  time: '54:01'
  who: Tanya
- line: And the moment you have a platform that organizes your data by individual... For example, for
    whales, even though the platform went live in 2014, agencies and projects and organizations have uploaded
    their historic data going back to the mid-90s, right? So now they can see the whole population trend
    and start analyzing how it changes with different conditions in the area, and what are the patterns
    of migration, as I said, and things like that.
  sec: 3290
  time: '54:50'
  who: Tanya
- line: And in combining data from different sources, because it's linked on an individual ID, right?
    So you can see, oh, the same whale in your data set, it's the same one in my data set right here.
    So look how she moved around, and look who she's hanging out with, and look at all her offspring.
    Oh my God, I knew that these are her three calves, but you also recorded these two, they are also
    her children. Great. So we now can start understanding also the genetics a little bit, and which offspring
    survive.
  sec: 3323
  time: '55:23'
  who: Tanya
- line: And there is a story right now with a beluga whale who died while giving birth, and they think
    that the calf is also not going to survive. But these are endangered species. And it's like, now you
    have a more complete picture of a species with these kinds of data. And essentially it's a data story,
    right? It's a story where the data is abundant and it's out there and it wasn't yet leveraged well.
  sec: 3354
  time: '55:54'
  who: Tanya
- header: 'Citizen Science: Anyone Can Contribute'
- line: By providing an ability to extract information from images, not only can we now process a lot
    of data that's already out there, but it's also such a low barrier for entry. A three-year-old can
    take a picture and contribute, right? Everybody can press that button or touch that screen. And so
    that allows contributions from people who weren't even aware they could contribute to science.
  sec: 3389
  time: '56:29'
  who: Tanya
- line: 'The bot that we built for social media, when it finds, for example, videos of whale sharks, automatically
    sort of adds them to the Wildbook for sharks and posts in the comments: hey, at two minutes 46 seconds
    we found this whale shark, here''s everything we know about it, you just contributed to conservation.
    People respond, people get excited, and it''s like, oh my God, this is amazing, I didn''t even know
    I could do this, how can I help? Right? So that immediately brings them into this connection.'
  sec: 3417
  time: '56:57'
  who: Tanya
- header: 'Resources: Books and Reports on AI and Biodiversity'
- line: 'Yeah. I''m looking at the questions that Johanna has prepared, and it''s a pity that our interview
    is over. And maybe we''ll get to ask you some later. Maybe the last one, before you rush into your
    car to watch the eclipse: are there any books that talk about AI and conservation and wildlife?'
  sec: 3455
  time: '57:35'
  who: Alexey
- line: So it's new. As we started at the beginning of the conversation, there's not a lot yet of AI in
    conservation. And so there are very few books or written material in general. But very recently a
    report was just published, led by the Global Partnership on AI. That's an organization that brings
    together experts in different subfields of AI, publishes reports, and engages the global policymaking
    community. So I was part of the report on AI and biodiversity. They have other AI reports. And so
    that's a report that was published in November 2023. It outlines both the challenges and opportunities
    for AI in biodiversity.
  sec: 3488
  time: '58:08'
  who: Tanya
- line: So there will be a link in the description.
  sec: 3565
  time: '59:25'
  who: Alexey
- line: Yes. There is also a review of machine learning methods for conservation. That's also a couple
    of years old. We're about to write a new one. There's not that many people, as I said, doing this
    out there. But certainly the challenges are so urgent and so big that, you know, come on over, everybody.
    There's a lot, a lot to do. And so the report probably outlines quite a bit of the opportunities that
    are in this area.
  sec: 3568
  time: '59:28'
  who: Tanya
- header: Wrap-up
- line: The link is in the description. And yeah, we should wrap up. So thanks a lot, Tanya, for joining
    us today, for sharing all your experience, for telling all the stories. And now I also know that zebras
    are not horses. I had no idea, I thought they're like horses too.
  sec: 3610
  time: '1:00:10'
  who: Alexey
- line: They're two species. So these guys are closer to donkeys, and the endangered ones are closer to
    horses.
  sec: 3628
  time: '1:00:28'
  who: Tanya
- line: Okay. So thanks a lot, and yeah, enjoy the eclipse.
  sec: 3639
  time: '1:00:39'
  who: Alexey
- line: Thank you, and thank you for having me and giving me the opportunity to chat about AI and biodiversity
    and conservation. Thank you.
  sec: 3643
  time: '1:00:43'
  who: Tanya
