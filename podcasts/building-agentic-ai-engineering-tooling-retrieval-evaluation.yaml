intro: 'How do you build reliable, agentic AI systems that balance practical engineering, tooling, retrieval,
  and robust evaluation? In this episode Ranjitha Kulkarni, Staff Machine Learning Engineer at NeuBird.ai
  and former engineer on LLM- and agent-powered product features at Dropbox Dash and Microsoft, explores
  pragmatic approaches to agent design. Drawing on her work in speech recognition, language modeling,
  assistant evaluation, and publications on voice query reformulation and automatic online evaluation,
  Ranjitha discusses key elements of agent engineering: selecting and integrating tools, designing effective
  retrieval pipelines, and establishing meaningful evaluation metrics for intelligent assistants. <br><br>
  Listeners will get a grounded look at the trade-offs of agentic AI in real products, how retrieval strategies
  impact reasoning and performance, and practical evaluation frameworks to measure assistant behavior.
  If you’re building LLM-powered agents, improving tool use, or defining evaluation for agentic systems,
  this episode offers actionable perspectives rooted in production experience and research. Keywords:
  agentic AI, agent engineering, agent tooling, retrieval, agent evaluation, LLM-powered products.'
