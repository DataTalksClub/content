intro: How do you harden generative AI chatbots against prompt injection, data exfiltration, and dangerous
  hallucinations? In this episode Maria Sukhareva — a principal key expert in AI at Siemens with 15+ years
  working at the intersection of linguistics and computational AI — walks through real-world risks, attack
  findings, and practical defenses for chatbot security. <br><br> We trace Maria’s path from linguist
  to industry expert and her role advising on technology and risk, then dive into a large-scale chatbot
  hacking exercise and the common failures that lead to legal exposure and financial incidents. Key topics
  include prompt injection and knowledge-base exfiltration techniques, hallucination causes and their
  impact on trust, and mitigations such as output validation, query analysis, layered defenses, and the
  use of non-LLM classifiers. We also cover human-in-the-loop workflows, AI-as-assistant moderation tools,
  and prompt customization for controlled machine translation. <br><br> If you’re building or deploying
  generative AI systems, this episode offers practical, production-focused guidance on chatbot security,
  AI safety, and improving accuracy and trust in deployed models.
