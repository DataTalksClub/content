summary: |-
  Xia is head of data and cloud at NOV, a German company that works on zero-emission mobility
  through data and cloud innovation. She studied automotive engineering in China, Italy and France,
  then moved to Berlin, where she spent four to five years at home with her two children. In 2018
  she decided to switch into data science. She completed a second master's in data science at HTW
  Berlin, learned from Andrew Ng's deep learning courses on Coursera, and took an internship that
  required Python. Alexey invites her to talk about career transitions, leadership and building
  inclusive data teams.

  Xia describes how she used Alexey's courses during COVID. She completed the Data Engineering and
  MLOps Zoomcamps, building an end-to-end pipeline with a CO2 dashboard, and she credits them with
  helping her land her first two jobs. The first was an AI and data consultant role, where she
  revisited the ML Zoomcamp material before the interview. The second was a data engineer role at
  NOV, where the stack used AWS, Docker and Terraform. She moved into leadership by taking on
  responsibility for a data science working group, AWS certification sprints and diversity
  initiatives, and then stepped in when the head of data left. Her first 100 days relied on a
  coaching course and on observing a strong team lead.

  Xia says that leadership is a skill that can be learned, and that she found the coaching and the
  book How to Win Friends and Influence People useful. She says she hoped to spend 20 percent of her
  time coding after becoming head of data, but that was not realistic. She describes lateral moves
  between individual contributor and management tracks as possible when the company structure is
  clear. For someone returning from management, she suggests talking with the manager first. Xia
  also recommends learning German, starting with intensive courses in Berlin and setting a deadline
  for a language certificate, and she says that applying to German-speaking companies reduces
  competition. She also uses AI coding tools to regain hands-on skills.

  The conversation turns to inclusion. Xia notes that many women in Germany with advanced degrees
  stay at home, partly because of tax incentives for married couples. She runs a working mom project
  that meets in local living rooms to review CVs and share experience, and she mentors two women.
  She names Pi Ladies and Women in Big Data Berlin as useful groups. She advises people with non-
  technical backgrounds to find their strengths and to use domain knowledge from their earlier work.
