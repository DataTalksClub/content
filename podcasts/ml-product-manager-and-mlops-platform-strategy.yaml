intro: How do you become an ML product manager and build MLOps platforms that teams actually use? In this
  episode, Geo Jolly, a Technical PM at Glovo with a background from web/dev to data science and product
  management, walks through the practical skills and decisions that define the role. <br><br> We cover
  MLOps platform strategy and vendor evaluation, treating internal platform users as customers, and the
  real productivity costs of poor tooling UX. Geo outlines product manager responsibilities—roadmaps,
  specs, backlog prioritization—and explains outcome-driven problem definition, avoiding solution bias,
  and running workshops and interviews to break down complex problems. You’ll hear about ML observability
  and KPIs to measure platform impact, release governance and rollout timing, adoption strategy for internal
  stakeholders, and engineering roles needed for platform delivery (CI/CD, K8s, syseng). Practical topics
  also include model validation and ML quality assurance, embedded data scientists as power users, Agile
  approaches for data science, and concrete transition paths from data scientist or Scrum Master into
  technical ML product roles. <br><br> Listen to gain actionable guidance on MLOps platforms, observability,
  adoption strategy, and the technical literacy required to succeed as an ML product manager
