description: Discover DataOps strategies, immutable pipelines & a self-service lakehouse to boost reproducibility,
  scale data platforms, enable analysts and speed delivery
intro: How do you scale a data platform that supports self-service analytics while keeping pipelines reproducible
  and maintainable? In this episode, Lars Albertsson, founder of Scling and former Google, Spotify and
  Schibsted engineer, walks through pragmatic DataOps principles for building scalable data platforms.
  <br><br> We dig into building self-service at Spotify, orchestration with Luigi, and the core platform
  components—storage, compute and workflow engines—plus compute choices like Spark, Flink, containers
  and managed services. Lars explains immutable, functional pipeline design to solve reproducibility problems,
  contrasts data lakes and warehouses (raw dumps vs aggregates), and covers object storage, governance,
  ingress/egress patterns, CDC and database versioning strategies. He also explores batch vs streaming
  trade-offs, micro-batching, DataOps maturity (tests, schema automation), MLOps vs DataOps overlaps,
  and risks around data mesh and decentralization. <br><br> Listeners will come away with concrete architectural
  trade-offs, patterns for immutable pipelines and self-service lakehouse design, and recommended readings
  from the Scling list to deepen expertise in DataOps, lineage, versioning and practical data engineering
