intro: What does it take to evolve from hands-on IoT data engineering to leading data architecture — building
  scalable pipelines, adapting to cloud platforms, and designing analytics models that serve entire organizations?
  In this episode, Loïc Magnien, Lead Data at Mylight150 with a decade spanning database management, data
  engineering, product ownership and architecture, shares his real-world journey from managing sensor
  data to architecting enterprise-scale data systems. <br><br> We explore the progression from tactical
  IoT work — sensor data aggregation, structural health monitoring, ETL automation for logger ingestion
  — to strategic architecture responsibilities including cloud fundamentals (Python, Azure), lakehouse
  design with bronze-silver-gold layering, and core data modeling that aligns cross-functional teams.
  Loïc breaks down practical patterns for building reusable ingestion and transformation templates, designing
  dimensions and facts that serve multiple consumers, maintaining data quality expectations across layers,
  and balancing hands-on engineering with stakeholder engagement. The conversation covers hiring considerations
  for data teams, scaling responsibilities from individual contributor to lead, leveraging tools like
  DBT and LLMs for technology scouting, and making pragmatic tradeoffs between reusable components and
  project-specific solutions. <br><br> Listen to discover actionable guidance on architecture outcomes,
  agile delivery through proofs of concept, and building core models that drive business alignment — plus
  insights on the senior leadership skills needed to succeed as a data architect in IoT and analytics
  environments.
