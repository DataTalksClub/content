intro: 'How do you actually break into data analytics — and what combination of networking, portfolio
  work, SQL skills, and interview prep gets you hired? In this episode, Juan Pablo Murillo, an AI and
  data professional now at Google with prior roles as an Amazon Business Intelligence Engineer and data
  scientist at T-Mobile, walks through a practical path from math grad to analytics roles. <br><br> We
  cover the full playbook: where SQL fits in the skills roadmap, building a data analytics portfolio (rpubs,
  EDA, visualizations, basic ML), portfolio hosting and repo hygiene, and how to present projects for
  hiring managers. Juan addresses bootcamp trade-offs, networking wins from meetups, LinkedIn tactics
  for visibility, cold outreach and DIY internships, finding contract or pro bono work, and resume/STAR
  interview prep. He also discusses role realities for BI and analytics engineering and employer branding
  to build credibility. <br><br> Listen for actionable steps and specific tactics—how to structure three
  portfolio projects, message templates for outreach, and interview preparation tips—to help you break
  into data analytics, improve SQL interview readiness, and turn public work into job opportunities.'
