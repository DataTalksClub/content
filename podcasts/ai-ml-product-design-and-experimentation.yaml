description: 'Master AI product design: build algorithm-ready UX, run rapid experiments and craft data-driven
  roadmaps to prioritize innovation and ship measurable results.'
intro: How do you design products that are “algorithm-ready” while running rapid experiments and building
  data-driven roadmaps? In this episode, Liesbeth Dingemans—strategy and AI leader, founder of Dingemans
  Consulting, former VP of Revenue at Source.ag and Head of AI Strategy at Prosus—walks through pragmatic
  approaches to AI product design that bridge vision and execution. <br><br> We cover algorithm-friendly
  UX and signal collection, a concrete interaction-design case study comparing TikTok and Instagram signals,
  and the Double Diamond framework for moving from problem framing to solution exploration. Liesbeth explains
  scoping and prioritization, parallel experiments and proofs of concept, one-week design sprints, appropriate
  timeframes for research-to-scale, and the role of designers, data scientists, engineers and product
  managers in shaping AI roadmaps. <br><br> Listeners will learn how to avoid rework by involving data
  science early, use scoping documents to challenge assumptions, create measurable experiments (the Task
  Force/“Jet Ski” model), and build data-driven pitches for long-term bets versus quarterly OKRs. Tune
  in for concrete frameworks and practices to make AI product design, rapid experiments, and data-driven
  roadmaps work in your organization
