notes: '## Books


  * [**Extreme Programming Explained** by Kent Beck (1999)](https://www.amazon.com/Extreme-Programming-Explained-Embrace-Change/dp/0321278658):
  Introduces Extreme Programming practices and **pair programming** as a core engineering ritual.

  * [**Test-Driven Development: By Example** by Kent Beck (2002)](https://www.amazon.com/Test-Driven-Development-Kent-Beck/dp/0321146530):
  Canonical guide that formalized **TDD** as a development workflow.

  * [**Introduction to Operations Research** by Churchman, Ackoff & Arnoff (1957)](https://www.amazon.com/Introduction-Operations-Research-Charles-Churchman/dp/0395042001):
  Foundational text establishing **operations research** as a discipline.

  * [**The Theory and Practice of Revenue Management** by Talluri & van Ryzin (2004)](https://link.springer.com/book/10.1007/b139000):
  Definitive reference for **revenue management** and dynamic pricing models.

  * [**High Output Management** by Andrew S. Grove (1983)](https://www.amazon.com/High-Output-Management-Andrew-Grove/dp/0679762884):
  Management classic informing **effective 1:1s** and pragmatic leadership.

  * [**The Lean Startup** by Eric Ries (2011)](https://www.amazon.com/Lean-Startup-Entrepreneurs-Continuous-Innovation/dp/0307887898):
  Popularized **“fail fast”** and validated learning for product development.

  * [**First Things First** by Stephen R. Covey, A. Roger Merrill, Rebecca R. Merrill (1994)](https://www.amazon.com/First-Things-Stephen-R-Covey/dp/0684802031):
  Popularizes the **Eisenhower priority matrix** (urgent/important) used in **2×2 prioritization**.


  ## Research Papers


  * [**Hidden Technical Debt in Machine Learning Systems** (Sculley et al., 2015)](https://arxiv.org/abs/1706.04972):
  Seminal paper that seeded **MLOps/Day-Two** thinking for production ML.

  * [**Random Search for Hyper-Parameter Optimization** (Bergstra & Bengio, 2012)](https://www.jmlr.org/papers/volume13/bergstra12a/bergstra12a.pdf):
  Shows **random search** often outperforms grid search for **hyperparameter tuning**.

  * [**On the Input-Output Stability of Time-Varying Nonlinear Feedback Systems** (Zames, 1966)](https://ieeexplore.ieee.org/document/1089830):
  Core **control theory** result frequently adapted to **dynamic pricing/control** formulations.


  ## Programs / Reports


  * [**DARPA Explainable AI (XAI)** (Program page, 2017)](https://www.darpa.mil/program/explainable-artificial-intelligence):
  Flagship initiative that catalyzed modern **white-box / XAI** research.


  ## Essays / Models


  * [**The AI Hierarchy of Needs** by Monica Rogati (2017)](https://hackernoon.com/the-ai-hierarchy-of-needs-18f111fcc007):
  Influential essay behind the **Data/AI pyramid** framing (data → features → ML → AI).

  * [**Eisenhower Decision Principle** (Background)](https://www.eisenhowerlibrary.gov/eisenhowers/quotes):
  Historical basis for the **Eisenhower matrix** used in **impact/effort prioritization**.


  ## Courses


  * [**Machine Learning (Coursera) by Andrew Ng**](https://www.coursera.org/learn/machine-learning): Landmark
  MOOC that standardized introductory **ML curricula** and terminology.


  ## Tools


  * **GitHub**: Platform hosting Dat’s open-source interview guide and community projects.

  * **Slido**: Live Q&A tool for collecting audience questions.

  * **VBA (Visual Basic for Applications)**: Excel automation language used in Dat’s early analytics work.

  * **Jupyter Notebooks**: Interactive Python environment used for assignments and demos.

  * **AWS Lambda**: Serverless compute platform from Amazon Web Services enabling on-demand ML functions.

  * **AWS Glue Data Brew**: Visual data-preparation tool for cleaning and transforming datasets.

  * **Kubernetes**: Container-orchestration system introduced by Google (2014) for scalable deployment.

  * **Cloud Foundry**: Open-source PaaS (VMware / Pivotal) enabling app deployment at scale.

  * **Greenplum Database**: MPP analytic DBMS (Pivotal) based on PostgreSQL.

  * **Snowflake**: Cloud data-warehousing platform (founded 2012).

  * **Amazon Redshift**: Cloud data-warehouse service from AWS (2013).'
