intro: 'How do you build and scale an ML team that delivers product-driven AI without getting bogged down
  by tech debt or false promises? In this episode, Dat Tran — Partner & CTO at DATANOMIQ and former AI
  lead at Axel Springer, idealo, and Pivotal — walks through practical strategies for hiring, MLOps, and
  shaping data teams for startups. <br><br> Dat draws on a decade of production ML experience to unpack
  the MLOps mindset (day-two operations, model maintenance), how to hire early (T-shaped generalists,
  take-home assessments, key hiring signals), and when to shift to specialists as you scale. He also explains
  product-centric practices: aligning hiring to prototype vs. MVP needs, prioritizing impact over technical
  perfection, and building human-centric AI (augmenting pricing managers at Priceloop). Other topics include
  open research and open source as strategic advantages, bootstrapping data capabilities, retention through
  autonomy and interesting work, and educating leadership about realistic AI expectations. <br><br> Listen
  for actionable guidance on building ML teams, hiring machine learning engineers, and implementing MLOps
  and product-driven AI in early-stage startups.'
