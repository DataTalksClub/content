intro: How do you evaluate and prototype long-context LLMs in a real-world setting while advancing a career
  as an applied researcher? In this episode Lavanya Gupta — a Carnegie Mellon Language Technologies Institute
  alum and Sr. AI/ML Applied Scientist at JPMorgan Chase’s Machine Learning Center of Excellence — walks
  through practical strategies for applied LLM research and career growth. With 5+ years of industrial
  research experience, public talks at WiDS, PyData, TensorFlow User Group and reviewer roles for NeurIPS
  2024, ICLR 2025 and NAACL 2025, Lavanya connects technical practice with professional development. <br><br>
  We cover core topics including long-context evaluation methodologies for transformer models, rapid prototyping
  workflows for LLM systems, and best practices for industry publishing and technical communication. Listeners
  will get actionable guidance on setting up reproducible experiments, balancing research rigor with product
  timelines, and positioning industry work for peer-reviewed venues. This episode is for machine learning
  engineers, NLP researchers, and applied scientists seeking concrete tactics for prototyping LLMs, conducting
  robust long-context evaluations, and growing a research-oriented career in industry.
