description: Build trustworthy ML systems that drive business decisions through explainable AI, organizational
  trust theory, and actionable model deployment.
intro: How do you build ML systems that business teams trust and can act on? In this episode, Polina Mosolova
  — a data scientist at SAP who completed an industrial PhD building end-to-end ML pipelines — demonstrates
  how to bridge research and production through explainable AI grounded in organizational trust theory.
  Drawing from her churn prediction research, Polina shows how the ABI framework (Ability, Benevolence,
  Integrity) transforms model explanations into actionable business interventions. <br><br> We explore
  the industrial PhD path as a vehicle for building trustworthy ML systems, covering the practical tensions
  of research and production deliverables, supervision dynamics, and how academic rigor enhances deployable
  models. Technical deep-dives include interpretability versus explainability versus actionable ML, model
  architecture choices (glass-box models, GAMs, Neural Additive Models), explainability tooling (random
  forest + SHAP), computer vision activation maps, and why LLM explainability faces unique challenges
  compared to tabular models. The conversation ties together trust proxies, KPIs, and MLOps practices
  that make explanations business-relevant. <br><br> Listen to learn a systematic approach for building
  ML systems where explanations drive decisions — essential for data scientists who need to deploy models
  that stakeholders understand, trust, and can act upon to achieve measurable business outcomes.
