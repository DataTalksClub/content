intro: How can automatic speech recognition (ASR) better serve people with disordered speech and diverse
  accents? In this episode Katarzyna Foremniak, a computational linguist with over 10 years in NLP who
  has built language models for Audi and Porsche and teaches at the University of Warsaw, examines human-centered
  ASR for atypical and accented speech. We trace her move from linguistics to computational approaches
  and cover core phonetics and morpho-syntax concepts that matter for speech recognition. <br><br> Key
  topics include distinctions between accents and speech disorders, limitations of standard ASR datasets,
  strategies for disordered speech recognition such as specialized datasets, data augmentation and synthetic
  variations, multimodal ASR with lip-reading, and transfer learning for fine-tuning with limited data.
  We also discuss data collection challenges (GDPR, clinical data), bilingualism effects, stammering and
  fluency, pronunciation issues like Polish consonant clusters, and practical workflows including Amazon
  Transcribe plus LLM post-processing. Deployment tradeoffs—model size, on-device setups, automotive voice
  use cases—and assistive applications round out the conversation. <br><br> Listeners interested in speech
  recognition, disordered speech, accents, and ethical data practices will gain practical technical strategies
  and a clearer view of research and deployment priorities.
