intro: How do you build a digital health startup that ships a focused MVP, uses AI for diagnosis, and
  delivers care via telemedicine while overcoming data gaps and legacy workflows? In this episode Maria-Liisa
  Bruckert, Co-Founder and Co-CEO of SQIN and recipient of the Google Play Best of 2020 award and Google
  Female Founder Immersion 2020, walks through her transition from electrical engineering to health tech
  and the practical playbook she uses to de-risk product development. <br><br> We cover MVP strategy and
  market research tactics—cold outreach, accelerators, clinical meetings—and unconventional experiments
  like an AR “lipstick try-on” to collect engagement data. Maria explains how SQIN aligns AI diagnosis
  with concrete business cases, builds a digital clinic flow from diagnosis to prescription, and uses
  telemedicine for remote follow-up and prescriptions. You’ll also hear about data strategy and community
  bootstrapping, ethics and UX for sensitive AI messaging, go-to-market choices for regional rollout,
  and monetization through SaaS integrations and partnerships. <br><br> Listen for actionable insights
  on product-market fit, hiring priorities for AI and full-stack roles, and practical steps to launch
  a digital health startup that balances technical credibility with patient access.
