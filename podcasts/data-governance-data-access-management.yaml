intro: 'How do you scale data access management—from access controls and data catalogs to access-as-code—without
  slowing innovation? In this episode, Bart Vandekerckhove, co-founder and CEO at Raito and former PM
  of Privacy at Collibra, walks through practical approaches born from consulting with banks (BCBS 239)
  and tackling early data governance pain. <br><br> We explore what effective data governance looks like
  for building trust in data, the differences between data catalogs, dictionaries and lineage, and how
  cloud consolidation and Chinese walls shape access management. Bart covers ownership models (data teams,
  governance teams, data mesh), common skill gaps for data engineers, and core processes: access requests,
  approvals, reviews and revocation. You’ll hear actionable tactics for preventing privilege creep—time-bound
  access, revocation workflows—and guidance on GDPR, privacy vs security roles, and debugging with temporary
  access. <br><br> Later segments dive into DataOps patterns (active metadata, automated tagging), avoiding
  role explosion, and the rise of access-as-code with Terraform and IAM. Listeners will gain a clear,
  incremental strategy for implementing access controls, leveraging data catalogs, and evaluating build
  vs buy or open source options to scale data access management.'
