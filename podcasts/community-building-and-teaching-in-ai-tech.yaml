context: 'Context: This episode follows Erum Afzal and Omdena Academy’s evolution—how global, project-based
  AI collaborations and community organizing were systematized into accessible, tiered courses and local
  chapters to teach practical, ethical AI skills.

  Core theme: The unifying idea is that democratizing real-world AI expertise requires a community-first,
  project-to-course approach—turning collaborative problem-solving into structured learning pathways,
  open instructor pipelines, regional sub-communities, and integrity-focused practices so diverse learners
  can rapidly gain practical skills, leadership opportunities, and ethical career pathways in AI.'
