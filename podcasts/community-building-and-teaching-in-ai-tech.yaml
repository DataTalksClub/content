intro: 'How can communities turn real-world AI projects into repeatable courses that scale learning and
  careers? In this episode Erum Afzal — lead ML engineer, PhD researcher in AI for teacher training, and
  head of Omdena Academy — walks through a project-to-course model for AI education rooted in community
  collaboration. <br><br> We cover Omdena’s evolution from global, problem-focused projects into structured
  courses, the design of foundational data science curricula (Python, Pandas, NumPy, NLP), and the practical
  steps for course development: instructor application, content review, delivery, and engagement strategies
  (live sessions, selection, graduation). Erum explains the instructor pipeline and open applications,
  access pathways for learners, the academy’s free-course business model with organizational partnerships,
  and options for monetization or volunteer teaching. <br><br> Listeners will get concrete guidance on
  curriculum tiers (basic to advanced), community growth tactics (start small, empower sub-communities),
  ethical concerns around hiring integrity and responsible ChatGPT use, and where to apply to teach (Omdena.com/Omdena-Academy).
  This episode is for educators, community builders, and early-career practitioners who want actionable
  models for teaching, curriculum design, and building inclusive AI learning communities.'
