description: 'Discover data journalism: sourcing, storytelling & visualization with Python and Tableau—learn
  tools, workflows and publishing tips to craft compelling stories.'
intro: 'How do you transform raw data into compelling, trustworthy journalism that readers can understand
  and act upon? In this episode, Angelica Lo Duca—researcher at the Institute of Informatics and Telematics
  (CNR) and Data Journalism professor at the University of Pisa—shares practical frameworks for data journalism
  covering sourcing, storytelling, visualization, and essential tools like Python and Tableau. <br><br>
  Drawing from her journey through cryptography, web development, and data science, Angelica tackles real-world
  challenges: finding reliable small datasets on the web, working with query engines like Presto and Trino,
  and learning from investigative work like Washington Post projects. She distinguishes data journalism
  from data science, reveals teaching approaches for digital humanities students, and breaks down an effective
  writer''s workflow: problem identification → solution development → clear results presentation, complete
  with code repositories and step-by-step clarity. <br><br> You''ll gain concrete strategies for converting
  dense reports and survey PDFs into engaging narratives, visualization best practices (one concept per
  chart, choosing tables over confusing pie charts), tool selection guidance between Python scripting
  and Tableau, plus curated learning resources. Whether you''re a journalist exploring data tools, a data
  professional interested in storytelling, or an educator teaching interdisciplinary skills, this episode
  delivers actionable methods for reliable sourcing, effective narrative construction, and clear data
  visualization that makes complex information accessible and impactful.'
