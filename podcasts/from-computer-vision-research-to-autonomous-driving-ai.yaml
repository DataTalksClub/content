intro: 'How do you take computer vision research out of the lab and turn it into production-ready AI that
  actually works in the real world? In this episode Aishwarya Jadhav, a Machine Learning Engineer with
  over four years of industry experience and a Master’s from Carnegie Mellon University, walks through
  the challenges of applying computer vision research to production systems. Her background spans multimodal
  LLMs, generative AI, and computer vision, with research experience in multimodal deep learning and text
  information extraction and projects including assistive technologies for the visually impaired. <br><br>
  We cover the bridge between applied research and engineering: translating prototypes into robust, deployable
  models, integrating multimodal pipelines, balancing model accuracy with latency and scalability, and
  practical considerations for production-ready AI and real-world deployment. Listeners will gain concrete
  perspectives on how research informs product choices, what to prioritize when deploying computer vision
  systems, and how multimodal approaches and generative models fit into end-to-end solutions. This episode
  is useful for ML engineers, researchers, and product teams focused on building reliable, deployable
  computer vision and multimodal AI systems.'
