description: 'Discover MLOps, model monitoring & Upwork tips to build a freelance data scientist portfolio:
  pricing, onboarding, tools to land clients including MLflow'
intro: How do you transition from startup engineering to a sustainable freelance data science practice
  while handling MLOps, model monitoring, and client work on Upwork? In this episode, Antonis Stellas
  — a freelance data scientist at Nanometrisis with a background in applied mathematics, physics and a
  professional doctorate working on industry consultancy — lays out a practical playbook. <br><br> Antonis
  walks through startup-honed skills (cross-functional roles, lean build-measure-learn, communication
  and business know-how), concrete MLOps tooling and patterns (MLflow, Prefect, Grafana), and model monitoring
  essentials like data drift, concept drift and using Evidently AI. He shares a hands-on course project
  (semiconductor prediction), streaming examples (YouTube metrics into BigQuery/Looker), Kafka/Confluent
  emphasis, and an open-source Evidently how-to from Hacktoberfest. <br><br> For freelancers, Antonis
  details starting on Upwork — profile building, proposal iteration, pricing strategy, onboarding workflows,
  invoicing and balancing startup commitments. Listen to get actionable guidance on building a portfolio,
  selecting projects, monitoring production models, and practical steps to find and retain clients as
  a freelance data scientist
