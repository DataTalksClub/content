summary: |-
  Maryam is a data and AI leader with more than 20 years of experience. She grew up in Iran, studied
  electrical engineering and completed a PhD in web personalization at DePaul University in Chicago.
  She moved to Berlin in 2009 and worked in an ad tech startup, then at Adidas, where she built a
  customer data platform and personalization models. Her later roles include chief data officer for
  Germany at Sky, data leadership at GoStudent, marketing analytics at Delivery Hero, and product
  analytics at Zalando. Alexey, who also lives in Berlin, invites her to talk about how people can
  keep their footing in the AI era, and about the human skills that matter in that shift.

  Maryam describes a pattern she has seen since the big data wave. Companies first use AI as a
  copilot to speed up individual tasks, and the change to how a company operates comes later. She
  sees roles such as data analyst, analytics engineer, data engineer and platform engineer blending
  together, and she says the people who succeed will be T-shaped, with a strong core skill that lets
  them judge AI output and a broader understanding of the business. Alexey notes that managers
  increasingly expect one engineer with an AI assistant to do much more work, which Maryam agrees is
  happening. For anxiety about uncertainty, she recommends taking small steps and learning to fail
  forward instead of trying to plan five years ahead.

  She describes a design thinking approach from the book Designing Your Life. The method starts with
  assessing work, life and health, then writing a life and work vision, following energy and flow,
  creating several options for the next chapter and prototyping them through interviews or
  shadowing. She recommends not deciding from fear, and she suggests that people look for paid work
  that uses what they enjoy rather than chasing a trend. Alexey describes his own concern about
  clients stopping payments and says that a structured exercise could help him plan options. For
  people who were recently laid off, Maryam recommends building a useful project, volunteering for a
  nonprofit, and building a network.

  For juniors, Maryam names resilience, communication, storytelling and curiosity as the key skills.
  Alexey suggests that people use dictation with an AI assistant to organize their thoughts before
  asking for advice.
