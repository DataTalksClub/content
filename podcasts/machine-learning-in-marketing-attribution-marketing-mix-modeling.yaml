description: Learn attribution, media mix modeling & cookieless tracking to measure uplift, TV/offline
  impact and automate MMM for faster acquisition & retention
intro: How can marketing teams reliably measure ad impact, allocate budget across channels, and adapt
  to a cookieless world? In this episode, Juan Orduz — a Berlin-based mathematician and data scientist
  specializing in statistical learning, time series, Bayesian and geometric methods — walks through practical
  marketing data science approaches for attribution, media mix modeling (MMM), uplift modeling, and cookieless
  tracking. <br><br> We cover attribution basics and multi-channel ambiguity, MMM techniques including
  regression, ad-stock and saturation, and campaign uplift estimation using time-series counterfactuals.
  Juan explains measuring TV and offline channels, the impact of privacy changes like iOS 14.5 on tracking,
  and strategies for retention and purchase-frequency modeling. You’ll also hear about uplift A/B testing
  design, modeling benchmarks (start simple), MMM retraining cadence, learning decay rates with Bayesian
  regression, and building a marketing data function with the right data integrations and cross-functional
  collaboration. <br><br> If you want actionable guidance on attribution models, media mix optimization,
  privacy-aware tracking, and when to choose Bayesian vs frequentist methods, this episode gives clear
  frameworks, common pitfalls, and learning resources to help practitioners improve measurement and decision-making
