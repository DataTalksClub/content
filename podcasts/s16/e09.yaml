summary: |-
  Dimitri Visnadi is an independent data consultant who has worked in corporate and startup roles in
  several countries, and who has advised brands such as Unilever, Ferrero, Heineken and Red Bull. He
  moved from marketing into data after a master's at University College London, and he worked on
  sales business intelligence and KPIs at Hewlett Packard. Alexey invites him to explain how to move
  from corporate analytics to freelance data consulting, how to price services and how to avoid
  contract pitfalls.

  Dimitri describes the frustration and the freedom that pushed him to freelance. Before he
  resigned, he reached out to other data freelancers he found on LinkedIn, but there were fewer of
  them than he hoped. He says the jump was not as hard as he remembered, but he made it. He also
  describes working with recruiters and agencies. His rule is to apply for each project through only
  one recruiter, because two recruiters presenting the same profile can eliminate the candidate.
  Alexey asks how to set a price for a first client, and the answer comes down to rate benchmarks,
  platform fees and the difference between agency and direct work.

  Dimitri explains the contract options. Platforms have their own terms and conditions, which you
  accept by signing, while direct agreements let you set the terms yourself. Alexey and Dimitri talk
  about working as a dependent contractor and the legal questions that come with it. Alexey notes
  that when clients are corporations, payment is often delayed by bureaucracy rather than by a lack
  of money, so it helps to vet the client and to ask about payment assurance up front. He also
  recommends building referrals and a long-term pipeline, and he describes creative self-marketing
  as a way to be found.

  On the business side, Dimitri says that freelancing can bring a good living, but income varies
  from month to month, so a financial runway is important before quitting a full-time job. Many
  people start on weekends or part time. Typical mistakes include positioning yourself badly,
  pricing too low, and expecting fast results. Dimitri also points to marketing courses, mentors and
  newsletters as learning resources. Alexey points out that freelancing needs business and
  communication skills, not only technical ones.

  The main advice is to plan the transition with savings in place, to check clients and contracts
  carefully, and to build a clear offer before looking for work.
