summary: |-
  Alexey Grigorev, the founder of DataTalks.Club, is the guest on this episode, which marks the
  community's third anniversary. Johanna Bayer, who prepares the podcast questions, interviews him.
  Johanna has a background in psychology, computational neuroscience and research software
  engineering, and is finishing a PhD in machine learning for clinical neuroimaging at the
  University of Melbourne. The questions came from the community on Slack and LinkedIn in an ask-me-
  anything format.

  Alexey describes his path from a Java developer at a Swiss bank to a machine learning course on
  Coursera, then a master's degree in business intelligence in Berlin. He spent four and a half
  years at OLX, where he trained a model only once and mostly did engineering work. He has worked
  full time on DataTalks.Club since April. Francis runs community operations and events, and Valeria
  handles the newsletter and social media. Alexey says the main goal is sustainability, which means
  finding more sponsors, while avoiding monetization so heavy that it would discourage members.

  On the future of data jobs and GPT-style tools, Alexey says the best way to stay involved is to be
  active on Slack, which is the center of the community. Activities include the podcast, the
  courses, Kaggle competitions such as a deep learning image classification contest, and the Project
  of the Week, where members come up with project ideas. Johanna and Alexey also discuss how the
  community handles moderation and how to find a niche.

  Alexey recalls the early days. He registered a Slack workspace and bought a domain for about 15
  euros without advertising it. A LinkedIn post that he did not put much effort into showed enough
  interest to justify the first course. The courses trace back to MLCourse.AI, a course he took part
  in through the Russian-speaking Open Data Science community, and later to the Zoomcamp format. He
  says the typical outcomes are career switches and internships, and that the COVID period helped
  the online courses grow. He also says a few members tried to use the Slack for dating, and he asks
  anyone who receives unwanted attention to report it rather than leave.

  The conversation closes with the book reviewing work that led Alexey to write a machine learning
  book, and with ideas he has not yet tried, such as hackathons and an event recommender. The
  community had almost 40,000 members at the time, and Alexey notes that the number of active
  members is much smaller. Johanna thanks the community for its questions.
