description: 'Learn freelancing in machine learning: pricing, client acquisition, and proposals to win
  ML consulting gigs, scale sustainably, and secure steady income'
intro: 'How do you move from academic research or in-house ML engineering to a sustainable freelance career
  in machine learning — getting clients, pricing your work, and delivering production systems? In this
  episode, Mikio Braun, who transitioned from TU Berlin into ML roles at Zalando and GetYourGuide and
  now consults on machine learning production, infrastructure, and teams, walks through that path step
  by step. <br><br> We cover the practical parts of freelancing in machine learning: launching first clients,
  sourcing leads through network and referrals, and demand generation with LinkedIn, talks, and podcasts;
  pre-sales tactics like free intro calls, problem discovery, and clear proposals; pricing models and
  rate-setting strategies; financial planning, capacity management, and avoiding burnout; plus specialization,
  productizing consulting, and scaling options (agency, product, or return to employment). The episode
  also addresses administrative essentials for freelancers in Germany (registration, VAT, payments), accounting
  choices, professional liability, and how to compete in a global remote market. Listen for concrete advice
  on client-finding, scope discipline, and deliverables so you can evaluate whether freelancing in machine
  learning is the right next step and how to start with a safety net.'
