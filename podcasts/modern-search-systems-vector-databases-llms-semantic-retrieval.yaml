context: 'Search today is less about keywords and more about constructing a reliable retrieval-plus-generation
  system: the core through-line is that effective modern search combines classical IR principles (indexing,
  ranking, evaluation) with semantic vector representations, embedding stores or vector databases, and
  LLMs—stitched together by careful ingestion, orchestration, prompt design, and human-in-the-loop evaluation—to
  deliver accurate, contextualized, and personalized answers.'
