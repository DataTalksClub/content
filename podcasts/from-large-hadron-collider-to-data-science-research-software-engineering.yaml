context: 'Context: A physicist’s journey from building and analyzing massive collider experiments to applying
  those technical, collaborative, and software-engineering skills in industry—culminating in a deliberate
  turn toward mentoring others through career transitions and leadership challenges.

  Core theme: Experimental physics training—rooted in tackling large-scale data, complex systems, rigorous
  software and teamwork practices—is a powerful, transferable foundation, and mentorship is the essential
  bridge that translates that expertise into effective industry roles, career progression, and leadership.'
