intro: How do you move from research scientist to running a freelance generative AI business focused on
  NLP—and actually win clients? In this episode Verena Weber, a former Research Scientist at Alexa AI
  with 7+ years in machine learning and a background in statistics, walks through that transition and
  what it takes to offer NLP services as a freelancer. Verena's mission is to help companies prepare for
  the GenAI shift, and she draws on deep NLP expertise to explain which service offerings make sense,
  how to position technical skills for business clients, and practical approaches to client acquisition
  in the generative AI space. Listeners will get a clear view of launching a freelance generative AI business,
  including how to translate research experience into marketable NLP services, approaches to finding and
  engaging clients, and what to expect when stepping out on your own. If you're a machine learning professional
  or aspiring NLP freelancer trying to build a sustainable freelance practice in generative AI, this episode
  provides grounded, experience-based guidance to help you get started.
