  and career growth strategies to build scalable analytics teams
intro: 'How do you hire, manage, and grow a high-impact data science team inside a B2B SaaS company? In
  this episode, Katie Bauer — Head of Data at GlossGenius and former data leader at Twitter and Reddit
  — walks through practical career frameworks and team-building strategies for product analysts, analytics
  engineers, marketing scientists, and data scientists. Katie traces her own trajectory from linguistics
  to analytics and explains what “craft” looks like in analytics: maintainability, documentation, and
  peer review. She breaks down IC versus management paths, how to mentor juniors through project-based
  learning, and when to buy versus build entry-level talent. You’ll hear concrete hiring and interview
  approaches for managers, how to assess strategy through case studies and trade-offs, and tips to help
  new hires succeed in their first month via proactive communication and async support channels. For leaders,
  Katie covers prioritization, raising data literacy, and fostering a data-driven culture. Listen to get
  actionable guidance on hiring data scientists, onboarding newcomers, developing senior talent, and scaling
  data teams in B2B SaaS.'
