description: Discover how Big Data Engineer vs Data Scientist roles differ — skills, performance optimization,
  ETL pipelines and ML deployment tips to advance your career
intro: 'How do the day-to-day responsibilities and skill sets really differ between a Big Data Engineer
  and a Data Scientist—and what should you learn to move between those roles? In this episode, Roksolana
  Diachuk, a Big Data Engineer at Captify, Women Who Code Kyiv lead and speaker on Scala and Kubernetes,
  walks through her career transition from backend Java into big data engineering and R&D. <br><br> We
  cover core responsibilities—building ETL data pipelines, HDFS/S3 storage, Impala and Parquet formats—plus
  performance tuning: Spark job optimization, cluster resource planning and monitoring with Prometheus/Grafana.
  Roksolana compares role boundaries (data cleaning and feature engineering for data scientists vs pipeline
  design and formats like Avro/Parquet/ProtoBuf), explores streaming vs batch tradeoffs (Flink vs Spark),
  and outlines ML deployment stacks (MLflow, Kubeflow, Kubernetes). Practical topics include databases
  to learn (Postgres, MySQL, MongoDB, Neo4j), data versioning with Delta Lake, observability, documentation,
  starter projects and learning resources. <br><br> Listen to learn which skills, tools and projects will
  help you choose or transition between careers, and what to prioritize when building scalable data pipelines,
  deploying models, and ensuring data quality.'
