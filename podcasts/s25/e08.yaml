notes: 'Miguel Otero Pedrido, an ML and AI engineer and author of The Neural Maze, joins Alexey Grigorev
  to talk about production machine learning. They cover his path from theoretical physics to ML engineering,
  why traditional machine learning still matters, how to start a recommender system without data, contextual
  bandits, where LLMs help recommender systems, the changing ML and AI engineering roles, trace redaction
  with an AI gateway, error analysis of agent traces, and semantic routing.


  Links:


  * [The Neural Maze](https://theneuralmaze.substack.com/){:target="_blank"}

  * [Miguel on LinkedIn](https://www.linkedin.com/in/migueloteropedrido/){:target="_blank"}

  * [Miguel on GitHub](https://github.com/MichaelisTrofficus){:target="_blank"}'
