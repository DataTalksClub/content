summary: |-
  Tony is a hands-on AI and data platform consultant who works in healthcare, life sciences and
  insurance, through his consultancy Norona Data. He began in bioinformatics research in the
  Netherlands and the United States, including work at Utrecht University and Stanford, on genome
  sequencing and clinical genetics. His first consulting work started during his master's studies,
  when a contact asked him to help with bioinformatics at their companies. He later moved into data
  engineering and data platform work. Alexey invites him to talk about how a data professional can
  become a consultant, and about the book he is writing with Juan on the non-technical side of data
  consulting.

  Tony says that a client base grows through relationships, public work and referrals, and that it
  rarely comes from one planned tactic. He found that buyers in niche fields often preferred
  candidates with PhDs and published work, so he turned to implementation partner programs with
  platforms such as Snowflake and smaller vendors. He describes these programs as a way to meet
  clients through the vendor's sales team, and sometimes through referral fees. He advises
  approaching a vendor with a win-win proposal, and he suggests building a digital footprint through
  talks, articles and a local or online community. Alexey adds that a mastermind group of peers can
  be more useful than a single mentor.

  On positioning, Tony says consultants should describe their work as a business outcome, such as
  lower acquisition cost, rather than as a technical role. He suggests finding an industry and a
  pain point by talking to people in that field, reading the trade press and learning the vocabulary
  of the buyer. He also recommends asking colleagues in other departments what their daily work
  looks like. Alexey, who is an introvert, says that talking with many people is a skill he had to
  learn.

  Tony describes the trade-offs of consulting, including unpredictable income, long hours for
  marketing and selling, and the need for savings of one to two years. He argues that spending money
  on accounting, tools and subscriptions can save time, and that deadlines matter a lot when no
  manager sets them. He also says that AI has raised the bar, as individuals now deliver work that
  once required teams. The book, which Tony and Juan are writing for people in the middle of their
  careers, aims to cover networking, marketing, translating work into ROI and communication.
