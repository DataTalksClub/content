notes: 'Tejas Kumar, an AI engineer at IBM and author of Fluent React, joins Alexey Grigorev to talk about
  building AI evaluations you can trust. They cover why evals go beyond a manual check, how to source
  evaluation cases and calibrate an LLM judge, how to refresh datasets, and how to judge final answers
  versus an agent''s trajectory.


