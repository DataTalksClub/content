  about terminal apps, fundraising, community growth & hiring signals.
intro: 'How do you turn open source work into a sustainable career and even a startup? In this episode
  Will McGugan — a Python open source maintainer and creator of PyFilesystem, Rich, and Textual — walks
  through his path from video game developer to founder of Textualize. We trace his early projects (BBCode
  parser, chess libraries), the design of PyFilesystem and S3 integrations, and how solving personal needs
  led to learning by building. <br><br> Will breaks down the technical and product journey: Rich’s terminal
  styling, tables, progress bars and observability features; the Textual framework for terminal GUIs;
  and the moment of founding Textualize after a viral tweet. He explains building in public, community
  growth via demos and social media, hiring through open source signals, and practical dev workflows with
  GitHub, PR reviews, and releases. He also outlines Textualize’s positioning and web hosting business
  model for terminal apps, plus contribution channels like Discourse and Discord. <br><br> Listen to learn
  concrete, repeatable steps for leveraging Python open source to find freelance freedom, attract users,
  raise pre-seed interest, and transition from developer to startup founder.'
