intro: How do you transform raw radio astronomy observations into reliable, production-grade machine learning
  systems that enable multi-wavelength science? In this episode we talk with Daniel Egbo — an astrophysicist
  turned machine learning engineer and AI ambassador (Arize, Tavily) and PhD candidate at the University
  of Cape Town — about bridging radio astronomy and applied ML. Daniel explains the challenges of working
  with MEERKAT data pipelines, strategies for multi-wavelength cross-matching, and the engineering practices
  needed to take models from research to production. <br><br> You’ll hear about end-to-end ML and LLM
  applications with an emphasis on reliability, practical evaluation, and knowledge-retrieval assistants,
  plus how data science techniques apply to astronomy workflows. Whether you’re building pipelines for
  radio telescopes, tackling cross-matching across optical and radio catalogs, or aiming to deploy robust
  production-grade ML systems, this episode offers concrete perspectives on data handling, evaluation,
  and operationalizing models in scientific contexts. Listen to gain actionable insights for integrating
  astrophysical datasets with modern ML tooling and improving model reliability in real-world deployments.
