intro: How can volunteering in open source AI projects accelerate your career while delivering tangible
  community impact? In this episode Sara El-Ateif — Google Developer Expert in Machine Learning, Google
  PhD Fellow, co-founder of AI Wonder Girls and Evercoach-certified business coach — walks through practical
  ways to build skills and momentum through volunteering and open source work. <br><br> We cover Sara's
  path from early AI interest to PhD research in multimodal learning and medical imaging, plus lessons
  from winning a Google PhD Fellowship. Hear concrete volunteer project case studies — a PTSD chatbot,
  trash detection, and cervical spine segmentation — and learn data sourcing tactics using Open Images
  and creative collection. Sara explains how to find opportunities (LinkedIn, social media, mailing lists,
  WIML), differences between collaboration platforms like Omdena and Fruit Punch AI, and how women-led
  groups structure projects. <br><br> Listeners will get actionable advice on hackathon strategy, MVP
  mindset under data/compute constraints, pitching for volunteer roles, building a research network, and
  the data engineering tasks that matter (pipelines, dashboards, prep). Tune in to discover how open source
  and volunteering translate into practical experience, referrals, and career traction in machine learning.
