intro: How do you move from a hands-on software engineer to a VP of Machine Learning while getting stakeholders
  to say “yes,” delivering rapid POCs, and building the full-stack skills teams need? In this episode
  Jack Blandin walks through that transition. Jack began as a Software Engineer in 2015, shifted into
  Data Science and Machine Learning in 2017, and has held ML and leadership roles at Fi, Wayfair, Trunk
  Club, and GoHealth—managing teams of 2 to 15. He’s now VP of Data Science & Machine Learning at Fi,
  finishing a PhD focused on ML, reinforcement learning, and algorithmic fairness, and launching a hiring
  marketplace for data and ML professionals. <br><br> We dig into practical strategies for stakeholder
  buy-in, how to scope and run rapid proofs of concept that prove value, and which full-stack skills accelerate
  career growth in ML and data science leadership. Listeners will come away with actionable approaches
  to design fast, business-focused POCs, communicate technical tradeoffs to non-technical stakeholders,
  and level up skill sets that bridge engineering and product — useful for anyone aiming to scale into
  ML management or improve ML engineering outcomes.
