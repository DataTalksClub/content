description: Learn MLOps design doc and data strategy to build scalable, reliable machine learning systems;
  navigate edge constraints, metrics, pipelines, and testing
intro: 'How do you design machine learning systems that scale, stay reliable in production, and meet tight
  edge and mobile constraints? In this episode, Arseny Kravchenko — a seasoned ML engineer focused on
  computer vision, active in ML since 2015 and a former Kaggle Master — walks through practical MLOps
  patterns for turning models into production systems. <br><br> We cover where startups trade off productionization
  and who owns those decisions; how to define ML system goals, non-goals, and assumptions; and why a lightweight
  design phase with a problem-first design doc (50/50 problem vs solution) pays off. Arseny breaks down
  edge and mobile ML constraints (latency, FPS, energy, Core ML), managing known and unknown risks with
  early tests, and building a solution blueprint: baselines, metrics, pipeline components, and data strategy
  (availability, processing, features, data lakes). He also explains system diagramming for data flow
  and real-time vs batch, dataset heuristics, and shares design doc examples (photostock search and retail
  pricing). Listeners will get concrete guidance on MLOps, design docs, data strategy, and edge ML trade-offs
  — plus pointers to deeper learning resources and a book offer discussed at the end.'
