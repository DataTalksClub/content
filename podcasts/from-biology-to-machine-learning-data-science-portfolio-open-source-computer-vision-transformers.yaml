intro: How do you move from a biology background into machine learning and build a data science portfolio
  that actually gets noticed? In this episode, Isabella Bicalho — a machine learning engineer and data
  scientist with three years of hands-on AI development and roots in computational research — walks through
  practical approaches for showcasing skills with open-source, computer vision, and transformer projects.
  <br><br> We cover how to translate domain knowledge from biology into ML problem framing, the role of
  open-source contributions in a data science portfolio, and project ideas that demonstrate computer vision
  and transformer expertise. Isabella also discusses how to document work, choose reproducible experiments,
  and highlight impact for hiring managers or collaborators. She runs a newsletter dedicated to showcasing
  women’s accomplishments in data science, bringing an equity-minded perspective to building visible work.
  <br><br> If you’re building a data science portfolio, shifting careers into ML, or want concrete ways
  to leverage open-source and modern architectures like transformers and computer vision models, this
  conversation offers practical guidance, realistic project priorities, and tips for making your work
  discoverable to recruiters and the community.
