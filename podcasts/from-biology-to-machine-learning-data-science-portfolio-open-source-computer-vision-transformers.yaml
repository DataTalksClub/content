context: 'Context: Isabella Bicalho’s episode traces a career arc from biology to machine learning—through
  internships (INRIA), freelancing, open-source contributions, teaching, and community engagement—illustrating
  practical projects, networking, and pedagogical work as the vehicles for growth.

  Core: The unifying idea is that continuous, community-centered, project-based learning—combining hands-on
  applied work, open-source contribution, mentorship, clear communication, and judicious use of AI tools—serves
  as the most effective pathway to build job-ready skills, bridge disciplines, and create real-world impact
  in data science and ML.'
