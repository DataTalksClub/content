description: Master MLOps, model monitoring & data observability with guidance on production observability,
  ETL root causes, tooling trade-offs, ONNX, build vs buy
intro: How do you keep machine learning models reliable in production — what should you monitor, where
  do upstream failures originate, and which tooling decisions actually matter? In this episode, Danny
  Leybzon, MLOps Architect at WhyLabs and computational statistics alum of UCLA, walks through the practical
  challenges of production model monitoring, data observability, and tooling trade-offs. Drawing on his
  path from analyst and product roles at Qubole to field engineering at Imply and now advising customers
  on observability, Danny defines the MLOps Architect as a technical-business bridge and explains how
  to prioritize production-first monitoring efforts. <br><br> Topics covered include scope of observability
  across ETL and data pipelines, data profiling architecture (WhyLogs, profiles, Apache Druid), build
  vs buy decisions, platform-agnostic integrations and ONNX interoperability, and trends around cloud-native
  stacks and vendor lock-in. He also offers hiring and career perspectives for MLOps roles and research
  priorities like fairness and segmentation. Listen to get concrete guidance on designing model monitoring,
  choosing observability tooling, and identifying upstream root causes so you can reduce incidents and
  improve model reliability in production
