intro: 'How do you transition from digital marketing into analytics engineering—and master DBT, SQL, and
  data modeling in the process? In this episode, Nikola Maksimovic shares his complete career transformation
  journey, from startup marketing roles in London and Berlin to growth marketing at Ecosia, and ultimately
  his pandemic-driven pivot into BI and analytics engineering. Nikola reveals the step-by-step learning
  path that worked for him—SQL fundamentals, hands-on BI projects, strategic conversations with internal
  data teams—plus the essential technical skills that got him hired: advanced SQL, data pipeline understanding,
  and Python foundations. <br><br> You''ll get an inside look at real analytics engineering work: spearheading
  a company-wide DBT migration, navigating data modeling decisions (wide vs narrow tables, incremental
  strategies), and working with modern data stacks including Snowplow, DBT, Looker/LookML, Redshift, Airflow,
  Airbyte, and Redash. We also explore A/B testing frameworks, product analytics implementation, and the
  nuanced differences between analytics engineer and data analyst roles. Nikola shares his proven transition
  playbook (Excel → SQL → dashboards → meaningful projects), networking tactics that opened doors, mentorship
  approaches, and the communities and resources that accelerated his learning. <br><br> Whether you''re
  in marketing, operations, or any non-technical role considering a move into data, this episode provides
  a concrete roadmap with actionable steps, realistic timelines, and insider insights to help you successfully
  pivot into analytics engineering.'
