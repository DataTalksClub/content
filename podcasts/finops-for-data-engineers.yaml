intro: How can data engineers bring FinOps practices into their day-to-day work to control cloud spend
  across BigQuery and the modern data stack? In this episode, Eddy Zulkifly — Staff Data Engineer at Kinaxis
  with a decade of experience building data platforms on Google Cloud, Azure, and AWS — breaks down practical
  ways to make cost optimization part of platform design and operations. <br><br> We explore core topics
  including cloud cost optimization for data teams, BigQuery cost controls and query efficiency, cost-aware
  architecture in the modern data stack, multi-cloud considerations, and monitoring and governance for
  predictable spend. Eddy draws on experience from Home Depot e-commerce and supply chain analytics, mentoring
  and teaching roles, and his work on open-source data projects to translate FinOps principles into engineering
  choices. <br><br> If you’re a data engineer or platform owner responsible for budgets and performance,
  you’ll get actionable guidance on reducing unnecessary cloud costs, improving visibility into usage,
  and designing pipelines that balance performance with price. Listen to learn practical steps to align
  data engineering practices with FinOps goals and make cloud spend more predictable.
