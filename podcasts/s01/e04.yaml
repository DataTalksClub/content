summary: |-
  Luke Whipps, co-founder of Neural AI, takes the guest seat in this session on how data
  professionals can stand out in the hiring process. He has recruited in data, analytics and AI for
  close to ten years, and he says his firm is built around community and value rather than
  transactional job matching. Alexey asks how a position gets closed. Luke explains that each role
  is defined differently by each company, so the work starts with helping the client define the
  role and mapping talent pools through the firm's network and headhunting. Luke reviews about 10
  to 20 profiles a day across positions.

  Luke says the interview starts when a recruiter opens the CV, so the layout should look clear and
  professional and suit the audience, whether a bank or a startup. He looks for three things. The
  first is overlap between the candidate's industry and use cases and those of the client. The
  second is projects that back up the listed tech stack, since a list of frameworks alone reads as
  buzzword bingo. The third is tenure and progression: changing roles under a year is a red flag,
  while one to two years is average. Alexey summarizes these points, and Luke agrees. He considers
  two pages the ideal CV length, and he says titles can be aligned to industry norms as long as
  they do not stretch the truth.

  For candidates early in their careers, Luke recommends choosing one industry or area of data
  science and showing commitment through meetups, conferences and projects. Tailoring means reading
  the job description and researching the company's challenges, then writing a short, targeted
  message that links each challenge to a specific project. Luke favors approaching a few companies
  directly over sending mass applications, and he suggests segmenting the market, such as
  autonomous driving startups in Berlin, to keep the search focused.

  Candidates moving from academia often meet a research-for-research mindset, and companies push
  back on it. Luke suggests productionizing something, even in a small way, adding personal
  projects, and looking for university collaborations with industry. On salary, he does not treat a
  salary question as a red flag, but he sees a very high ask with little experience as a concern.
  He also favors transparency about other interviews with a recruiter the candidate trusts.

  Luke concludes that candidates stand out when they understand their purpose and focus on one
  area, going deep rather than wide.
