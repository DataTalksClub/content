intro: How do you move from proofs-of-concept to scalable AI data products that deliver measurable business
  value? In this episode, Greg Coquillo, a Technology Manager at Amazon who builds AI roadmaps for Private
  Brands’ product safety and compliance, walks through practical approaches for building and scaling data
  products, MLOps, customer research, and metrics. <br><br> We cover Greg’s transition into AI product
  work and the role of data product managers (internal vs. external), then dive into customer journey
  mapping, domain knowledge, and structured customer research—interview techniques, documentation, the
  Five Whys, and hypothesis testing. You’ll hear how to work backwards from business problems, contribute
  technical input to roadmaps with T-shirt sizing, and prioritize MLOps by spotting unscalable manual
  processes. Greg outlines three-year roadmap thinking (impact, effort, cost), a pragmatic Excel template
  (problems → solutions → metrics), and SMART and operational metrics like pipeline failures, SLAs, and
  data quality. He also addresses operating without a PM, aligning team mental models, and on-the-job
  product skill development. <br><br> Listen to learn actionable methods for roadmap planning, MLOps prioritization,
  customer research, and defining success metrics for AI-driven data products
