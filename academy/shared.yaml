fit:
  for_title: This Is for You If
  not_title: This Is Not for You If
  for_shared:
  - You can study full-time, Monday to Friday, for the whole program.
  - You can follow technical teaching and work with others in English.
  - You want to work as a software or AI engineer, and you may be between jobs right now.
  not:
  - You have never programmed. Start with the [free Zoomcamps](/courses/) and come back.
  - You need an evenings-only course.
  - You want a certificate without building anything.
syllabus:
  heading: Sixteen Modules, One Project That Grows Every Week
  intro: This is the draft syllabus. I use the waitlist's survey answers to shape the final version.
admission:
  heading: Limited Seats
  body: I teach every session and review every project myself, so a cohort has 15 seats. If more people qualify, the next cohort follows.
  steps_heading: How You Get In
  steps:
  - title: Join the waitlist.
    text: Leave your name and email on this page. There is no commitment.
  - title: Apply first.
    text: When applications open, the waitlist gets them before anyone else.
  - title: Short task and a conversation.
    text: A small practical exercise and a 20-minute call, so we both know the level fits.
  - title: Seats are offered in rounds.
    text: Everyone who applies gets an answer.
faq:
  heading: Questions
  items:
  - question: Who Is This For, and Who Is It Not For?
    answer: For developers with 2+ years of programming experience who live and work in Germany, whether you are laid off, in your notice period, job hunting or employed and upskilling. It is not for beginners and does not start with basics like Git or Docker, and it does not fit if you can only study in the evenings.
  - question: When Does the Next Cohort Start?
    answer: 'Start: April 2027. Join the waitlist and you hear first when applications open.'
  - question: How Much Time Does It Take?
    answer: 'It is full-time: Monday to Friday, 09:00 to 16:30 Berlin time, live, for 3 months (13 weeks). You need to be available for the full schedule.'
  - question: Is It Online or in Berlin?
    answer: Berlin or live online. Online participants join live on the same Monday to Friday schedule. After you join the waitlist you can say which one you prefer.
  - question: Can the Agentur für Arbeit or the Jobcenter Pay for It?
    answer: 'The Bildungsgutschein is a training voucher from the Agentur für Arbeit or the Jobcenter that can pay the course fees for further training. Both programs are designed for Bildungsgutschein funding (AZAV), coming soon. Your adviser decides whether you get a voucher, and that decision is separate from getting a seat, so tell your adviser about your plan early. The guide walks through the steps, [in English](/academy/guides/bildungsgutschein-in-english/) and [in German](/academy/bildungsgutschein/).'
  - question: Do I Need a Powerful Computer or a GPU?
    answer: No, a laptop with internet access is enough. Coding agents and the applications you build send API requests to model providers.
  - question: Do You Cover Job Search and Portfolio?
    answer: Yes, the program spends 2 to 3 weeks on networking, finding projects to solve and building your portfolio, and includes mock interviews.
  - question: How Do You Choose Who Gets a Seat?
    answer: 'By the same published criteria for everyone: programming experience that fits the program, availability for the full schedule, English, a concrete goal, and a short practical task. Your employment or benefit status is not a criterion.'
  - question: What Happens to My Email?
    answer: I use it only to write to you about this program and its application. You can ask me to delete it at any time. Details are in the [privacy notice](/academy/privacy/).
