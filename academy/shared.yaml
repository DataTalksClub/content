    href: https://github.com/DataTalksClub
  - label: MACHINE LEARNING BOOKCAMP
    href: https://www.manning.com/books/machine-learning-bookcamp
project_heading: The Final Project
fit:
  for_title: This Is for You If
  not_title: This Is Not for You If
  for_shared:
  - You can study full-time, Monday to Friday, for the whole program.
  - You can follow technical teaching and work with others in English.
  - You want to work as a software or AI engineer, and you may be between jobs right now.
  not:
  - You have never programmed. Start with the [free Zoomcamps](/courses/) and come back.
  - You need an evenings-only course.
  - You want a certificate without building anything.
syllabus:
  heading: Sixteen Modules, One Project That Grows Every Week
  intro: This is the draft syllabus. I use the waitlist's survey answers to shape the final version.
admission:
  heading: Why 15 Seats
  body: I teach this cohort myself and review every project. I can do that properly for about 15 people, not for more. If more people qualify than there are seats, there is a waitlist and a later cohort. I won't add seats.
  steps_heading: How You Get In
  steps:
  - title: Join the waitlist.
    text: Leave your name and email on this page. There is no commitment.
  - title: Apply first.
    text: When applications open, the waitlist gets them before anyone else.
  - title: Short task and a conversation.
    text: A small practical exercise and a 20-minute call, so we both know the level fits.
  - title: Seats are offered in rounds.
    text: Everyone who applies gets an answer.
faq:
  heading: Questions
  items:
  - question: When does the next cohort start?
    answer: 'Start: April 2027. Join the waitlist and you hear first when applications open.'
  - question: What do I get for joining the waitlist?
    answer: You get the application before it opens publicly, and updates on dates, format and funding. Nothing else, and no obligation.
  - question: What do I need to know before I start?
  - question: Will the Agentur für Arbeit pay for it?
    answer: Designed for Bildungsgutschein funding (AZAV), coming soon. Talk to your adviser early.
  - question: Is it online or in Berlin?
    answer: Berlin or live online. Online, you join live on the same schedule. The survey after you join asks which one you could attend.
  - question: What is the schedule?
    answer: 'Full-time: Monday to Friday, 09:00 to 16:30 Berlin time, live, for 3 months (13 weeks).'
  - question: Do I have to live in Germany?
    answer: The program is built for people in Germany, and a Bildungsgutschein is only available there.
  - question: How do you choose who gets a seat?
    answer: 'By the same published criteria for everyone: programming experience that fits the track, availability for the full schedule, English, a concrete goal, and the practical task. Your employment or benefit status is not a criterion.'
  - question: What happens to my email?
    answer: I use it only to write to you about this program and its application. You can ask me to delete it at any time. Details are in the [privacy notice](/academy/privacy/).
