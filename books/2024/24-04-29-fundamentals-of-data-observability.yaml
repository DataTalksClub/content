- name: Romuald Tcheutchoua
  text: Thanks for the book!
  replies: []
- name: Romuald Tcheutchoua
  text: Does the book cover ALL the KEY observability needs for the ENTIRE machine learning lifecycle?
    if yes, please can you share a glimpse of how the book can help at the specific stages of ML lifecycle?
  replies:
  - name: Andy Petrella
    text: 'Hello Romuald Tcheutchoua, good one.

      So data observability has a big role to play in analytics observability (see chapter 1 and 2). They
      are working hand in hand to produce the needed “features” to represent the system in place (a ML
      product or so).

      A ML lifecycle is likely including a data lifecyle, this is where you want DO to back you up.

      Note that the concept introduced in the book are mainly translating concepts from application and
      infrastructure observability… which therefore can easily translated in analytics/ml one

      (I did the exercise but must be continued further… perhaps a future book — but happy if someone
      writes it for me ahaha)'
- name: Romuald Tcheutchoua
  text: Also, there are  couple of ML observability platforms (such as Arize, etc.) available out there.
    what are the innovative aspects of the book that makes it better compared to other available observability
    resources?
  replies:
  - name: Andy Petrella
    text: 'A question I would love to answer your own POV on.

      An observability platform is complete when you have added all observability components taking care
      of their relative facet of the system. This is also explained in chapter 1 and 2.

      There is not yet 1 observability platform (OSS or not) that does everything… it’ll happen one day
      probably though 🙂'
- name: Nirupama Valluru
  text: "Have you advocated for the need for SLAs in the book? If yes, how effective would they be in\
    \ agile systems. \nIf no, what is the alternative and how can data reliability be ensured across teams?"
  replies:
  - name: Andy Petrella
    text: 'Hello Nirupama Valluru, nice one!

      Advocating is a strong statement but I am covering it yuup.

      It is coming after having cover many aspects leading naturally to this concept, but also SLOs and
      SLIs.

      The best I can recommend is to read up to that point rather than me trying to summarize it too shortly
      here TBH.

      It is already in chapter 2, just before talking about garbage in/out. So there is not much to wait
      before getting to it.

      However, I am not covering the “agile” part, IMHO SLA and agile practices are not BFFs 😅. Agile
      is meant to allow quick deliveries and fail fast and safe, which are concepts covered also in the
      book  (page 151, chapter 6).

      Don’t get me wrong, I don’t mean SLA doesn’t fit an agile team, I mean that relying “only” on SLA
      is not possible in an agile system (defining an SLA is a long process postponing delivery).

      I am advocating more SLO and SLI in fact, which are closer to data observability than SLA is to
      data quality.'
  - name: Nirupama Valluru
    text: "Okay \nThank you for the detailed response"
- name: Edwin Chuy (edchuy)
  text: How does data observability fit within a data governance framework?
  replies:
  - name: Andy Petrella
    text: 'Hello Edwin Chuy (edchuy), neat question 🙂.

      Some other members asked me corollary questions, and I can complement my previous answers with an
      additional info that might be close to your specific question.

      Acutally, data observability is working hand in hand with data governance - while one describes
      policies and laws to be known and embraced, the other helps automating associated controls and ensuring
      they are implemented.

      In a way, DG is the governement, DO are the sensors (eg cameras, …) to monitor, judge and cops are
      engineers, stewards, etc 🙂

      Here is attached a screenshot showing where DO fits in the DAMA Wheel'
  - name: Edwin Chuy (edchuy)
    text: Andy Petrella Thanks for the answer. I somehow knew that the answer would fit within the DAMA
      framework.
- name: Manoj
  text: How different is data observability for different systems (like analytics, databases, ml models,
    llms etc) are there any common things/framework we can apply to all?
  replies:
  - name: Andy Petrella
    text: 'Hello Manoj thanks for the question, I would recommend you to check my answer to Romuald Tcheutchoua’s
      questions as it is very similar.

      However, that gives me another to emphasize again that there are several observability areas: data
      and analytics (ML) are two of them, others are application and infrastructure.

      All areas have some common concepts, roles, and concepts, but each is also coming with its own set
      of capabilities which are distinguishing one another.

      A system is, in fact, observable if it has all areas of observability enabled (see chapter 1 and
      2).

      You don’t need either one (ml obs) or another (data obs), but all of them due to the heterogeneity
      of data systems (which cannot be avoided as this is intrinsic and vital)'
  - name: Manoj
    text: Thanks Andy Petrella
