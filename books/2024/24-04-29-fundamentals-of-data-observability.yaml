- name: Luis Oliveira
  text: "Hello everyone. \nThank you for this book Andy Petrella \U0001F642 \nMy question is regarding\
    \ data observability in the big world of data governance. \nHow far can a team implement data observability\
    \ processes if the company as no data governance structure implemented?\nCan a data team start with\
    \ data observability processes on its own?"
  replies:
  - name: Andy Petrella
    text: 'Hello Luis Oliveira good ones!

      Data observability can be initiated without data governance in place, at all.

      Of course, I am not recommending to not have DG 😄 (see my other report on the topic: [What Is Data
      Governance? Understanding the Business Impact](https://www.oreilly.com/library/view/what-is-data/9781492090328/)).

      Data observability is a practice dedicated to give the processes (applications, pipelines, ml, …)
      manipulating data to ability to expose information about their behaviour (usage, purpose, patterns,
      …).

      Using this information (data observations) doesn’t necessarily rely on data governance because they
      are used primarily by all data users to have visibility about what’s happening with data at any
      time.

      However, having DG in place, allows DO to be leveraged in more standard ways and to use the data
      observations to “control” data governance policies are followed, and, conversely, allow DG policies
      to evolve (given data observations are facts from the fields and DG can adapt over time to that).

      You can make a parallel with other observability: using prometheus for example doesn’t require to
      have IT Governance in place (think about startups). It doesn’t prevent it to be useful for the whole
      team/company (by transivity), but its value benefits with governance practices — ultimately, support
      teams, SREs, …

      Alternatively, we can think like this:

      How much do we need to be convinced or do we need to be forced to produce logs about data schema,
      data metrics, and even some data lineages?

      Then, how often do we think about it?

      Then, how much governance policies will make us do it?

      Then, how much enforced policies will enable them?'
- name: Tim Makhambetov
  text: 'Thanks for the book Andy Petrella! Couple of questions:

    1. What are the approaches to get a buy in from the management and stakeholders on implementing robust
    data observability in the organization?'
  replies:
  - name: Andy Petrella
    text: "Hey Tim Makhambetov cool, thanks for the qs!\nGetting a buy in for data observability is similar\
      \ to get a buy in for other type of observability (eg prometheus, datadog, and other folks of the\
      \ kind).\nIt used to be hard, because the “value” is hard to demonstrate (esp. for non tech savvy\
      \ ppl) - and also, the value is hard to track or measure (or there is no baseline yet):\n- the number\
      \ of errors anticipated, \n- the amount of processes trusted by automation vs team work, \n- the\
      \ satisfaction of users (and engineers…)\n- the management of unknown-unknowns\nAnd the list goes\
      \ on.\nA mistake often made is to use “the quality” as one of the goal to be reached with observability.\n\
      In fact, observability (data in this case) is to avoid “quality” issues to propagate and to become\
      \ huge problems due to the amount of time and efforts needed to understand each issue.\nAvoiding\
      \ all quality issues can be made with tests and pre-requesites and contract (prepping my next answer\
      \ \U0001F605) and stuff alike, those can take a lot of time and perhaps infinite (if you want to\
      \ avoid “all” issues). So best is to find a limit (or just abandon it to go to prod aha) and then…\
      \ what?\nThen data observability. To support all other cases.\nBut also the cases that were predefined\
      \ above, because data observability will provide information about their occurences.\nSo how to\
      \ get buy-in from stakeholders?\nBy experience, it is sold as an insurance, a backup, because the\
      \ team cannot humanly support efficiently (I mean people and time, hence \U0001F4B8) all data product/pipeline/…\
      \ at maximum satisfaction. Because negociating quality in data is a matter of push back and throwing\
      \ the ball between producers and users.\nTeams know that problems * will * happen, but users are\
      \ not accepting them because they have not been told problems * will * happen. So it is inacceptable\
      \ when any little thing happens.\nTeams don’t tell anything about this fact to users, they are scared\
      \ to do it because they can’t say “yes, there will be problems, but we’re ready, so don’t worry”.\n\
      Data observability is allowing teams to tell their users they can trust them because they are prepared\
      \ to help them out in case of problems, and over time, avoid them.\nPS: remember how hard it was\
      \ to sell/convince about application/infrastructure observability back in 2010s :face_with_spiral_eyes:"
- name: Tim Makhambetov
  text: 2. What is your view or recommendation on data contracts for the purpose of data observability?
  replies:
  - name: Andy Petrella
    text: 'Data contracts are a great way to align on many things especially before going production.
      Esp. if they can be enforced.

      Like any contract they can go as deep as any human can think, and take as much time to do so, and
      thus delay the value generated by the transaction being contractualized.

      A contract has its limit, because compromise have limits, and also they are not covering every single
      possible event that can happen (in fact they can, but how long will it take to “discuss” them -&gt;
      especially, the associated responsibility and possible “fines”?).

      Data contracts are governing the transactions.

      Data observability is tracking the executions of transactions.

      Sometimes (often!) things are not going the way it was expected, but we have to deal with that,
      we need to be prepared, we need to find new compromise to allow the relationship to keep going and
      the transactions to hold (with trust).

      That is make data contract evolving.

      Hence, in data contracts, you fix rules, with data observability you:

      - validate them

      - update them (yes rules are not necessarily written in stone…)

      - help creating new ones

      So in a data contract, you specify that the processes in place must at least produce some foundational
      information (as described in ch2 ^^). Contracts can also specify which metrics are mandatory, but
      I don’t recommend them because it’s not worth it.

      Like most contracts, there is a request for both parties (esp. the service provider in such case)
      to have an insurance, its terms are relatively vague (and often absurd at first - like a 1B dollar
      coverage 😅). That’s data observability.

      Note: SLAs are not observability per se, even though they are related.'
- name: Luis Oliveira
  text: "I have one more question to add \U0001F603  \nWhich are in your opinion the best data observability\
    \ tools and why? \nI use a lot of dbt so I use elementary but IMO the package is full of bugs and\
    \ has lots to grow. \nI also work with databricks for data from raw to silver layer. \nDon’t know\
    \ which tool we should implement but I am thinking on doing a POC for Great Expectations."
  replies:
  - name: Andy Petrella
    text: 'Ahem, hehe, tricky one as I am also the founder of Kensu…

      I won’t give a direct answer to this, as I don’t want this to become a product plug but provide
      everyone with some insights about “tooling” for data observability.

      First of all, there are two parts in data observability:

      1. the data tools must be data observable

      2. the data observations must be leveraged in a data observability platform

      For 1., elementary is a good example of what is called in the book an “agent”, that is a component
      attached to a tool that will turn it “data observable”. In this case, dbt-core is already partially
      data observable as it produces manifest and run-results, however they are not easily consumable.
      Plus, the tests are nice but the tracking is tedious as devs must configure them all. Elementary
      solves the first part by exposing the data observations (in the json files) in a table, and partially
      the second, as it generates tests.

      However, elementary is not producing metrics on data, but test-results which only addresses a minor
      part of what is needed to be covered to leverage appropriately data observability.

      On spark, same thing, an agent (a jar + py module) can be attached to the applications to generate
      the necessary information to add the data observability capability to all jobs. There are component
      offering lineage exposure and some schema as well, but there is only one I saw turning spark jobs
      into fully data observable ones (guess who is publishing it 😅).


      For 2., a platform is needed to aggregate and consolidate information coming from various agents
      (elementary, spark agent, azure data factory, python script, stored proc, …) to create a holistic
      view of the processes and also offer capabilities leveraging the “history” of the behavior (a database
      storing timeseries and a graph at least!).

      This is something that must be separated from the tools (eg, dbt, spark, databricks, snowflake)
      and the agent (eg, elementary, spline, …) to allow interop and the holistic view mentioned above.

      Such a platform has the primary goals to detect anomalies and categorize which are issues or not,
      provide notification systems, troubleshooting helpers/companions. These must rely as much as possible
      on the information available in the platform without necessarily constantly relying on people providing
      inputs (eg, quality rules), hence statistical analysis (or AI if you want) is a table stake.

      Another important feature is the circuit breaker that allows the platform to act as a control tower
      for data processes -&gt; breaking pipelines involving non reliable data, avoid GIGO etc.

      I HTH'
