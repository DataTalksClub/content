- name: Kane Williams
  text: Andy Petrella is there any type of data you find particularly tricky to use some of the practices
    in your book well with? e.g. timeseries, ...
  replies:
  - name: Andy Petrella
    text: 'Kane Williams not necessarily, because the nature of the data is not the main driver. Of course,
      when logging metrics, the engineer may want to produce specific metrics such as cardinality of a
      categorical variable or things like this.

      The practice in the book emphasises that to have control of a data system and automate its operations,
      the information about the data must come from elsewhere than the datastores themselves.

      However, the chapter 8 is dedicated to systems that are less easy to integrate data observability
      into - not necessarily legacy, but opaque (like a cloud/SaaS service for example).

      So, graph, timeseries, non-structured, deep, flat, and so on data types are totally OK with the
      practice introduced in the book 😄'
- name: Nirupama Valluru
  text: "Thank you for the book Andy Petrella \nAre there any common signs or any right time that would\
    \ indicate it’s the right time for a company to invest in data observability?"
  replies:
  - name: Andy Petrella
    text: 'Hello Nirupama Valluru, thanks for this! It is a good corollary question to Luis Oliveira ’s.

      And, unusually 😅, the answer is quite short and straigthforward.

      Yes, there are common signs, it is when your data pipeline goes to production and created outcomes
      that will be used by others (people or systems)'
  - name: Andy Petrella
    text: 'This is the time triggering doubts, stress, and anxiety for the people who take this action
      or responsibility. This is when you want to have a maximum of visbility.

      Especially at the beginning. Over time, the team could reduce the visibility as confidence has grown,
      etc.'
  - name: Andy Petrella
    text: It’s like when you go to prod the first time, you have logs level DEBUG or INFO, then move to
      WARNING, ERROR later on
  - name: Nirupama Valluru
    text: Thank you for answering!
  - name: Andy Petrella
    text: My pleasure Nirupama Valluru
