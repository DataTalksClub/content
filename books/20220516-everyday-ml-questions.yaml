archive:
- name: Alexey Grigorev
  text: 'Hi Santiago and Vladimir! Welcome!

    How did you come up with the idea of bnomial? Which problem did you see with other similar websites
    and blog posts?'
  replies:
  - name: Santiago
    text: 'Thanks for inviting us!

      I’m always been fascinated by multi-choice questions because they are an excellent way to exercise
      your brain.

      When I’m studying something new, I need to find ways to practice. Sometimes building projects is
      the way, but sometimes that’s not an option.

      So we decided to build a site that would help people with their machine learning and data science
      journeys. Not to overwhelm people and make them sit through a long exam, but to go at it in different
      way: a little bit every day.

      Bnomial tries really hard to do what I want for my life: to build a learning habit.'
  - name: Santiago
    text: 'Our goal is not to compete with blog posts, tutorials, videos, or books. Those are great!

      Our goal is to become a different component of your learning journey. One that’s fun, doesn’t take
      a long time, and will stick with you for a long time.'
  - name: Alexey Grigorev
    text: Have you thought of doing something like duolingo eventually? I use it for learning German
  - name: Santiago
    text: 'This is an interesting question.

      Here is where we are headed in the short term: *creating a scoring system that encourages people
      to show up and answer more questions*.

      Letting you know where you stand, and helping you track your improvements over time is key.

      Right after that, we’ll see where we want to take this. We are taking it one step at a time.'
  - name: Alexey Grigorev
    text: By the way, that's what duolingo does as well - they really built-in gamification into learning
      and did it pretty well. If you haven't used it previously, check it out
  - name: Santiago
    text: Yeah, I’ve used it. My daughter learns French through it.
- name: Shaksham Kapoor
  text: 'Santiago &amp; Vladimir Haltakov Thank you both for such a unique initiative and for writing
    the first volume of this book 🙂 🙌

    I have a few questions for you:-

    - The questions that you post on your website, for instance, today''s question, it is a mix of an
    algorithm taught in AI + another taught in Data Science. So, this mix-and-match thing, is it something
    that you intend to do? Trying to show similarities and differences between concepts from similar fields.

    - Curiosity - how do you come up with these questions? Are these some sort of interview questions
    or something that you come up with while studying?

    - Are you planning to cover the recent advancements in NLP, CV etc., too via these questions?

    All the best for your future endeavors 👍'
  replies:
  - name: Santiago
    text: "Hey Shaksham Kapoor!\n1. You’ll see purely theoretical and practical questions. They range\
      \ from probabilities and statistics, to algorithms, machine learning, data analysis, game theory\
      \ and pretty much anything under the Artificial Intelligence umbrella. This is on purpose: our goal\
      \ is not to tackle one specialized narrow area, but to find ways to increase the knowledge we all\
      \ have.\n2. Some of these are problems we deal with every day. Some are the result of what we read\
      \ or conversations we have with others. \n3. Absolutely! If it’s useful, there’s a place for it\
      \ here."
  - name: Shaksham Kapoor
    text: 'Thank you for your response!!

      Another question, we have certifications for data science like "AWS Certified Machine Learning –
      Specialty", any plans to cover questions asked in these exams in the future?

      PS: of course not just focused on AWS but in general if anyone wants to prepare for a certification
      exam.

      &gt; I like the way the questions are posted, like storytelling, so it helps connect things quickly
      + we don''t forget it easily 🙂'
  - name: Santiago
    text: I’d love to cover some of those questions—at least the core learnings they are trying to evaluate!
  - name: Shaksham Kapoor
    text: 'That would really be helpful. I know these certifications do have suggested learning paths
      to help prepare for the exams, but they are more focused around their ecosystem and how it is used
      for performing data science.

      As you mention, if there is a possibility to cover generic things that any of these certifications
      evaluate on, then it''s worth looking at 🙂'
  - name: Santiago
    text: definitely!
- name: Alexey Grigorev
  text: What were the easiest and the most difficult questions so far?
  replies:
  - name: Santiago
    text: 'The hardest question so far was the one we published on April 19. It was about the Softmax
      activation function.

      The easiest question was the one we published on April 30. It was about the definition of hyperparameter
      tuning.'
  - name: Alexey Grigorev
    text: What was the question on april 19? maybe you could share the pages from the book with it? really
      curious about it
  - name: Santiago
    text: 'Here is the question:'
  - name: Alexey Grigorev
    text: 'Hmm I initially wanted to say it''s one, but softmax doesn''t get the input to the network.
      It gets the output of the previous dense layer.

      It also doesn''t return the index or the max value, so 2 and 4 are also our.

      The closest is 3, but it doesn''t sort the probabilities...

      So which one is it? =)'
  - name: Santiago
    text: 2 and 4 don’t say that softmax returns that thing. They say that softmax is a version of the
      function that returns that thing.
  - name: Santiago
    text: 'Basically, Option 2 says that Softmax is a smooth version of argmax

      Option 4 says that Softmax is a smooth version of max.'
  - name: Alexey Grigorev
    text: 'I guess then it''s probably that this value is max... then it''s option 4?

      But I understand now why it was the most difficult one =)

      Thanks for sharing it!'
  - name: Santiago
    text: Here is part of the answer 🙂
  - name: Alexey Grigorev
    text: Nice, thanks!
  - name: Alexey Grigorev
    text: How many people got this one right?
  - name: Santiago
    text: Can’t tell. We were’t storing individual data back then. We were only tracking correct choices
      (every question has up to 4 correct choices.)
  - name: Santiago
    text: So I can tell you the overall performance, but not how many people got it correctly.
  - name: Santiago
    text: But yeah, it’s been by far the most difficult question. Very tricky + dense wording = HARD
- name: Alexey Grigorev
  text: How much time do you spend preparing questions and answers? Is it something you do daily or you
    do it once per week?
  replies:
  - name: Alexey Grigorev
    text: And also curious to know how you work together on this. How does the process look like?
  - name: Santiago
    text: 'I write one question every day and review and schedule another question.

      Vladimir does the first round of reviews to everything I write. When he finishes, I let it sit for
      a couple of weeks before I do the final review.

      Leaving some time between the writing and the editing session is key to get a much stronger question.

      In summary, we write a question, then they go through a couple editing sessions before they get
      scheduled.'
  - name: Vladimir Haltakov
    text: 'When I write questions I try to write a couple at once. However, I have to admit recently Santiago
      is writing almost all of them…

      One interesting thing is that we do this fully asynchronously. We have a GitHub repo and we use
      the issues. One issue is one question. The one who writes it assigns it to the other one for review.
      We use several labels to track where the question is in the pipeline.'
- name: adanai
  text: 'I enjoy the case-study based exercises, thank you for doing this 😄

    The questions in some way make one feel that they are planning a decision than just giving out an
    answer, it''s nice!

    Would you....consider ....doing a freemium model for students? It would be helpful!'
  replies:
  - name: Santiago
    text: 'Hey Adanai, answering the daily question is completely free and it will stay that way.

      We are charging money for the book with every monthly question, but that’s a byproduct of what we
      really want to accomplish: get people to show up every day and learn something new.'
- name: Merve Unlu
  text: 'Hello! Thank you Santiago and Vladimir Haltakov for this interesting and fun way of learning.
    The detailed explanation about the answers is very helpful.

    I am not sure if there is one, but maybe a discussion forum could be useful. Could other people contribute
    to publish/generate questions?'
  replies:
  - name: Santiago
    text: 'Thanks, Merve!

      We are planning to enable a Discord server so people can get together and discuss individual questions.

      Regarding collaborations, we are taking it very slow because we aren’t sure how to compensate people
      yet. Right now, I’m working with a person that reached out to me to try and explore how collaborations
      would look like. Based on the experience, we will open it up to more people in the future.

      (The main issue with collaborations is compensation and rights. We are using this question as comercial
      content, so we need to ensure we retain the rights to the questions. That’s why we want to compensate
      those who contribute.)'
  - name: Merve Unlu
    text: Thank you for the answer.
- name: Gur Hevroni
  text: 'Hi Santiago &amp; Vladimir Haltakov, I have a non-technical question.

    The concept of daily problems is a great choice (very much like the awesome [https://thedailybyte.dev/](https://thedailybyte.dev/)),
    and your mission statement is aligned with that idea (by mentioning the overwhelming amount of machine
    learning and data science books out there).

    But in essence, when I look at your subscription plans, it seems that your subscribers are getting
    a ML-DS book every month...

    Is there a more creative way to keep your subscribers engaged (and paying) instead of overwhelming
    them with more books?

    I don''t mean to sound sarcastic or patronizing, I''m truly curious!'
  replies:
  - name: Santiago
    text: 'This is a great question. Just for now, the subscription will get people every question we
      publish, but we will not stop there.

      We have several ideas to improve that subscription over time. Without promising much, I can tell
      you that there’s a lot of value in a community of machine learning and data scientist professionals,
      so we are thinking on ways we can tap on that and connect companies with individuals.'
  - name: Vladimir Haltakov
    text: 'I like to think about the books as a reference. The goal is to have people coming to the website
      every day and answering the questions. As Santiago mentioned, we are working on a kind of a leaderboard
      to gamify the process a little bit 🙂

      The book is if you want to go through the old questions. Maybe you had a problem at work and remembered
      that you saw the question on Bnomial and want to check it again and follow the reference link. Or
      maybe you are preparing for an interview and want to test your knowledge on past questions? Then
      you need the book.'
  - name: Santiago
    text: By the way, Gur Hevroni I didn’t know about TheDailyByte. Seems to be pretty similar.
- name: Alexey Grigorev
  text: Where and how do you get inspiration? It's quite challenging to come up with a question and the
    explanation for the answer every day
  replies:
  - name: Santiago
    text: 'That’s my super power 🙂

      I draw inspiration all around me, from the problems I face, the books I read, the conversations
      I have.'
  - name: Alexey Grigorev
    text: I guess this is what happens when you tweet multiple times per day for more than a year? 😃
