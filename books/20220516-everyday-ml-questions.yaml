- name: Tim Becker
  text: Very interesting Santiago and Vladimir Haltakov. Do you attempt to switch between more theory
    and more case-study related questions? Also, do you try to evenly cover different areas of ML or is
    the selection based on your experience/preference or just randomly?
  replies:
  - name: Santiago
    text: 'For now, it’s mostly random, although I try to ensure that questions covering similar topics
      don’t go out close to each other.

      We have a little bit of everything: there are purely theoretical questions, and other more practical
      ones. We are planning to keep it that way with a slight bias towards practicality.

      And undoubtedly, the flavor of the questions highly depends on our own knowledge and experience.
      For example, I don’t have time-series analysis experience, so it’s hard for me to write about that.'
