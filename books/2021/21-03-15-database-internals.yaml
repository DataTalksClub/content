summary: "Have you ever wanted to learn more about Databases but did not know where to start?\nThis is\
  \ a book just for you. \n\nWe can treat databases and other infrastructure components as black boxes,\
  \ but it doesn’t\nhave to be that way. Sometimes we have to take a closer look at what’s going on because\
  \ of\nperformance issues. Sometimes databases misbehave, and we need to find out what exactly is\ngoing\
  \ on. Some of us want to work in infrastructure and develop databases. This book’s main\nintention is\
  \ to introduce you to the cornerstone concepts and help you understand how\ndatabases work.\n\nThe book\
  \ consists of two parts: Storage Engines and Distributed Systems since that’s where most\nof the differences\
  \ between the vast majority of databases is coming from."
