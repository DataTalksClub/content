- name: Alexey Grigorev
  text: 'I remember when I was learning design patterns (the GOF ones), I tried to use them everywhere,
    and in most cases, it was doing more harm than good. With experience, I learned when the patterns
    should be used and when they shouldn''t.

    Do you think something like that can also happen with ML design patterns? If yes, what advice would
    you give to beginners to get started with ML design patterns?'
  replies:
  - name: Mike Munn
    text: Alexey Grigorev yeah for sure! It’s like the typical hammer/nail scenario. For beginners, I
      think it would be helpful to first just read through the patterns to be aware of what’s out there.
      Then revisit certain patterns based on the individual use case and really question of it will help
      solve the problem *you* have. The final chapter of the book gives an overview of all the patterns,
      breaking them down in a simple chart of problem/solution/description. If you think a pattern might
      be a good solution, take a critical look at the section that discusses that one in detail. And see
      if it fits or not.
  - name: Alexey Grigorev
    text: Makes sense, thanks!
- name: Justin Neumann
  text: 'Dear Mike Munn,

    I read parts of your book with my O''Reilly learning account and I really liked it so far! I particularly
    like the idea of the "Reframing" concept. Do you think it is applicable to a single, global (gradient
    boosted tree) regression model that captures multiple time series (which is the problem I deal with
    on a daily basis)? I can''t think of a way to apply the "target binning" regression -&gt; classification
    approach to such a global model, unfortunately.

    Thanks in advance for the answer!

    PS: I have the book on O''Reilly, so no need to give me a book 😉


    Best, Justin'
  replies:
  - name: Mike Munn
    text: 'Thanks Justin Neumann great question. The Reframing pattern is an interesting one. It’s focus
      is less on the model itself and more on how the labels are represented. So, for example, the regression
      -&gt; classification reframing discusses how you can modify a typical regression problem and frame
      the problem as learning a probability distribution via classification and binning. One scenario
      where it is useful is when there may be training examples which have the same features but different
      labels (I think in the book we used the dataset of birthweights). This way you are learning a probability
      distribution for a feature input and it can be less confusing for the model. So you’re really just
      changing your labels, and you would modify your gradient boosted tree to be classification instead
      of regression. The pattern isn’t model dependent. Does that make sense?

      One last point to mention is that this approach of reframing may just not be beneficial to your
      data or use case. As with most solutions, it’s very use case dependent.

      Lastly, I’m glad to hear you have the book. I really hope you enjoy it!'
  - name: Justin Neumann
    text: Thanks for the reply. Your answer makes all sense to me and you're right, this pattern may just
      be not applicable to my problem. I'll keep reading! 😉 Best, Justin
- name: Rosona
  text: Hi Mike Munn! Thanks for taking questions. Who do you see as the perfect reader (slash ideal audience)
    of this book? Do you see it as essential even for the raw beginners, or something to ingest after
    e.g. a year of experience or more?
  replies:
  - name: Mike Munn
    text: Hi Rosona Thanks for joining in. Our target audience was someone that knows the basics of ML
      and building models. We kind of pitched it as a follow up to a beginning ML book, like Geron’s book
      “Hands On ML with SciKit and TF” or Muller/Guido’s book “Intro to ML with python” or after a semester
      course in ML. With more experience, I image the reader would be able to appreciate (or recognize)
      more of the patterns.
- name: Alexey Grigorev
  text: 'How would you rank patterns in terms of applicability and usefulness for applied machine learning
    in industrial settings?

    Which patterns come first to mind and we should use them in most of the projects?'
  replies:
  - name: Mike Munn
    text: Alexey Grigorev yeah good question. When I think about applied machine learning or ML projects
      we’ve done with our cloud customers, I think the most useful and common patterns are those that
      show up in our chapters on Repeatability and Resiliency, patterns like ML Pipelines, Continued Model
      Evaluation, Batch Serving, Keyed Predictions, Batch Predictions, Feature Store, Transform, and Model
      Versioning. Also, the Responsible AI patterns are also really important for applied machine learning
      projects.
  - name: Alexey Grigorev
    text: Thank you! And what is the least used one? You mentioned feature stores as something that smaller
      teams/companies usually don't need - maybe this one? or some other one?
  - name: Mike Munn
    text: yeah some of the patterns are more use case driven, so I’ve personally see those less. And yes,
      patterns like Feature Store seem to be much more important for industrial teams. In my experience,
      smaller, more agile teams might not benefit or need to have a feature store set up. They can be
      incredibly useful and necessary for some situations, but can also require a lot of technical overhead.
  - name: Alexey Grigorev
    text: Got it, thank you!
- name: Rishabh Bhargava
  text: 'Hi Mike Munn - thanks for writing this book! So invaluable as we figure out good practices for
    shipping ML systems. My question is: what were some design patterns (if any) that you would have liked
    to include, but that had to get edited out? 🙂'
  replies:
  - name: Mike Munn
    text: Hi Rishabh Bhargava thanks for joining with questions. It’s funny, that question has come up
      before, and honestly I think we were able to catch all the patterns we had in mind. Our initial
      list didn’t come out to such a round number of 30, but as we were writing a couple topics we thought
      would be covered as one pattern ended up getting their own section, or the opposite (some individual
      patterns ended up getting grouped together naturally). So in the end, we covered the ones we wanted….though,
      now that it’s been put in my mind I’m already thinking of new patterns we could have added 🙂
  - name: Rishabh Bhargava
    text: "I have a 2 parter question as a follow up. \n1. Do you think these design patterns will need\
      \ significant updates in the near future, or these patterns represent some general truths about\
      \ how ML systems should be built? \n2. If you think updates are likely, do you think the second\
      \ edition will be needed in 6 months, 1 year, 5 years or 10 years?"
  - name: Mike Munn
    text: 'yeah good questions,

      1. i don’t think these patterns themselves will need much updates..though, for some, the code or
      implementations could change over time and be updated or improved as tools continue to develop as
      solutions to address these common problems

      2. I don’t foresee the need for an second edition soon, but if code updates do become necessary,
      they’ll make it into the book’s github with the code examples much sooner.'
summary: 'The design patterns in this book capture best practices and solutions to recurring problems

  in machine learning. The authors, three Google engineers, catalog proven methods to help data

  scientists tackle common problems throughout the ML process. These design patterns codify the

  experience of hundreds of experts into straightforward, approachable advice.


  In this book, you will find detailed explanations of 30 patterns for data and problem

  representation, operationalization, repeatability, reproducibility, flexibility, explainability,

  and fairness. Each pattern includes a description of the problem, a variety of potential solutions,

  and recommendations for choosing the best technique for your situation.'
