- name: Denis Lepchev
  text: 'Hi Mike Munn - thank you and your colleagues for such a great book!

    I have a question regarding the "continued model evaluation" design pattern. As you mention in the
    book, usually we act on the model''s predictions - as an example trying to prevent customer''s churn.

    How companies like Google deal with the feedback loops, when acting on the model''s prediction changes
    the outcome, making it impossible to observe the ground truth? Many books and articles mention this
    problem, but the solution is not discussed.

    One of the solutions I am aware of is to have a small (untouched) hold-out group as a basis for model
    evaluation and for re-training, but it comes with its own set of problems. Is there an alternative
    method(s)?'
  replies:
  - name: Mike Munn
    text: 'Hi Denis Lepchev thanks!

      You bring up a really good point about ‘feedback loops’ when dealing with continued model evaluation.
      There is a lot written about this. I remember reading an article about a company called Stripe that
      discussed this problem for them in some detail for a credit fraud model they had developed.

      We discuss this briefly in the subsection called “Capturing ground truth” as well as other considerations.
      You mention a good approach. Another technique to consider is to use causal impact models. Causal
      impact uses Bayesian techniques to understand how a certain “treatment” might have affected a population.
      It’s commonly used in scenarios where it’s not possible (or not ethical) to have a hold out or control
      group. This is commonly used at Google and that team has open sourced a CausalImpact package you
      might want to check out.'
  - name: Denis Lepchev
    text: Thank you for the answer, Mike.
- name: Alper Demirel
  text: 'Hello Mike Munn, thank you for writing this beautiful book and coming to this channel 👏

    - What is the most important difference from similar books on the market?

    - Why did you need to write such a book with your friends?'
  replies:
  - name: Mike Munn
    text: "Thanks so much Alper Demirel. I’m glad you enjoy it. \U0001F642\n- In my mind, this book would\
      \ come after an intro book or reference on ML. We certainly talk about how you would do things (and\
      \ there is a github repo with code implementing the ideas in code) but this book is focused more\
      \ on common problems and their solutions that we’ve learned in working with customers along the\
      \ years. Likely a lot of patterns will be familiar to you, if you’re a practicing ML/AI engineer.\
      \ So this book is a kind of formal collection of “notes from the field” and solutions to common\
      \ real world problems of building and productionizing ML models. \n- Following on a bit from my\
      \ point above, another reason we wanted to write this book (in addition to having a collection of\
      \ common problems/solutions) was to create a shared language for these ML patterns. Like any pattern,\
      \ you find yourself using the same tricks over and over. And in talking with other colleagues we\
      \ wanted to create a single term or phrase that describes that problem/solution. So, for example,\
      \ the “Bridged Schema” pattern gives a name to the common problem that arises when dealing with\
      \ changing data fields. This way, we can try to have a shared language of common patterns for everyone\
      \ to use."
  - name: Alper Demirel
    text: Thank you so much for the answers, now I'm more excited to read the book 🤩🔝
- name: Aleix
  text: 'Hi there, Mike Munn! Pleasure talking to you :)

    What has been the most recurring problem to an ML engineer like you when working at Google?'
  replies:
  - name: Mike Munn
    text: 'Thanks Aleix glad to have the opportunity to talk to you as well. 🙂

      That’s a good question. It’s hard to say what the most common problem would be. I work a lot with
      Google Cloud customers. We typically work on engagements that span the entire ML work lifecycle.
      The project specific problems or patterns that arise are so use case dependent. So I guess the most
      recurring problems then would be the problems that relate to initial or final stages of the lifecycle
      (since they are broad and similar across multiple use cases). Those would be the patterns addressing
      data issues or dealing with Responsible AI and working with business stakeholders. Typically the
      most common problem is in framing the problem and understanding issues with the data. That seems
      to be consistent across all projects I’ve worked on.'
- name: Matthew Emerick
  text: Hey, Mike Munn!  Appreciate a moment of your time.  Your book is on my (rather large) Amazon wishlist.  I
    do have a question for you.  Are the patterns organized by difficulty level?
  replies:
  - name: Mike Munn
    text: 'hi Matthew Emerick! Happy to be able to stop by 🙂 I know too well about large book to-read
      lists lol.

      The patterns aren’t arranged by difficulty. Instead we arranged them loosely with the different
      stages of a typical ML workflow or ML lifecycle. So we start with patterns related to Data Representation,
      then move to Problem Representation, then talk about patterns related to Resiliency and then Reproducibility
      and end with Responsible AI and stakeholder management.'
  - name: Matthew Emerick
    text: I like that.  Is there anything about the complexity (ie bubble sort is easy to do, but slow)
      for each pattern?
  - name: Mike Munn
    text: 'kind of! Each pattern is broken down into four main sections: Problem, Solution, Why It Works
      and Tradeoffs &amp; Alternatives. The Tradeoffs &amp; Alternatives section discusses exactly that.
      We touch on any ‘gotchas’ or complexity issues, or common pitfalls or just other related approaches
      you might want to consider.'
  - name: Matthew Emerick
    text: Okay, so the expected style for a pattern book.  Makes it easier anyone who has used a pattern
      book in the past.  Good plan.  Organization is something I touch on in my book reviews, both macro
      and micro.  A well written book with great and important content can hit a wall if it's not organized
      well.  Great job!
- name: George Melvin
  text: 'Hey Mike Munn, thanks for sharing your time with this community! I’m excited to dive deeper into
    the book. My question is around company size: are certain patterns more conducive to smaller/larger
    teams/organisations? In particular, I’d be interested to hear about your experience (re)learning patterns
    when moving between teams/organisations that are comprised of larger/smaller teams. Thanks!'
  replies:
  - name: Mike Munn
    text: 'hi George Melvin thanks for having me

      Good question. The patterns are more focused on implementation. So I can see how they would apply
      to both smaller/larger orgs. That being said, for some smaller orgs or smaller teams there is less
      focus on some MLOps aspects. For example, we have a section on Feature Stores. This is a super useful
      pattern and important to know about; however, I can image for a smaller org the need for a feature
      store may be less imperative than for a large organization where you have dedicated teams to engineer
      features for the models that another dedicated team is building.

      But, I’d say the patterns in general are relevant for small or large teams and orgs. Just some may
      resonate more than others.'
  - name: George Melvin
    text: Great, thanks for your answer! I ’m looking forward to learning more 🤓
- name: Neal Fultz
  text: 'Thanks Mike Munn for answering questions. Mine is: what are the most dangerous anti-patterns
    that you have encountered?'
  replies:
  - name: Mike Munn
    text: 'Hi Neal Fultz and thanks!

      Ohhh that’s a good one. A lot of things come to mind. I think the most dangerous (and I may be biased
      in the type of work I usually do and some bad past experiences) would be anti-patterns related to
      reproducibility and resiliency. So much of ML development is experimentation (with data, with pipelines
      with models, etc) and reproducibility is crucial to running thorough experiments. Also, as I work
      with more companies interested in productionizing their models, anti-patterns related to resiliency
      really end up being more and more detrimental'
- name: Mike Munn
  text: hello Everyone. Thanks for having me visit the channel and the opportunity to talk about the book
    🙂
  replies: []
- name: Dr Abdulrahman
  text: "Thank you Mike Munn for the book and for your time answering questions.\nI have three questions:\n\
    \ 1. From your experience, how would you assess the awareness of these patterns among senior practitioners.\
    \ Would you say the majourity of seniors are not aware."
  replies:
  - name: Mike Munn
    text: 'hi Dr Abdulrahman very happy to join the channel this week.

      1. I’d imagine that for most senior ML practitioners would be aware of the majority (if not all)
      of these patterns. Though they might not know it by the name we used. We have code for each pattern
      and use a variety of tools, some of them more recently developed than others. So even senior practitioners
      might be able to learn something new from the book.

      2. That’s a good question. I’m not sure. I imagine it would likely come from constraints either
      in their infrastructure or project timing. For example, someone may understand the importance and
      need for Continued Model Evaluation but it can be difficult to implement carefully and require too
      much overhead for the business objective.

      3. I wouldn’t say a complement book is needed, but it could certainly help. This book touches on
      patterns across the entire ML lifecycle so a book more focused on one aspect (say data engineering
      or ML pipelines) could be helpful for more  implementation details.'
- name: Dr Abdulrahman
  text: 'Second question: What drives many seniors not to follow these patterns when developing their
    ML models?'
  replies: []
- name: Dr Abdulrahman
  text: 'Third one: Would we need a complement book about data engineering (pipeline) design patterns.'
  replies: []
- name: Simon Steinkamp
  text: 'Thank you Mike Munn for taking the time answering questions here 🙂

    The idea of design patterns is actually very new to me and it was very interesting to have a quick
    look at those. Having heard the term "copy-paste" data scientist recently, I have the feeling that
    some patterns probably evolve naturally, especially through worked examples for tensorflow, keras
    or scikit-learn.

    Knowing that your book goes beyond the model fitting step, I was wondering what your opinion on these
    patterns is?'
  replies:
  - name: Mike Munn
    text: Hi Simon Steinkamp thanks for joining with questions 🙂 I’m not familiar with the term “copy-paste”
      data scientist, but I think I can guess what it’s referring to. In some sense, the ideas are similar.
      However, these design patterns are more like ways of thinking when designing solutions or building
      ML systems. This book would follow a course on how to effectively build ML model, so we don’t get
      into the weeds about those details. There are already really great books out there that address
      that. The idea of patterns is more focused on ways of thinking and recognizing common solutions
      to common problems. The solutions can’t typically be copy-pasted directly (since each case is a
      bit different) but the idea is certainly repeated.
  - name: Simon Steinkamp
    text: Great, thank you for your answer, I will have a closer look 🙂
- name: Poornima
  text: "Hi Mike Munn first of all congratulations on your book release which will help so many ML practitioners\
    \ on their professional and/or learning journey. \nLike to ask two questions:\n* What was your motivation\
    \ behind coming up with the idea of writing a book on design patterns in ML."
  replies:
  - name: Mike Munn
    text: "hi Poornima Thank you! I hope you enjoy it.\n1. The motivation came from lots of customer engagements\
      \ at Google Cloud in our roles. When designing ML systems or thinking about common ML approaches,\
      \ we saw that there were some common patterns in the field. The book attempts to collect those pattens\
      \ into a single easy to reference source. \n2. There wasn’t any monolithic use case or project but\
      \ we did try to use similar datasets throughout the book when illustrating a concept. This way,\
      \ the code solutions would be less about the data or model and more about the pattern itself."
  - name: Poornima
    text: Thank you much Mike Munn for answering. Looking forward to gain great knowledge from the book.
      Hoping to see more such excellent works from you in future. All the very best 🙂
