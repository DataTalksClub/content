- name: Shiro Kulatilake
  text: When looking at the entire ML Loop what is the org structure that works best - having the ML model
    work being done by a separate team and then integrated into the apps or having a mix of people in
    various stages of the entire loop ?
  replies:
  - name: Niall Murphy
    text: 'Hi Shiro: speaking for myself, _there is no answer to this question_. There isn’t a “best”.
      Everything, especially organizational decisions, are contextual. I will say that centralised models
      are better in concentrating expertise and improving domain performance, but can often end up being
      unresponsive to business needs. Distributed models are better at responding to the needs of the
      team, but can have staff expertise/retention/etc problems.

      Decide what your org is weak in and what needs to be fixed, then take the appropriate action…'
  - name: Cathy Chen (she/her)
    text: I would say that the major thesis of the book is that we posit that it is better if people across
      the organization know enough about ML (and not having ML be completely silo'ed). And agree there
      is no best.  Every org design has issues and is not always practical or possible. Chapter 14 covers
      some practices to think about based on what the org structure looks like.
  - name: Shiro Kulatilake
    text: Thank you for your responses !
