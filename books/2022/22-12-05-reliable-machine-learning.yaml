- name: LOIC EMO SIANI
  text: Hello Cathy Chen (she/her) A1IndiaDS Kranti Parisa todd underwood. I have a question. What are
    the tools used in the book to set up a system to proactively monitor ML models ?
  replies:
  - name: Niall Murphy
    text: 'We are deliberately “tool agnostic”. We don’t recommend any specific tools (we do mention a
      few). We focus on general principles instead.

      (This might mean we’re not a good book for you, but we think many of the principles and recommendations
      can be easily translated into whatever tools you happen to be using.)'
- name: LOIC EMO SIANI
  text: What are the relevant skills required to be a MLRE ?
  replies:
  - name: Niall Murphy
    text: 'It’s more of a mindset than a skill, as such, but if I had to pick one, I would say “systems
      thinking”. This is IMHO the largest distinction between product developers focused on features and
      … well, more or less anything else, really.

      Systems thinkers focus on the whole thing, and think deeply about the interaction between subcomponents
      of the system. We believe this aligns very well with ML, which almost by its nature is very cross-cutting/horizontal.

      In order to develop this skill, I would probably start off by looking at these books: [https://www.mostrecommendedbooks.com/lists/best-systems-thinking-books](https://www.mostrecommendedbooks.com/lists/best-systems-thinking-books)
      but if you’re looking for something more concrete I can follow up.'
- name: Michal
  text: Hello, what are the main differences between your book and Chip Huyen's Designing Machine Learning
    Systems?
  replies:
  - name: Cathy Chen (she/her)
    text: todd underwood read Chip's book 📚 so hopefully can answer this best (Niall Murphy as well?)
  - name: Niall Murphy
    text: 'Yep. In my opinion the differences are:

      - Chip focuses on model creation. We don’t really touch that at all. (And you might ask - an ML
      book NOT about model creation?? How does that make sense?? To which the answer is…)

      - We focus on “the whole system”, including the organizational, ethical, and technical components
      of what it means to have ML in your company.

      There’s plenty to learn from both and we both blurbed each other’s books, IIRC, but you might start
      reading Chip’s book first if you’re an IC (ML) engineer and you care most about making models and
      the wider context doesn’t matter to you. You might start reading our book first if you’re an IC
      engineer in DevOps, SRE, a PM/TL, manager or VP, and you care about the wider context for some reason.'
- name: Michal
  text: How many code examples does your book include? Is it primarily focused on Google Cloud / TensorFlow,
    or is it framework agnostic?
  replies:
  - name: Cathy Chen (she/her)
    text: We don't have code examples as we tried to stay agnostic of frameworks. We did have some reviewers
      from Google Cloud since three of the authors are Google employees, but that was mainly to ensure
      we didn't do anything counter to their product direction.
- name: Michal
  text: What's the difference between MLOps engineer and ML SRE?
  replies:
  - name: Cathy Chen (she/her)
    text: 'This really depends but what we are finding is that AIOps usually refers to using AI to automate
      operations and ML Ops refers to the teams or people who operate the ML system/pipelines. Our definition
      of ML SRE is aligned with that definition of ML Ops.

      Also, todd underwood was in a panel at SRECon 2021 where a variety of folks discussed OpML [https://www.usenix.org/conference/srecon21/presentation/panel-opml](https://www.usenix.org/conference/srecon21/presentation/panel-opml)'
  - name: Niall Murphy
    text: There isn’t a huge distinction IMHO, and whatever distinction exists right now, the linguistic
      meat grinder of the industry will mess up over time 🙂
  - name: Michal
    text: Thank you for your answers x3 🙂
- name: Carlos Pumar
  text: "hi! While reading thru the table of contents of your book, I wondered:\n1. *Organisational aspects*:\
    \ \n    a. assuming a firm has interest in creating internal capabilities for creating data-driven\
    \ processes (e.g. creating a team of specialists which collect data, select models, deploy and maintain\
    \ them):\n        i. what could be criteria for deciding between investing in (re-)training their\
    \ existing staff vs. hiring specialists from “outside”?\n        ii. what measures could be undertaken\
    \ to minimise the risk of people leaving and potentially creating a “hole” (in terms of knowledge\
    \ management)\n    b. assuming a firm has not yet decided between creating internal capacities, vs.\
    \ leveraging from services from third institutions (“SaaS”):\n        i. what could be criteria for\
    \ deciding between these options?\n    c. how could, in your view, one argument in favour of using\
    \ open-source libraries in a firm, towards which whose decision-makers might be skeptical to (mainly\
    \ for security issues)?\n2. *Model deployment and maintenance*:\n    a. even though I lack of practical\
    \ experience, it seems to me that “batch training” is the default methodology for training models\
    \ (as opposed to the alternative of “online training”)\n        i. if this is true: what are the main\
    \ reasons that “online training” has not established itself as much as batch, especially vis-à-vis\
    \ the risk of “data drift” (which online training systems don’t suffer of)\n        ii. what are good\
    \ practices for minimising the risk of data leakage (in the training phase) so that model performance\
    \ doesn’t get affected in production?\n3. Does your book cover aspects regarding *regulatory issues*\
    \ as to how to manage data (e.g. often financial institutions are strongly regulated by norms defined\
    \ by regulatory bodies, which limit financial institutions in their data-management decisions (e.g.\
    \ model deployment on the cloud))?\nMany thanks in advance!"
  replies:
  - name: Niall Murphy
    text: 'Cathy Chen (she/her) would probably have some ideas for a lot of this, but I’ll do what I can.

      1ai: time, throughput, and feasibility, as always. do you have a specific deadline for doing something
      which is infeasible with current staff? there’s a longer discussion that can be had here

      1aii: the best ‘conversion’ project I know of (netops folks to SREs) promised and _actually gave_
      transition/education support, had a reasonable timeframe (~18 months) and strong management support.
      in general many folks are up for expanding their capabilities as long as they’re treated well.

      1bi: the classic build-vs-buy (see e.g. [https://rootly.com/buy-vs-build](https://rootly.com/buy-vs-build))
      discussion generally ends up dividing things like this: ‘if it is core to your business or feasibly
      could become so in a reasonable time-frame, build it. otherwise buy it.’

      1c: OSS and security isn’t really my thing but see e.g. [https://www.zdnet.com/article/is-open-source-as-proprietary-software-these-tech-chiefs-think-it-is/](https://www.zdnet.com/article/is-open-source-as-proprietary-software-these-tech-chiefs-think-it-is/)
      - if this is specifically within the context of ML i would probably argue that right now the whole
      domain is so wild-west that there is no significant quality difference between enterprise software
      and startup code and OSS.

      2ai: (i call “online training” “continuous training” instead.) they are both very popular in different
      contexts, but “the large companies” have the resources to make continuous training a practical thing.
      to my mind continuous training absolutely has risk of data drift just like batch. it’s just a question
      of the periods between the batches.

      (short answer: resources IMHO)

      2aii: not sure what you mean by ‘data leakage’ - can you expand?

      3: it mentions regulation in the ethics &amp; privacy chapter, mostly in the context of motivating/illustrating
      various privacy techniques. many of the things you do in order to preserve privacy, balance training
      data, etc, also end up being the things you’d do to align with e.g. financial regulation. we don’t
      discuss financial regulation in detail. off-hand comment based on experience: many (not all) assertions
      about “oh we can’t do X because the regulator forbids it” actually is considerably more nuanced
      than that if you actually got to talk to a regulator.'
  - name: Carlos Pumar
    text: 'thank you for your detailed response Niall Murphy!

      re “data leakage”: I wonder if there are practices in order to avoid that models have access to
      information during training phase, which they would not have when tested on new, unseen data. As
      an example, you would want to combine cross-validation with pipelines (sklearn package) in order
      to avoid this leakage…

      I was just wondering if there are any other standard measures in practice which avoid the model
      from picking up information related to the labels at training time - and if your book covers (parts)
      of these measures. thx again'
  - name: Niall Murphy
    text: Partitioning training data is not an inherently difficult act, but it does require discipline
      about what you make accessible to the training process (and what you don’t). In the situation where
      leakage is a threat, I’m wondering what is the information that’s accessible that shouldn’t be?
      Are we talking about labels being accessible when they shouldn’t be, or labels being present at
      all?
  - name: Carlos Pumar
    text: 'sorry for being imprecise: I actually meant labels being accessible when they shouldn’t be,
      i.e. patterns of labels are accessible to model during training - making the model to potentially
      underperform with new data.

      I am particularly interested in understanding how to avoid this sort of leakage so that performance
      is satisfactory in production…and just curious to know if there are any “best practices” during
      the workflow prior to model deployment…thx again!'
  - name: Cathy Chen (she/her)
    text: "For 1....\nGo ahead and skim chapters on org design (13-14) because we try to give a framework\
      \ that you can use to work this out. Based on structure decisions, you need to then think about\
      \ how to accomplish the best for end-to-end product reliability by adapting process, metrics, people\
      \ mindsets, and rewards...\n1i. Depends on what you're looking to do. Often a combination of both\
      \ is a useful thing as long as you have the right mindset in mind. \n1ii. Always be training your\
      \ replacement? I like the book \"Influencer\" - there a chapter about a restaurant in SF where every\
      \ person is trained by the last person who started. Everyone eventually does tasks, trains others,\
      \ mentors others. Of course there's also the need to specialize. We specialize on projects across\
      \ regions but generally have everyone at a baseline knowledge to be able to be oncall\n1.b-c sorry\
      \ don't know \n2. Sorry not my area of expertise \n3. Not that I know of."
