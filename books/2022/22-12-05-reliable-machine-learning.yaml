archive:
- name: Cyril de Catheu
  text: 'Hey, thanks for sharing.

    How does the book relate to the [google SRE](https://sre.google/books/) books? Should I read it if
    I’ve read (and applied) those?'
  replies:
  - name: Niall Murphy
    text: 'HI Cyril - to be clear, there’s no “should” here. No requirement to read one or the other before
      anything. The books speak to each other in the sense that they come from a similar mindset, but
      they’re actually about pretty different things. (They’re not in the same grouping at the publisher,
      for example.)

      Having said the above, the Google SRE books are a good intro to questions about systems thinking
      in general, and obviously share some authors in common (though of the two, one has not been in Google
      for five years).'
  - name: Cyril de Catheu
    text: Thanks Niall Murphy!
- name: Cyril de Catheu
  text: 'I find it difficult with ML issues to understand whether an issue is related to infra, modeling,
    or data.

    Is this something discussed in the book?

    In a few words do you have strategies to approach this problem?'
  replies:
  - name: Niall Murphy
    text: Yeah, good point, that is definitely one of the challenges. We deal with this in the monitoring
      chapter, though not quite as directly as you put it there.
  - name: Cyril de Catheu
    text: Thanks Niall Murphy.
- name: Eunice
  text: Hi, Thank you very much to answer our questions. Do you see any big difference for MLRE process
    between Deep Learning and Machine Learning Projects ?
  replies:
  - name: Niall Murphy
    text: Nope. I would say it’s broadly unchanged under both methods, except to the extent you can ignore
      training data for RL processes - if you don’t have training data to manage, a bunch of complexity
      goes away.
- name: Eunice
  text: A second question, how did you get the excellent idea of writing this book?
  replies:
  - name: Niall Murphy
    text: You’re very kind! We talk about this a bit in [https://www.youtube.com/watch?v=ypt62rP3zhg](https://www.youtube.com/watch?v=ypt62rP3zhg)
      but the basic story is - there’s a lot in the MLOps world that’s a total wild-west situation right
      now, Todd in particular has some great experience that other people could benefit from, and Todd
      and I were going to write a book together anyway 😉 But then we realised the _actual_ book to write
      was one that talked about everything in ML that _wasn’t_ building a model, which includes data,
      privacy, monitoring, organizational design, etc etc. Those things don’t get talked about in the
      one book.
- name: Alexey Grigorev
  text: 'Hi everyone! Thanks for being here!

    Do you think ML reliability engineer is already an established role? Or most of the time it''s "usual"
    SREs working in ML teams?'
  replies:
  - name: Cathy Chen (she/her)
    text: "From my exposure, it is normally SRE type who have special interest in ML but usually their\
      \ expertise is in SRE topics, not ML topics. \ntodd underwood did a few talks at SREcon about this:\n\
      [https://www.usenix.org/conference/srecon22emea/presentation/underwood](https://www.usenix.org/conference/srecon22emea/presentation/underwood)\n\
      [https://www.usenix.org/conference/srecon21/presentation/underwood-sre-ml](https://www.usenix.org/conference/srecon21/presentation/underwood-sre-ml)"
  - name: Niall Murphy
    text: 'Speaking personally - I would disconnect from the job title and think about the _behaviours_.
      Are there people in your org who are concerned about the reliability of the ML stack? If so, maybe
      without realising it, they are MLREs.

      My intuition today is that there are loads of people who care about the reliability of what they’re
      doing, but very few of them have the job title MLRE. I suspect those that do, are in places with
      lots of existing SREs.

      I have no opinion about whether or not MLRE will establish itself as a job title, but I think the
      behaviour of caring about the reliability of your production stack is going to continue indefinitely.'
- name: Alexey Grigorev
  text: '&gt;  How ML, product, and production teams can communicate effectively

    Can you give a short summary?

    Also, what does each of these teams do? Why do we need 3 teams? And in which case it should be just
    one team with all these 3 functions inside the team?'
  replies:
  - name: Cathy Chen (she/her)
    text: This would really be a great one for Kranti Parisa! I'll check in with him if he's doing any
      better.
  - name: Cathy Chen (she/her)
    text: "ML engineering team could be that team who creates and trains the models. Thinking your data\
      \ scientists, with a bit of training and serving expertise. (In case you haven't read the book:\
      \ we have an imaginary online shoppe [yarnit.ai](http://yarnit.ai)  \nFor yarnit, this may be the\
      \ team who is making ml models for suggesting additional purchases on the \"view my cart\" page.\
      \ \nProduct could be the team who owns the overall product or the rest of the product. For yarnit,\
      \ the shopping cart might be part of the product team."
  - name: Cathy Chen (she/her)
    text: ML production is the team who ensues that all the training and serving infrastructure is up
      and working
  - name: Niall Murphy
    text: large company bias, of course, but yes, those functions can all totally co-exist in the same
      team. in which case the problem isn’t necessarily communication, it’s communication of value of
      the different types of work, and deciding how to allocate resources towards those types of work.
