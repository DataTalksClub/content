- name: Alexey Grigorev
  text: What are the most important SRE principles that ML projects should adopt?
  replies:
  - name: Niall Murphy
    text: 'Gosh. There’s a lot to choose from. I think… well, measuring things is important, and is an
      SRE principle, but I think model development understands that quite well.

      (Sometimes there are question marks around continuing that approach to measurement in production
      as opposed to the development cycle, but broadly speaking I think we’re covered here.)

      Maybe eliminating toil? [https://sre.google/sre-book/eliminating-toil/](https://sre.google/sre-book/eliminating-toil/)
      I suspect there’s still quite a bit of toil around a lot of what ML folks do.

      Defense in depth is another good one. Our serving and training systems can be quite brittle; putting
      some work into having algorithmic fallback can be really useful.'
