    text: Good morning!
- name: Sara Lane
  text: 'Good morning Phil Winder!

    Which industries do you see being most affected by advancements in reinforcement learning? More specifically,
    in which industries do you think it will prove the most useful and also will be open to actually implementing
    the necessary changes?'
  replies:
  - name: Phil Winder
    text: 'Hi SL,

      For reference, see page 5-7 of the book.

      “Industry” is a tricky word because it is broad and out-dated. It’s similar to asking what industry
      could make use of software. Of course, all of them could. There are opportunities everywhere.

      With that said, it’s a valid question. So far, robotics seems to be the number 1 use case. Simply
      because it’s hard to derive control programs for complex tasks. It’s easier to learn them.

      Pricing/bidding/recommendations/advertising/etc. are largely similar tasks and have also had a lot
      of press.

      The finance industry are going to be big users. I’ve spoken to people already that are using it.

      Healthcare and specifically personalised medicine is a perfect match, although the regulatory requirements
      are likely to prevent this from taking off.

      The Tech industry can leverage it to much greater extents for automation. E.g. ML, auto-ML, neural
      architecture search, etc. Lots of mundane automation like Alexa, email control, etc.

      And lots more… :smile:'
  - name: Sara Lane
    text: 'Thanks for the clear response!

      I know that all industries could technically use this technology, but I''ve seen that many businesses
      are hesitant to take on new things. Many of them live by the adage, if it ain''t broke, don''t fix
      it. So I''m curious more where you see it taking off practically, not theoretically.

      What you said about healthcare is interesting, why would regulatory requirements prevent reinforcement
      learning from improving things there?

      As far as pricing/bidding/recommendation/advertising, why is reinforcement learning superior to
      other forms of machine learning for this?

      Thanks!'
  - name: Phil Winder
    text: 'Healthcare == people’s lives. So there’s lots of rules and regulations to prevent accidents.
      This means there’s a very high barrier to entry. (I’m talking from a UK/EU perspective by the way
      :wink: - there may be fewer regulations in, say, the US for e.g.)

      Better depends on your application. Testing, experimentation and evidence will prove whether it’s
      better. But in general, any application that involves mult-step decision making could be improved
      by RL. ML makes one-shot decisions which are unlikely to be optimal in the long run.

      See page 5 in the book.'
  - name: Sara Lane
    text: 'Phil Winder I just read pages 5-7, fascinating! As you wrote, I always associated RL with robotics
      and not much else. Thanks for clarifying and I look forward to reading more.

      And I believe that you''re correct, in the USA there aren''t as many regulations for these things
      and I wonder if we will indeed see RL being used in healthcare in the coming years.'
- name: Neal Lathia
  text: ':question: Phil Winder What are your top tips for debugging RL algos?'
  replies:
  - name: Phil Winder
    text: 'Great question. Check out chapter 11 for more detail on this.

      Here’s some random thoughts off the top of my head:

      1. Visualise what is going on (like any data-related task)

      2. If you are given the environment, start with the simplest algorithm and work up (e.g. random/CEM).

      3. If you have control over the environment/simulation, make that as simple as possible and solve
      that first. Then make the environment/simulation more complex.

      4. Split the tech. If you’re working with deep models, attempt to decouple the training of the deep
      NN from the RL. Not always optimal, but makes development much easier. For example, use autoencoders,
      train the autoencoder first and verify it works. Then pass the much lower-dimensional state into
      the RL algo. It will train much faster (possibly less optimally) and it will be easier to figure
      out issues.

      5. Split the problem. Try and halve the problem. Halve it again. Solve each quarter independently.

      6. Consider hierarchical policies (similar to 5). If you can manually design the hierarchy, even
      better for understanding/explainability. But you can automate that process too.

      7. Good old debugging techniques. print’s are your friend.

      8. Assert expected array sizes

      9. Don’t overcomplicate the reward function.

      And more and more…'
  - name: Dmitry Yemelyanov
    text: 'Great answer! :thumbsup:'
- name: Jayesh Garg
  text: Are there customers already live with RL algorithms?
  replies:
  - name: Phil Winder
    text: 'Hi Jayesh. Oh if only my sales team had access to that information. :smile:

      So, there’s a variety of things that I’ve heard. Some public, some not. Let me try and recall some:

      - [Covariant AI](https://covariant.ai/) demoed a super cool RL-driven pick and place robot.

      - I’ve spoken to engineers that have used RL to improve their recommendations.

      - I’ve spoken to leaders that have deployed RL as part of a continuous-learning strategy for their
      ML models.

      - I spoke to another leader that managed to reduce the size of the ML team running their core recommendations
      algorithm by using RL.

      And there’s loads of use cases reported in the papers. But of course, whether you call that production
      or not depends on what they are doing. Many are pure research. But lots are for research on current
      production systems. For example, this one from the [YouTube team](https://rl-book.com/applications/2019_reinforcement_learning_for_slatebased_recommender_systems_a_tractable_decomposition_and_practical_methodology/),

      More on [https://rl-book.com/applications/](https://rl-book.com/applications/) and in the book.

      Of course if you know anyone that wants to develop production RL algorithms, let me know. :wink:'
