- name: Dmitry Yemelyanov
  text: 'Hello, Phil Winder! First of all, thanks for kindly agreeing to share your knowledge with us
    :muscle:

    :question: So my question is:

    Could it be possible to improve performance of RL agent doing humanoid motions by virtual demonstrations
    of a person wearing a mocap suit and what, in your opinion, would be TOP challenges in order to do
