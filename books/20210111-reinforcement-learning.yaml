- name: Ritobrata Ghosh
  text: Phil Winder, in your opinion, what factors have prevented the wide adoption of Reinforcement Learning
    in the industry as opposed to Machine Learning and to some extent, Deep Learning as academic fields
    widely adopted in the industry?
  replies:
  - name: Phil Winder
    text: 'Hi Ritobrata,

      Good question. Probably just a combination of time, media exposure, market size, processing power,
      low-hanging fruit.

      You say

      &gt; ML widely adopted in the industry.

      But statistics, and therefore ML, has existed forever. Only recently (i.e. a decade, maybe) has
      ML “taken off”. So you could argue that it took 200 years for ML to be adopted.

      RL originated around the 90''s, so wait until 2290, then ask your question again. :smile:

      So the real answer is market size and perception. It goes like this:

      IT -&gt; Software -&gt; ML -&gt; DL -&gt; RL.

      Because they are applied by/for:

      Everyone -&gt; Companies -&gt; One-shot decisions -&gt; Complex decisions -&gt; Strategic/long-term
      decisions.

      Each time you’re reducing the market size. And when you do that you are reducing media exposure.
      So it might seem like ML has been adopted and RL hasn’t, but in fact the market is just smaller.
      When normalised the perceived adoption is the same.

      With that said, I do think you’re right, it’s not been adopted yet. Mainly because there’s a lack
      of books like mine and well defined use cases. We’ll get there…'
  - name: Ritobrata Ghosh
    text: 'Thanks for the detailed answer. :slightly_smiling_face:'
- name: Leonid Kholkine
  text: Phil Winder A bit more of a generic question, but how do you see the field of RL fold out in the
    next 3-5 years?
  replies:
  - name: Phil Winder
    text: 'The correct answer to this is probably more boring than you were hoping for.

      It will expand, it will get used more. It will become easier to use and will become more obvious
      where to use it (because you can use off the shelf open-source solutions).

      Then RLOps will become a thing.

      Then people will perceive it as being “adopted”.

      Then something else will take the limelight.

      If I put my marketing hat on it would sound similar except with more hyperbole! :smile:'
- name: Timothy Wolodzko
  text: Phil Winder RL is still niche of ML, there's much less books &amp; courses on it as compared to
    general ML. Besides your book, what would you suggest for someone interested in learning it? Where
    to start? What on focus first? Moreover, I have a feeling that online you can find either trivial
    examples, or the very complicated applications like AlphaGo, with not much intermediate ones. So any
    suggestions for planning the learning journey further?
  replies:
  - name: Phil Winder
    text: 'It’s the same as anything technical IMO. There is stuff to be learnt, and you can do that by
      reading. Read all the books and papers you can.

      But the real learning experience is… experience. Do it for real. Do it in your company. Do it at
      work. Then and only then do you learn what you need to learn to do your job.

      Yeah, that’s the point. Doing your job is nothing like anybody else’s job. I could tell you to do
      certain projects but it wouldn’t make sense for your unique situation. Your first challenge is finding
      a problem that is valuable and makes sense for RL. Then work on that. Start simple. Start with software,
      then ML, then RL. Work your way up.

      What you need is a RL driven learning curriculum that delivers training that suits your unique needs.
      :smile:'
  - name: Alexey Grigorev
    text: Can one use RL to come up with the best curriculum to study it?
  - name: Alexey Grigorev
    text: 'Sounds like a good project :sweat_smile:'
  - name: Ritobrata Ghosh
    text: Timothy Wolodzko, the author has answered. I would like to add a few things. You could try University
      of Alberta's RL Specialization in Coursera, and definitely read the Sutton, Barto's book. I highly
      recommend David Silver's Lectures. There are other lectures from DeepMind as well. There's Spinning
      Up from OpenAI. You could also read Thomas Simonini's indroductory RL blogs. There's plethora of
      beginners' and intermediate stuff out there for RL, not as much as DL and ML, but enough for an
      individual to learn.
  - name: Timothy Wolodzko
    text: Ritobrata Ghosh &amp; Phil Winder thanks! I already have some of those books etc, just wanted
      to learn if there's anything more I should look for.
  - name: Vladimir Finkelshtein
    text: I think one obstacle for learning is the lack of plug and play libraries like for more classical
      ML. Even with openai.gym, some of the recent books have code that doesn’t compile, because the libraries
      are still being developed and change too often. It is certainly an obstacle for people who are less
      experienced in programming.
  - name: Phil Winder
    text: 'Hi Vladimir Finkelshtein,

      Although I have seen people/companies try to do data science without software experience/capabilities,
      I would recommend that gaining software engineering experience is as important as ML/RL experience.

      Software is the language of applications, so if you want to build useable ML/RL, you need software.
      Of course this doesn’t apply to everything. E.g. you can just about get by with hosted tools for
      an analytics project and larger companies can hire multiple people with different skils (this is
      the general solution, by the way). But sooner or later you’ll need to code :slightly_smiling_face:

      I have sympathy for your despair, however. I think the main issue is the complexity. Any complex
      system has a million ways to fail and it sounds like you’ve found most of them. :slightly_smiling_face:'
- name: Ashutosh Sanzgiri
  text: Phil Winder Do you think that the field needs a new name or branding? Maybe the word "reinforcement"
    is not catchy enough or does not have the right connotations? Also when do you think we will start
    seeing "self-help" apps (weight loss etc.) that claim to be powered by RL?
  replies:
  - name: Phil Winder
    text: 'Not necessarily a new name, no. But I would like to see RL become more mainstream in the ML
      toolbox.

      I’d like to be at the point where people say (at the most general level) “we’re working on a data
      project and we might need to dip into our toolbox, rummage around, and we might need to pick RL
      for the job”.'
  - name: Phil Winder
    text: 'And the term RL represents quite a small spectrum of techniques. You could use the words for
      all the sub-techniques too if you want to be more specific (e.g. imitation RL, inverse RL, curriculum
      RL, etc. etc.).

      “Claims” are powered by marketing/advertising. So that’s entirely powered by marketing.

      I’d suspect at some point someone in marketing will hear the term, go “oh that’s cool, is that like
      AI?” and then they’ll run with it. “The first app to use RL…”

      Then there will be a domino effect, then users will get confused annoyed, and then people will stop
      using it again and move on to the next thing.

      This is why I tend to try to avoid predicting marketing hype cycles. They are so fickle. The core
      technologies and concepts are useful in certain applications and that is why it will stick around
      for a long time.'
- name: George Melvin
  text: 'Phil Winder Hi Phil, Pavlov’s famous experiments (:bell:) are a great example of reinforcement
    learning for non-machines. I’m interested to know: do you foresee any interplay between reinforcement
    learning for biological/machine entities in the future? e.g. do you expect to see research insights
    from (machine) reinforcement learning having application in psychology, and vice-versa?'
  replies:
  - name: Phil Winder
    text: 'Great question. I think the answer depends on how deep you want to go.

      At a superficial level, yes, definitely, health apps in particular. RL driven, personalised nudges
      to help you loose weight, get fit, learn a new subjects, etc. are an obvious use case.

      At a slightly deeper level, the introduction of RL in core front-line healthcare, like personalised
      medicine, shows strong signs.

      But at the full-on I’ve-had-too-many-beers-deep level, you could imagine RL providing “life” strategies.
      Like a personalised, optimal route to getting a job that you want. Or “automated relationships”.

      Haha. I need that. Imagine not having to remember anniversaries, the perfect present automatically
      ordered.'
  - name: Phil Winder
    text: 'And in pshychological wellness. Yes, definitely.

      “Hi Dave, you look sad Dave.”'
