    text: ':100: yes. This is a perfect example where Behaviour cloning/Imitation RL will be useful. In
      fact, this reminds me of a paper that I read a while ago… Here: [https://bair.berkeley.edu/blog/2020/04/03/laikago/](https://bair.berkeley.edu/blog/2020/04/03/laikago/)

      Gif for example. 1) Motion capture, 2) no IRL, 3) with IRL.'
- name: Alexey Grigorev
  text: Apart from multi-armed bandits, what are the other RL techniques that are getting wide adoption
    in the industry?
  replies:
  - name: Phil Winder
    text: 'Good question but it’s hard to obtain any real numbers on this. From my research/reading, most
      people tend to follow the media. If a particular algorithm gets media attention then it’s then quite
      popular in the frameworks which then leads to adpotion.

      In general though, the tried and tested, simple models tend to remain the most popular. From basic
      Q-learning based algorithms, to simple policy gradient algorithms like SAC.

      There’s no one-size fits all “best algo” though, like in ML, the “no free lunch” theorem. So you
      have to evaluate and experiment for your particular application.'
