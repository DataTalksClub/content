- name: Rishabh Bhargava
  text: Phil Winder what are the most common use cases in industry where problems are framed as supervised
    learning (or ranking) problems, but you would reframe them as RL problems? what would be the evidence
    you would give such teams?
  replies:
  - name: Phil Winder
    text: 'Hi Rishabh. Really great question and one that deserves a much more comprehensive and evidence-based
      answer.

      But, if I had to try and fit it in a chat window….

      I’d summarise the dilemma by reminding you of the Markov Decision Process (MDP - page 35 of the
      book).

      If you have an environment that has state that can be mutated, if it can be observed, if you can
      alter the state through your agent’s actions, and if you have a business problem that where it pays
      to move the environment into a certain state, then by definition you have an RL problem.

      To the first part of your question, common use cases masquerading as supervised ML…

      Any recommendations task. I think that’s broad enough for you! I would suggest that the vast majority
      of cases where people use recommendations are optimising for the wrong thing. The goal is to help
      the user find things as easily as possible so that they value the functionality and keep coming
      back/buying unnecessary plastic stuff.

      A standard solution (I’m grossly simplifying here) would build a model, in a supervised manner,
      that maps user intent to products, quantified by click through rate or something.

      That’s entirely the wrong metric. You could use RL and train over full customer lifecycles. You
      could train on raw profit. Or the amount of time individual users spend on the site. Or whatever
      is most applicable for your problem.

      So the action is the recommendation (lots of research available on this). The environment is user
      and possibly the business/products. The observation is the product catalogue, user demographics,
      past history, information, the weather, etc. The reward is customer lifetime value or whatever.

      Look up any of the RL recommendations papers for an academic argument as to why RL is better suited.'
  - name: Rishabh Bhargava
    text: 'Thanks for the great answer.

      On the topic of recommender systems: if the metric that is being optimized might be off, do you
      think this is more down to Product Managers not setting the metrics correctly or ML engineers choosing
      to solve for the simpler problem (even though it might not be the right formulation)? Given that
      this is such a technical domain, who should be pushing for RL adoption?'
  - name: Phil Winder
    text: 'Like most things in life, I suspect there’s no easy or right answer. I’m no expert in management,
      but I think POs or PMs should be steering product development, but decisions should be agreed/discussed
      as a team. Ideas, solutions, metrics, everything, have to be defined by “the team” because no one
      person can know everything and get everything right.

      I have the same argument with people that have the word “architect” in their title. :wink:'
- name: Ashutosh Sanzgiri
  text: Hi Phil Winder - I am curious as to why RL techniques are not widely used as a means to improve
    on supervised learning problems - by this I mean both in model training (hyperparameter optimization,
    architecture search, ensembling models etc.) and in model deployment (measuring model drift, correcting
    for it etc.)
  replies:
  - name: Phil Winder
    text: '&gt;  why RL techniques are not widely used as a means to improve on supervised learning problems

      Why? I guess it’s some complex combination of attention, media, ease of use, advice, reading, media
      and something with the word OpenAI or Google in the name. :smile:

      I mean, it’s there, it’s possible. Maybe it’s just waiting for someone to wrap it or market it better
      than the last person? Hint hint, nudge nudge. If you have a spare 6 months on your hands. :slightly_smiling_face:

      To be fair there are things out there already. For example I’ve used Optuna for hyperparameter optimisation,
      which has an RL solution in there.

      But they’re not selling the fact that it’s using RL. They’re selling the fact that it automatically
      does hyperparameter tuning for you.

      Same with Kubeflow’s Katib. That has an RL mode too.

      That’s the thing about engineering in general. People don’t care how the sausage is made. It’s the
      product that counts. And it’s why UI engineers take all the glory!'
- name: A McCauley
  text: "Hi Phil Winder , congratulations on the book! I have a question on the topic. \nIs reinforcement\
    \ learning considered a crucial approach in robotics (or do you have an opinion on its use for this)?\n\
    With a robot learning behaviours through ‘trial and error’ of their interactions. It seems like RL\
    \ would have many advantages which ML just couldn’t solve in this case - becoming useful with dynamically\
    \ changing constrains, or environments, they would experience. "
  replies:
  - name: Phil Winder
    text: 'Hi A,

      Crucial. Hmmm. Depends on how you define the word. I wouldn’t say it’s CRUCIAL, in capital letters,
      no. You can create perfectly adaquate solutions using simple stuff like PID controllers and inverse
      kinematics.

      The threshold is complexity. Once you need to do something remotely complex, like more complex than
      just “move to coordinates x,y” or as soon as it involves a non-trivial number of interacting components,
      then yes, RL is probably necessary.

      But I think that’s missing the point slightly. The great thing about RL is the interface. The MDP.
      It’s a way of defining problems, not solutions. And it can be applied to any project, simple or
      complex. If the interface is the same then you can use the same processes, the same techniques to
      solve a wide variety of problems. It scales from simple to mind-bendingly complex, very few ML techniques
      and say the same.

      For example, if you worked for a robotics company and you sold a bomb-disposal robot and a floor-cleaning
      robot, you’d have to develop completely different architectures, systems, code, solutions, etc.
      But if you’re using RL, it’s the same. Define the environment, define what you’re trying to do,
      try lots of actions and learn which ones maximise the reward.

      Sorry, rambling a bit. But yes, I think we’re on the same page!'
- name: Alexey Grigorev
  text: 'Phil Winder you mentioned in a thread that RL was used for "reducing the size of the ML team
    running their core recommendations algorithm".

    I''m curious to learn more about it. If it''s possible, can you give more details about this case?
    How did they actually do it?

    And another question - when RL will replace all the data scientists? :sweat_smile:'
  replies:
  - name: Phil Winder
    text: 'Haha. Thanks Alexey. I knew someone would pick up on that.

      This is not another clickbait “we all won’t have jobs next year”. :smile:

      No I can’t I’m afraid, it’s not public knowledge.

      To summarise, consider:

      a) a team of 10+ highly educated, very expensive smart people tweaking neural network architectures
      and running massive expensive experiments (for example). This is what large tech companies do to
      solve heavily used, data-intensive systems.

      vs.

      b) an RL algorithm, with a decent reward function, that trains itself over the long term, to solve
      the actual business metric that the business is keen on improving.

      RL can easily match and with effort surpass the performance of that team quite quickly.

      To be clear, the engineering challenge doesn’t go away, it shifts. Now these people are curators.
      Guardians of the RL algorithm that is actually doing the number crunching. There’s still a lot of
      engineering work that goes into building a system like that, but it’s not pure data science any
      more.

      I’m being intentionally vague and speculative here, but you can see it happening.

      edited for clarity.'
  - name: Alexey Grigorev
    text: Makes sense. I like the "guardian" metaphor! Thank you
- name: Alexey Grigorev
  text: 'Good morning!

    Phil Winder you mentioned that "the engineering challenge doesn’t go away, it shifts".

    I''m curious to learn about these engineering challenges that come with training and deploying RL
    algorithms. How are they different from "classical" ML and DL models? What are the typical tools for
    training and deploying?'
  replies:
  - name: Phil Winder
    text: 'Morning Alexey.

      First, bear in mind that there isn’t much industrial experience of running RL in production, yet.
      It’s not like ML, where there’s now years worth or experience to leverage. But I can speculate.

      One of the key issues with RL is state. By definition the MDP loop is constantly evolving. New observations,
      new models, new actions. In particular, if you’re running an algorithm which is actively learning
      (most, but not all implementations), which means that the underlying state of the model (the trained
      parameters) are changing ALL the time.

      One of the definitions of “modern” software is immutability and software that is free of side effects.
      By definition, an actively learning RL algorithm is mutable and most definitely has side effects!

      So over the next few years I predict that there is going to be industrial research (i.e. new frameworks/blog
      posts/presentations/etc.) into how to run mutable RL algorithms in a robust way. I imagine that
      under the hood there will be a strategy to do some kind of checkpointing to make it pseudo-immutable.

      On the training side, there’s loads. I can’t keep up. I did a review a long time ago and I’ve been
      meaning to update it (here: [https://rl-book.com/rl-frameworks/](https://rl-book.com/rl-frameworks/)).
      Take your pick.

      On the deployment side, less so. Many of the frameworks above have some kind of serving mode, but
      I get the impression that most people have to roll their own serving infrastructure and tooling.'
  - name: Alexey Grigorev
    text: Thank you! Looking forward to seeing how this field develops
- name: Ritobrata Ghosh
  text: Phil Winder, can this book be treated as a primary textbook of Reinforcement Learning or a reference
    book for studying Reinforcement Learning?
  replies:
  - name: Phil Winder
    text: 'Hi Ritobrata,

      Sorry I don’t quite understand your question. Can you explain what you are looking for?

      I wrote this book from an industrial perspective. It contains more “advice” that you would expect
      from an academic reference. It also contains less mathematics than you would expect from academia.

      My goal was to try and be a bridge between the industrial, software-driven world and academic research.'
  - name: Samuel O. Alfred
    text: Phil Winder  I actually like this question. I have read the popular reinforcement learning book
      by Bartto and Sutton. I don't have access to your book. So, is your book an extension or looking
      at things from a different perspective with the same underlying principles?
  - name: Phil Winder
    text: 'Yes, the underlying principals are the same. We’re both talking about RL in the context of
      the MDP and build up from there.

      My book is far more focussed towards industry. I cover more modern algorithms and talk a LOT more
      about how to do RL in industry. Sutton/Barto’s book is more formal, has a lot more maths, talks
      less about industrial concerns. In short, Sutton/Barto’s is a textbook. Mine is an O’Reilly book.
      :slightly_smiling_face:'
  - name: Phil Winder
    text: 'Sutton/Barto’s book is excellent for what it is, by the way. I recommend getting both. :smile:'
  - name: Phil Winder
    text: 'You can find more info on the main page of the website: [https://rl-book.com/](https://rl-book.com/)

      I might add some pages from the preface there too, to answer this question outright.

      Thanks!'
  - name: Ritobrata Ghosh
    text: Phil Winder, thanks for the reply. Appreciate it.  Look forward to reading your book. I suggest
      Sutton and Barto's book to everyone who asks me. Many came back to me looking for an alternative.
      While not a substitute, Thomas Simonini's tutorials do offer a different attempt in learning RL.
      So I was asking you if learners could read your book to gain a fair level of knowledge in RL before
      eventually graduating towards Sutton and Barto.
  - name: Phil Winder
    text: 'Yeah I’d agree with that. Most engineers in industry are probably going struggle a bit with
      sutton’s because it’s too academic. So yes, I’d definitely recommend reading mine first. :blush:'
  - name: Ritobrata Ghosh
    text: Phil Winder Yes, you are right. Even with my background in Physics, I found Deep Learning textbooks
      such as Goodfellow's to be easier to read than Sutton, Barto's book. I have my answer, thanks. Look
      forward to reading this book!
- name: Leonid Kholkine
  text: 'Hello Phil Winder!

    Happy to see a book more focused on the industry. I know that more and more companies are exploring
    the application of RL, but, at least in Portugal, it is still in a very embryonary stage. I''m wondering
    how do you see the adaption of RL by the industry?'
  replies:
  - name: Phil Winder
    text: 'Hi Leonid,

      Like you said, nascent at this point. But it is moving. I don’t think it will be anywhere as big
      as the generic ML/analytics industry, which in turn isn’t as big as the software industry.

      But as you probably know already, these are just tools in your tool belt. The trick is to pick the
      right tool for the job.

      In terms of adoption, I think it’s being adopted already. It’s just a matter of size. I think it
      will cascade as more “normal” use cases come into popular industrial culture. And as frameworks/libraries
      start to offer easy to use and robust RL serving, natively.

      In short, we’re fighting against low-hanging fruit here. Quite often something very simple is good
      enough and/or better than nothing. It takes quite a lot to jump up through the hoops of full ML
      to full RL.

      This probably means that it’s going to be larger companies that adopt first. Smaller ones (at least
      in the non-tech industry) will probably have to wait.'
  - name: Phil Winder
    text: Yeah, to be clear, I see RL taking a slice of the ML industry. So RL depends on the underlying
      size of the ML and software industries.
  - name: Leonid Kholkine
    text: 'That leads me to another thought, will there be then more out of the box tools as it happens
      now more and more with ML?

      I think that also might shorten this gap'
- name: Leonid Kholkine
  text: 'And a more interesting question for me, it''s how do you see RL being applied besides the classical
    cases such as recommender systems, Auto ML, finances, robotics, etc... :slightly_smiling_face:'
  replies:
  - name: Phil Winder
    text: 'Hi again Leonid,

      I’m afraid I’m going to have to resort to: `${insert any use case here}`. :smile:

      Sorry, I couldn’t help it. :stuck_out_tongue:  It has a very broad applicability. In fact, you could
      technically use it anywhere you currently use ML. Although it may not technically be more performance.
      But it many cases it could be.

      I’ve been trying to collate use cases here ([https://rl-book.com/applications/](https://rl-book.com/applications/)).
      There’s lots already, but I’m already well out of date.

      Check out some of the other answers here too: [https://rl-book.com/learn/faq/frequently_asked_questions/](https://rl-book.com/learn/faq/frequently_asked_questions/)

      Apologies for the generic answer but the real answer is really broad.'
  - name: Leonid Kholkine
    text: 'That''s a perfect answer, I did miss those use cases :slightly_smiling_face:'
- name: Alexey Grigorev
  text: 'Good morning!

    Phil Winder I know you also have a lot of interest in MLOps. Is there any connection between it and
    RL in your work?'
  replies:
  - name: Phil Winder
    text: 'Great question.

      You’re right. I am very interested and we’ve gained a lot of experience delivering MLOps projects.

      The connection to RL is the operational part. RLOps, if you will. Just like in ML, data scientists
      probably aren’t that interested in spending massive amounts of time messing about with infra/tooling.
      They’re job and responsibility is extracting value from data, not building supporting infra.

      The same is true in RL too. The value is delivering the algorithm that optimises the business metric.
      The Ops part is irrelevant. The business doesn’t care how it happens, just that it does.

      But the business certainly does care how long it takes and whether it is operationally viable. They’d
      be the first to complain if it breaks.

      So there is value in the supporting tech/infra, but it’s not directly tied to the business objective.
      The value is “making it easier for other people to do their job”.

      Since RL is hard to do well, and very difficult to operationalise/productionise, RLOps certianly
      has a very important role to play.'
  - name: Alexey Grigorev
    text: Great, thank you! Excited to see how "RLOps" is going to develop
