- name: Oleg Polivin
  text: "Hi David Sweet\nThanks a lot for the opportunity to ask you a question!\nShall a data scientist\
    \ know A/B testing well? \nHere is my reflection/speculation:\nI'm working as a data scientist for\
    \ some time now, and I didn't have to use A/B testing so far. I know some basics, but surely there\
    \ is much more to applying A/B tests in production. It looks like it is a must for \"data analyst\"\
    \ positions. And I feel uncomfortable about this because:\n- I would speculate that A/B testing itself\
    \ brings more value to a company than a bunch of data scientists.\n- I do not have that knowledge\
    \ =&gt; am I/will be still relevant to the industry?"
  replies:
  - name: Eimhear Rainey
    text: Great question Oleg. I'm a data analyst venturing out into the word of unit testing and wondering
      if A/B testing is something I should be learning.
  - name: David Sweet
    text: 'A/B testing — and related methods — help you translate your data science work into concrete,
      business terms.

      For example: You might design a new feature and find that it reduces a model’s RMSE by .1%.  Is
      that good? How good? Would your boss care if s/he’s not a data scientist? Would a shareholder care?

      The question you need to answer is: How much impact does your new feature have on the business?  How
      much extra revenue can the business generate by using your new feature? How much more do users enjoy
      the product with your new feature?

      You answer questions like that by running an A/B test comparing the original model (without your
      feature, version A) to the new model (with your feature, version B). You run that test on the production
      system — the web site or mobile app or whatever — and measure the business impact directly.

      You could think of it this way: When you write a self-assessment at the end of a quarter or year,
      would you rather write, “I improved RMSE by .1%” or “I added $XX million/year to the bottom line”?'
  - name: Oleg Polivin
    text: David thank you for this detailed answer, it is great!
- name: Oleg Polivin
  text: 'And a somewhat related question.

    Would it be correct to say that A/B testing is mostly used in e-commerce, advertising industries,
    and, more generally, where some kind of recommendations are involved?

    That would explain my lack of knowledge of A/B tests since I have not worked in those industries.'
  replies:
  - name: David Sweet
    text: 'Yes, A/B testing and related experimental methods are used in advertising and on recommender
      systems. They are used to improve web sites, web and mobile applications (think Google, Facebook,
      Instagram, Twitter, Spotify, Amazon, Uber, Apple products, and so on) and on trading systems.

      In medicine, A/B tests are called random controlled trials (RCT), and are used to test the efficacy
      of new medications and other types of treatments. Anywhere you see “Six Sigma”, “process improvement”,
      etc. you’ll find A/B tests and related experimental methods. And, of course, you’ll find experiments
      in the sciences.

      A/B tests may be applied anywhere you need to make a comparison in the face of complexity and uncertainty.'
  - name: Oleg Polivin
    text: 'I have some experience in running experiments in Economics, but we never had to use multi-armed
      bandits and we didn’t call it A/B testing, rather RCTs as well.

      It also seems to me that organizing A/B tests in industrial setting is more complicated.

      Thanks a lot!'
- name: Alexey Grigorev
  text: 'How much statistics do you think data scientists and analysts need for running A/B tests?

    It feels that data scientists are not always good with stats and focus more on ML.'
  replies:
  - name: Alexey Grigorev
    text: And often experimentation platforms take care of things like calculating the sample size. But
      do we need to understand how these things work to be able to use them properly?
- name: Tim Becker
  text: Hi David Sweet, really interesting book! When I went through the introduction, I was wondering
    what the biggest pitfalls are when evaluating models? What kind of mistakes are frequently made when
    doing the final test in production. Also, when evaluating financial models, e.g. for stock trading,
    isn't there a lot of randomness involved? How can we be sure about selecting the better model for
    the future? Extending the period over which we compare both models?
  replies:
  - name: David Sweet
    text: 'A mistake that is common, has a big impact, and is easy to avoid is early stopping. If your
      A/B test design says “run for 10 days”, and you stop before 10 days because the t statistic looks
      good, you’ve made the mistake of early stopping.  The t statistic itself is noisy and takes time
      to settle down, so you really need to wait it out.

      When you design an A/B test you’ll, in part, try to limit your false positive* rate to 5%. Early
      stopping can easily make that rate much higher (like 50% or 75% or more).

      *A “false positive” is when you think B looks better than A, but, in fact, it’s not.

      ---

      There is, indeed, a lot of randomness involve in financial models. It’s common to run an experiment
      on high-frequency strategies or execution strategies (which also run on high-frequency data) in
      1 week - 1 month, depending on the specifics of the system.'
  - name: Tim Becker
    text: David Sweet thank you for answering my questions. It is a quite challenging and interesting
      topic.
- name: Mansi Parikh
  text: 'Hi, David! It''s nice of you to do this - thank you!

    When easy-to-get large sample sizes generally cause most tests to be significant when means or proportions
    are actually only slightly different, what do you do? Do you have to look into other parts of the
    output, such Cohen''s D, to put the test in perspective?'
  replies:
  - name: David Sweet
    text: 'If you have very large sample sizes, then you are fortunate. You’ll have very small standard
      errors of your measurements of your business metric and can, thus, precisely measure the difference
      in business metric between versions A and B of your system.

      The question that remains is: How big of a difference you care about?  The answer to this question
      is specific to your system. For example, if “version B” of an ad serving system produced $1,000/day
      more than version A, would you care? It depends. If your company is a small startup that just started
      serving ads and has little revenue then, yes! You need that $1k/day.

      But if you work at Google, where ads produce $150B/year (I think), maybe you’d have to consider
      whether $1k/day extra is worth the effort it takes to modify the code and the risk (however small)
      of making a change to the system.

      I like to think of this as the question of “practical significance” to differentiate it from statistical
      significance. Statistical significance tells you how much to believe the measurement. Practical
      significance tells you how much to care (from a business perspective) about the the value you measured.'
- name: Mansi Parikh
  text: Also, whenever you are cautious about your new variant possibly performing poorly compared to
    your control, wouldn't you always go with a split that allocates less traffic/money/etc towards the
    variant being tested? [https://geoffruddock.com/run-ab-test-with-unequal-sample-size/](https://geoffruddock.com/run-ab-test-with-unequal-sample-size/)
  replies:
  - name: David Sweet
    text: 'Yes.

      Generally, it’s a good idea to start very small. With a small size running you can detect bugs in
      the new code, bugs in the measurement tooling, and very large, adverse changes in your metrics.
      Then you can scale up to the full testing size.  Even that doesn’t necessarily need to be very large.
      Like you said, you might want to keep it small for safety’s sake.

      The tradeoff to keep in mind might be that small sizes will take more hours (or days) to run to
      completion.'
- name: Mansi Parikh
  text: In most cases, we are running experiments with multifactorial designs. Is it appropriate to still
    compare all treatments to a common single control (T1 vs C, T2 vs C, T3 vs C...) or perhaps create
    many different single treatment + control cuts (T1 vs not T1, T2 vs not T2, T3 vs not T3...) and use
    basic statistical hypothesis testing or should we graduate to something more sophisticated like an
    ANOVA (though to derive meaning out of those, we'll typically run Tukey paired tests anyway)?
  replies:
  - name: David Sweet
    text: You can compare all of the treatments to a common control, but you’ll need to use a Bonferroni
      correction (or some other family-wise approach, if I understand correctly, is what you’re accounting
      for with the Tukey paired tests) to get the right p values.
- name: Kyle Shannon
  text: ❓ Hey David Sweet, how do you handle evaluating multiple tests at once that could have interference
    with each other? Perfect world is to isolate, but that rarely happens. I was wondering if you have
    learned any tips or used any frameworks you liked
  replies:
  - name: David Sweet
    text: 'This is a tough one. My knee-jerk reaction is to suggest finding a way to decouple them. 🙂
      For example, if you have a version A and version B of a web app, each day (or each hour, or whatever)
      you could flip coin and say, “heads we run A, tails we run B”. It’ll be lower precision that running
      simultaneously, but at least they won’t interfere.

      But if interference is unavoidable, I don’t have a good answer. Perhaps you could find a way to
      model the interference.  I’m picturing something akin to “y ~ chi_A + chi_B + chi_AB” where y is
      your business metric and the chi’s are indicator variables. If you could fit a model of (roughly)
      that sort to your measurements, then maybe you could separate the effects of A and B from the effect
      of the interaction.'
  - name: Kyle Shannon
    text: Thank you for the response, haven't done much with modeling for interference that's interesting.
      Gotta love the ol coin flip 🙂
- name: Hironori Sakai
  text: Hello David Sweet, I have a question about the early stopping. In an ordinary (frequentist) A/B
    test, we compute the (minimal) number of observations of the groups for the experiment for the stopping
    condition in advance. How can we determine such a number in a Bayesian A/B test?
  replies:
  - name: David Sweet
    text: "In the Bayesian approach — aka., multi-armed bandits — you don’t.\nWhen you design an A/B test\
      \ you place two constraints on your measurement: (i) the false positive rate is limited (usually\
      \ to 5%), and (ii) the false negative rate is limited (usually to 20%). You calculate the minimum\
      \ number of observations needed to satisfy those constraints, given that there is variation (error)\
      \ in your measurement.\nBandit methods optimize for business-metric impact. Bandit methods will\
      \ monitor the business metrics and their standard errors for A and B and allocate more observations\
      \ to A or B as needed to capitalize on business metric and/or decrease the standard error. \nBandit\
      \ methods will likely lead to higher false positive &amp; false negative rates — especially when\
      \ the business metric performance of A &amp; B are similar.  But the more similar they are, the\
      \ less you care about telling them apart (if business metric maximization is your goal)."
- name: Kyle Shannon
  text: ❓ Do you have any suggestions of frameworks, tools or resources for  working with stakeholders
    to help them better plan out their A/B tests?
  replies:
  - name: David Sweet
    text: Names that come to mind are Optimizely and VWO, but I have not used them personally. A/B testing
      is a big space, so you’ll find many other commercial and open source tools.
  - name: Kyle Shannon
    text: Cheers, thanks!
  - name: Kyle Shannon
    text: We're using a homegrown and looking to get something more managed currently checking out optimizely
