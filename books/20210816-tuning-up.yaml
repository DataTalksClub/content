- name: Eric Sims
  text: Ahhh! I need this book in my life! 😅 My co-worker and I have been breaking our brains over A/B
    testing this week.
  replies:
  - name: David Sweet
    text: 'Re: peeking

      It’s terrible! Resist it! It can send your false positive rate through the roof.

      Now, simply *looking* at the t stats and measurements, of course, won’t cause any problems. In fact,
      you should watch to make sure that something isn’t going very wrong. After all, you’re testing something
      new. It could have an adverse effect on your metrics.

      The problem is really if you say: “The t statistic is high, and the B version looks better, so I’ll
      stop now and switch over to B.”  Had you waited, the t stat might have come back down, and you might
      not have been so excited about the B version and just stuck with A.  That’s how you drive your false
      positive rate up.  That’s why you need to wait.'
  - name: Eric Sims
    text: Thank you!
- name: Eric Sims
  text: What is your opinion on 'peeking'? Is it terrible? Or is it something that people are going to
    do no matter what so you try not to lose sleep over it?
  replies: []
- name: Eric Sims
  text: Do you have any good analogies/examples to help people understand why ending a test when they
    see what they want is not a good idea?  ...asking for a friend 🙂
  replies: []
- name: Lavanya M K
  text: David Sweet what does "tuning up" in the book title mean🙂? Is it tuning abtest system or optimising
    the business metrics?
  replies:
  - name: David Sweet
    text: I’m using “tuning” to refer to the optimizing the business metrics. (Like setting the tuning
