- name: WingCode
  text: 'Hi David Sweet, nice to meet you!

    Should A/B test users selected randomly or should we select them based on specific attributes?'
  replies:
  - name: David Sweet
    text: 'Short answer: randomly.

      Long answer: Selecting based on specific attributes can improve the precision of a measurement.
      This is a technique called *blocking*.

      Let’s say you’re running an A/B test. You have two versions of an application, A and B, that you
      want to compare. You’ll measure “time spent on the app” for each.

      The attribute you know about your users is their age: They’re either “over 25" or “25 or younger”.  The
      “over 25" crowd generally spends less time on the app.

      If you assign users completely randomly to version A or B you might, by chance, have more “over
      25” users seeing version A.  These extra “over 25" users would bias downward the measurement of
      time spent — but you’d attribute that bias to version A. If you were to rerun the experiment you
      might, this time, assign more “over 25” users to version B. In that case you’d attribute to the
      bias to version B.

      So sometimes the age attribute makes your measurement biased towards A and sometimes towards B.
      On average, it’s unbiased, thanks to randomization.

      Unfortunately, there’s variability from run to run. You can mitigate that by assigning the same
      number of over-25 users to A as to B and

      the same number of 25-or-younger users to A as to B. Then age-related variability will disappear.

      That being said, when you select users from the over-25 group, you should select them randomly,
      and the same goes for the under-25 group.  That way your experiment is still unbiased to all of
      the other factors that might affect time spent.'
  - name: WingCode
    text: Thank you for the super detailed awesome answer David 🙂
- name: Denis L.
  text: 'Hi David Sweet! Thanks for doing this.

    Bayesian techniques require specific likelihood function assumptions. From your experience, how often
    do you think these assumptions are violated by end-users and how robust are Bayesian methods under
    misspecification of likelihood (or prior)?

    To give a concrete example - if we run Bayesian A/B test analysis on a metric following what we think
    Poisson distribution, however upon closer inspection it violates some assumptions of the Poisson (but
    we model it as Poisson regardless).'
  replies:
  - name: David Sweet
    text: 'The Bayesian method I discuss in the book uses a non-parametric method call Gaussian process
      regression (GPR) to model what’s called the *surrogate function*, the function that maps system
      parameters to a business objective. For example, you might serve ads based on a prediction of click-through-rate
      (CTR) with a rule that says, “If the predicted CTR &lt; _threshold_ don’t show the ad.”  The parameter
      _threshold_ affected how much ad revenue (the business metric) you earn per day.

      You could use GPR to model the function mapping _threshold_ to daily ad revenue making (essentially)
      no assumptions about the shape of the function.

      Once you have that surrogate model, you can ask it, “Which value of _threshold_ would give me the
      largest daily ad revenue?”'
  - name: Denis L.
    text: Thanks for the answer!
- name: Bayram Kapti
  text: "Thank you David Sweet! \nIt’s easier to calculate the statistical significance of an uplift in\
    \ the test group’s performance against the success metric(s) during an AB test when the success metric\
    \ is a rate -&gt; such as CTR. \nHowever, I find it challenging to measure increased performance after\
    \ a change in the product. Example Hypothesis: If I add this new feature to my app, It will increase\
    \ the duration on the app."
  replies: []
- name: Bayram Kapti
  text: A follow up question to above, what are the best practices to come up with “X % increase” in the
    hypothesis statement. This varies for industry or the metric itself, but is there a methodology to
    come up with The X percent in the hypothesis statements?
  replies:
  - name: WingCode
    text: 'I would probably like to add onto the question 🙂

      Is there some technique to predict the “X % increase” even before running the experiment?'
  - name: David Sweet
    text: 'Generally speaking, we’ll hypothesize “no change in the metric”. This is called the null hypothesis.
      The A/B test will measure the change in the metric and, potentially, reject the null hypothesis.

      The good news is that you don’t have to guess, beforehand, by how much the metric will change to
      run an A/B test.

      You do need to know the level of variability (the standard deviation) of the metric, however.  Usually
      you can estimate that number from existing data. For example, if your metric were time spent by
      a user during a session, you could look at existing logs of users sessions and compute the standard
      deviation of the time spent.

      That being said, it would be nice to have a prediction of the A/B test result beforehand. If the
      prediction said, “This new feature probably won’t change time spent by enough for anyone to care”,
      then you could avoid running the A/B test altogether.

      One can sometimes  use a domain-specific simulation of the system to make such a prediction. In
      quantitative trading, for example, it is common to run a trading simulation (aka, a backtest) to
      estimate the profitability of a trading strategy before deploying it. Simulations are sometimes
      used by ad-serving systems, recommender systems, and others, too.'
  - name: Bayram Kapti
    text: "Appreciate the answer David Sweet! \nWhen you have seasonality in your users behavior, I guess\
      \ than you could intentionally only look at the variance for relavant season. \nImagine an e-commerce\
      \ store having higher durations during Christmas &amp; Holidays season when compared to Summer.\
      \ In this case, would it makes sense to include Summer data to calculate variance for an AB test\
      \ during Christmas time?"
  - name: David Sweet
    text: 'Yes.

      The goal is really to predict the variance that will be realized during the experiment. Using (in
      your variance calculation) only data expected to be similar to the data you will collect during
      the experiment would achieve that goal.'
- name: Wendy Mak
  text: hi David, would you use an 'off the shelf' system to run your A/B tests, and at what point would
    you decide that it's better to build your own?
  replies:
  - name: David Sweet
    text: 'Sure. I would look at it like any other build-vs-buy decision. Does the product do what you
      need? Is the price right? (Does the do *more* than you need? If so maybe you’re paying for features
      you won’t use.)

      I think it would be useful to initially run A/B tests in the lowest-effort way possible — whether
      that’s with a web-based tool or some simple manual calculations in Jupyter. You’ll learn about the
      details that are specific to your system (ex., deploying “B” versions, logging measurements) and
      get a sense for the value a piece of commercial software could provide.'
- name: Wendy Mak
  text: also, how do you decide whether something is worth running A/B tests on?
  replies:
  - name: David Sweet
    text: One way to do this is to run a simulation before hand.
