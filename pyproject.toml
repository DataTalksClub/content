[project]
name = "datatalksclub-content"
version = "0.1.0"
description = "Structured editorial content for DataTalks.Club"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["articles", "books", "podcasts"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
