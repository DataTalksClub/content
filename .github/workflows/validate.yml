name: Validate content

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_FROZEN: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned legacy source
        uses: actions/checkout@v4
        with:
          repository: DataTalksClub/datatalksclub.github.io
          ref: ee43d3fa0929faf691178d79f19528e6f15a83e5
          path: .tmp/legacy-source

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Validate content and tooling
        run: make check

      # Migration counts and changed-path attestations describe a frozen release,
      # not the growing editorial catalogue. Current HEAD is validated above.
      - name: Check out immutable migration release
        uses: actions/checkout@v4
        with:
          ref: 9ad8f5001426734a4e3854c1e1936009fa774868
          fetch-depth: 0
          path: .tmp/migration-baseline

      - name: Verify immutable migration and repair overlay
        working-directory: .tmp/migration-baseline
        run: make verify-source SOURCE=../legacy-source

      - name: Emit immutable release attestations
        working-directory: .tmp/migration-baseline
        run: |
          make attest COMMIT="$(git rev-parse HEAD)" OUTPUT=.tmp/attestation/missing-media-repair.json
          make attest-source-correction COMMIT="$(git rev-parse HEAD)" OUTPUT=.tmp/attestation/source-correction.json

      - name: Upload immutable release attestations
        uses: actions/upload-artifact@v4
        with:
          name: immutable-migration-release-${{ github.sha }}
          path: .tmp/migration-baseline/.tmp/attestation/*.json
          if-no-files-found: error
          retention-days: 30
